<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モンスター図鑑 - DQMⅥ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@200;300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#070912; --ink:#eceffa; --muted:#8d95b2;
    --gold:#e3c07d; --gold-lt:#f7e3b8; --violet:#6b5cff; --cyan:#49d8d0;
    --line:rgba(255,255,255,.10); --surface:rgba(255,255,255,.035);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }
  h1 { font-size: 20px; margin-bottom: 4px; font-weight:700; }
  a { color: var(--gold-lt); }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .links { font-size: 13px; margin-bottom: 16px; color: var(--muted); }
  .links a { color: var(--gold); text-decoration:none; }
  .links a:hover { color: var(--gold-lt); text-decoration:underline; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:700; margin:16px 0 10px; color: var(--ink); }
  .notice { background:rgba(227,192,125,.08); border:1px solid rgba(227,192,125,.35); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px; color: var(--ink); }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:var(--gold); border-color:var(--gold); color:#1a1506; font-weight:700; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }
  .empty { color: var(--muted); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; color:var(--ink); }
  .entry-stats { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }
  .boss-rotation { font-size:13px; margin:6px 0 0; padding-left:20px; }
  .boss-rotation li { margin-bottom:2px; }
  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; color:var(--ink); }
  .guide-section h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }

  .monster-icon { width:28px; height:28px; image-rendering:pixelated; vertical-align:middle; margin-right:8px; border-radius:6px; background:rgba(255,255,255,.06); }
</style>
</head>
<body>
  <h1>モンスター図鑑(全0体)</h1>
  <p class="updated" id="updated"></p>
  <p class="links"><a href="index.html">配合表トップ</a> ＞ <a href="wiki.html">攻略Wiki</a> ＞ モンスター図鑑</p>
  <details>
    <summary class="section-toggle">レベル帯ごとのHP成長幅(凡例)</summary>
    <div class="table-wrap"><table><thead><tr><th>レベル帯</th><th>そのレベル帯でのHP上昇量の目安</th></tr></thead><tbody><tr><td>Lv1〜30</td><td>5〜20</td></tr><tr><td>Lv31〜60</td><td>20〜40</td></tr><tr><td>Lv61〜80</td><td>50〜80</td></tr><tr><td>Lv81〜300</td><td>50〜90</td></tr></tbody></table></div>
  </details>
  <p style="font-size:13px; margin:8px 0;"><a href="biomes.html#habitatSelect"><strong>バイオームごとの出現モンスター一覧はこちら</strong></a>(バイオームを選ぶと出やすいモンスターが出ます)</p>
  <div class="tab-buttons" id="rankTabs"></div>
  <div class="controls">
    <input type="search" id="searchInput" placeholder="名前・種族・生息バイオーム・呪文で絞り込み">
  </div>
  <div id="content"></div>

  <script id="page-data" type="application/json">{"monsters":[],"biomeNames":{},"generatedAt":"2026/11/13 22:07:55(攻略情報: DQMVII 1.07.06)"}</script>
  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var monsters = data.monsters;
    var biomeNames = data.biomeNames;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }

    function habitatHtml(m) {
      var h = m.hab;
      if (!h) return '';
      if (h.none) return '<br>生息バイオーム: 自然にはスポーンしない';
      if (h.all) return '<br>生息バイオーム: すべてのバイオーム' + (m.habCond ? '(条件: ' + escapeHtml(m.habCond) + ')' : '');
      return '<br>生息バイオーム: ' + h.biomes.map(function (id) {
        var name = biomeNames[id] || id;
        return id.indexOf('dqmvii:') === 0
          ? '<a href="biomes.html#biome-' + escapeHtml(id.replace('dqmvii:', '')) + '">' + escapeHtml(name) + '</a>'
          : escapeHtml(name);
      }).join('、') + (m.habCond ? '(条件: ' + escapeHtml(m.habCond) + ')' : '');
    }
    function formatStatRange(r) {
      if (!r) return '不明';
      return r.min === r.max ? String(r.min) : (r.min + '〜' + r.max);
    }

    var activeRank = 'all';
    var RANKS = ['all', 1, 2, 3, 4, 5, 6, 7]; // 絞り込みはゲーム内図鑑と同じ「出現ランク」。配合ランクは各モンスターのバッジで確認できる

    function renderRankTabs() {
      document.getElementById('rankTabs').innerHTML = RANKS.map(function (r) {
        var label = r === 'all' ? '全ランク' : ('出現ランク' + r);
        return '<button class="tab-btn' + (r === activeRank ? ' active' : '') + '" data-rank="' + r + '">' + label + '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#rankTabs .tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeRank = btn.dataset.rank === 'all' ? 'all' : Number(btn.dataset.rank);
          renderRankTabs();
          render();
        });
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var html = monsters.filter(function (m) {
        if (activeRank !== 'all' && m.bandRank !== activeRank) return false;
        if (!query) return true;
        var spellsText = (m.spells || []).map(function (s) { return s.name; }).join('、').toLowerCase();
        var habText = m.hab ? m.hab.biomes.map(function (id) { return biomeNames[id] || id; }).join('、').toLowerCase() : '';
        return m.nameJa.toLowerCase().indexOf(query) !== -1 ||
          (m.species || '').toLowerCase().indexOf(query) !== -1 ||
          habText.indexOf(query) !== -1 ||
          spellsText.indexOf(query) !== -1;
      }).map(function (m) {
        var spellsHtml = (m.spells && m.spells.length)
          ? m.spells.map(function (s) { return 'Lv' + s.level + ' <a href="spells.html#spell-' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</a>'; }).join('、')
          : '(なし)';
        var iconHtml = m.icon ? '<img class="monster-icon" src="' + escapeHtml(m.icon) + '" alt="">' : '';
        return '<details class="entry" id="monster-' + escapeHtml(m.id) + '"><summary>' + iconHtml + '#' + (m.dexOrder + 1) + ' <strong>' + escapeHtml(m.nameJa) +
          '</strong> <span class="badge">出現ランク' + (m.bandRank != null ? m.bandRank : '-') + '</span> ' +
          '<span class="badge" style="border-color:var(--line); color:var(--muted);">配合ランク' + escapeHtml(m.rankLabel || '-') + '</span></summary>' +
          '<div class="entry-stats">Lv1時点の目安(個体差あり): HP:' + formatStatRange(m.hp) + ' MP:' + formatStatRange(m.mp) +
          ' 攻撃:' + formatStatRange(m.attack) + ' 守備:' + formatStatRange(m.defense) +
          ' 魔力:' + formatStatRange(m.magicPower) + ' 魔守備:' + formatStatRange(m.magicDefense) +
          '<br>種族:' + escapeHtml(m.species || '-') + ' 弱点:' + escapeHtml(m.weakness || '-') + ' 出現時間帯:' + escapeHtml(m.dayTime || '-') +
          (m.band ? ' 出現レベル帯:' + escapeHtml(m.band) : '') +
          habitatHtml(m) +
          (m.fireImmune ? '<br>炎耐性あり' : '') +
          (m.xpReward != null ? '<br>倒したときの経験値目安:' + m.xpReward + '(DQ風EXP:' + m.dqExperience + ' ゴールド:' + m.dqGold + ')' : '') +
          '<br>覚える呪文: ' + spellsHtml + '</div></details>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当するモンスターがいません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    renderRankTabs();
    render();

    expandHashDetails();
  })();
  </script>
</body>
</html>
