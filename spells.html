<style>
  :root {
    --bg:#070912; --ink:#eceffa; --muted:#8d95b2;

  * { box-sizing: border-box; }
  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }
  h1 { font-size: 20px; margin-bottom: 4px; font-weight:700; }
  a { color: var(--gold-lt); }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .links { font-size: 13px; margin-bottom: 16px; color: var(--muted); }
  .links a { color: var(--gold); text-decoration:none; }
  .links a:hover { color: var(--gold-lt); text-decoration:underline; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:700; margin:16px 0 10px; color: var(--ink); }
  .notice { background:rgba(227,192,125,.08); border:1px solid rgba(227,192,125,.35); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px; color: var(--ink); }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:var(--gold); border-color:var(--gold); color:#1a1506; font-weight:700; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }
  .empty { color: var(--muted); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; color:var(--ink); }
  .entry-stats { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }
  .boss-rotation { font-size:13px; margin:6px 0 0; padding-left:20px; }
  .boss-rotation li { margin-bottom:2px; }
  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; color:var(--ink); }
  .guide-section h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
</style>

  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var spells = data.spells;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }


    var activeFilter = 'all';
    var FILTERS = [
      { id: 'all', label: 'すべて' },
      { id: 'implemented', label: '実装済み' },
      { id: 'unimplemented', label: '未実装' },
    ];

    function renderTabs() {
      document.getElementById('implTabs').innerHTML = FILTERS.map(function (f) {
        return '<button class="tab-btn' + (f.id === activeFilter ? ' active' : '') + '" data-filter="' + f.id + '">' + f.label + '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#implTabs .tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeFilter = btn.dataset.filter;
          renderTabs();
          render();
        });
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var html = spells.filter(function (s) {
        if (activeFilter === 'implemented' && !s.implemented) return false;
        if (activeFilter === 'unimplemented' && s.implemented) return false;
        if (!query) return true;
        var monstersText = s.learnedByMonsters.map(function (m) { return m.name; }).join('、').toLowerCase();
        var jobsText = s.learnedByJobs.map(function (j) { return j.name; }).join('、').toLowerCase();
        return s.name.toLowerCase().indexOf(query) !== -1 ||
          monstersText.indexOf(query) !== -1 ||
          jobsText.indexOf(query) !== -1;
      }).map(function (s) {
        var effectHtml = '';
        if (s.effect) {
          if (s.effect.kind === 'attack') {
            effectHtml = '<p><strong>効果:</strong> 属性' + escapeHtml(s.effect.schoolLabel) + ' / ' + escapeHtml(s.effect.shapeLabel) +
              ' / MP消費' + s.effect.mp + ' / 威力' + s.effect.power +
              (s.effect.areaRadius ? ' / 効果範囲半径' + s.effect.areaRadius + 'm' : '') + '</p>';
          } else if (s.effect.kind === 'buff') {
            effectHtml = '<p><strong>効果:</strong> 対象' + (s.effect.isPartyWide ? 'パーティ全員' : '単体') +
              ' / MP消費' + s.effect.mp + ' / ' + escapeHtml(s.effect.effectLabel) +
              (s.effect.effectDetail ? '(' + escapeHtml(s.effect.effectDetail) + ')' : '') +
              ' / 効果時間' + s.effect.durationSeconds + '秒' + (s.effect.amplifier ? ' ・強化Lv' + s.effect.amplifier : '') +
              (s.effect.isPartyWide ? '</p><p class="empty">パーティ全員対象: プレイヤーは距離無制限、テイム済みペットは術者から半径16マス以内にいないと対象外になります。</p>' : '</p>');
          } else if (s.effect.kind === 'heal') {
            effectHtml = '<p><strong>効果:</strong> 対象' + (s.effect.isPartyWide ? 'パーティ全員' : '単体') +
              ' / MP消費' + s.effect.mp + ' / 回復量' + s.effect.power +
              (s.effect.isPartyWide ? '</p><p class="empty">パーティ全員対象: プレイヤーは距離無制限、テイム済みペットは術者から半径16マス以内にいないと対象外になります。</p>' : '</p>');
          } else if (s.effect.kind === 'revive') {
            effectHtml = '<p><strong>効果:</strong> MP消費' + s.effect.mp + ' / 蘇生成功率' + s.effect.successPercent + '%' +
              (s.effect.hpRatio ? (' / 復活後HP:最大HPの' + Math.round(s.effect.hpRatio * 100) + '%') : (s.effect.fixedHp ? ' / 復活後HP:' + s.effect.fixedHp : '')) + '</p>';
          }
        }
        var monstersHtml = s.learnedByMonsters.length
          ? '<h3>覚えるモンスター(' + s.learnedByMonsters.length + '体)</h3><ul class="boss-rotation">' +
            s.learnedByMonsters.map(function (m) { return '<li>Lv' + m.level + ' <a href="monsters.html#monster-' + escapeHtml(m.id) + '">' + escapeHtml(m.name) + '</a></li>'; }).join('') + '</ul>'
          : '';
        var jobsHtml = s.learnedByJobs.length
          ? '<h3>覚える職業(' + s.learnedByJobs.length + '職業)</h3><ul class="boss-rotation">' +
            s.learnedByJobs.map(function (j) { return '<li>Lv' + j.level + ' <a href="jobs.html#job-' + j.jobId + '">' + escapeHtml(j.name) + '</a></li>'; }).join('') + '</ul>'
          : '';
        var randomHtml = s.randomLearn
          ? '<p>ランダム追加習得: Lv' + s.randomLearn.learnLevel + '到達時に1/' + s.randomLearn.denominator + 'の確率で追加習得(全モンスター共通)</p>'
          : '';
        var emptyHtml = (!s.implemented)
          ? '<p class="empty">習得経路が確認できません(モンスターの固定/ランダム習得、職業の習得のいずれにも出現しないため、データ上ID・名前は存在するが未実装と判定しています)</p>'
          : '';
        return '<details class="entry" id="spell-' + escapeHtml(s.spellId) + '"><summary><strong>' + escapeHtml(s.name) +
          '</strong> <span class="badge">' + (s.implemented ? '実装済み' : '未実装') + '</span></summary>' +
          '<div class="entry-stats">' + effectHtml + monstersHtml + jobsHtml + randomHtml + emptyHtml + '</div></details>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当する呪文がありません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    renderTabs();
    render();
    expandHashDetails();
  })();
  </script>
