        '<ol class="boss-rotation">' + rulesHtml + '</ol></details>';
    }).join('');
    document.getElementById('presetsContent').innerHTML = presetsHtml || '<div class="empty">プリセットがありません</div>';

    var TYPE_LABELS = { target: '対象', cond1: '条件1', cond2: '条件2', action: '行動' };
    var TYPES = ['target', 'cond1', 'cond2', 'action'];
    var activeType = 'target';

    function renderTypeTabs() {
      document.getElementById('typeTabs').innerHTML = TYPES.map(function (t) {
        return '<button class="tab-btn' + (t === activeType ? ' active' : '') + '" data-type="' + t + '">' + TYPE_LABELS[t] + '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#typeTabs .tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeType = btn.dataset.type;
          renderTypeTabs();
          renderTypeContent();
        });
      });
    }

    function renderTypeContent() {
      var items = data.byType[activeType] || [];
      var rows = items.map(function (item) {
        return '<tr><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.kind || '-') + '</td><td>' + escapeHtml(item.note || '-') + '</td></tr>';
      }).join('');
      document.getElementById('typeContent').innerHTML =
        '<div class="table-wrap"><table><thead><tr><th>名前</th><th>種類</th><th>説明</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="3" class="empty">該当する項目がありません</td></tr>') + '</tbody></table></div>';
    }

    renderTypeTabs();
    renderTypeContent();
  })();
  </script>
</body>
</html>
