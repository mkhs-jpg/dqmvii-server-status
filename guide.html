50%・中+100%・大+200%。"},{"id":"h_gear_rank","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"装備の強さのランク","body":"装備には強さのランク(1〜12)がある。装備が手に入る道(宝箱・名品の宝箱・物語や小話のごほうび・中ボスや魔王の落とし物・キラキラ・釣りや遺物の鑑定・錬金・魔物の落とし物など)は、どれもその道のランク+1 までの強さの品が出るように作ってある(ランク3の世界の宝箱なら、ランク4の強さまで)。⏎手に入れた装備と、持っている装備は、あとから別の品に変わらない(★や名品の品質・打ち直し・ダンジョンの力もそのまま)。⏎設計図は行ったことのあるいちばん高いランク+1 の品まで出て、鍛冶で作れるのもその強さまで(それより強い品は「ランクNの世界に行くと作れる」)。カジノの景品はそのランクへ行くまで交換できない。図鑑の節目と闘技場の完全制覇の首飾り・竜玉は、そのランクへ行くまで預かってもらえる(行ったあとで受付を開くか、魔物を倒すと受け取れる)。⏎メダル王のスタンプラリーの景品は、世界に1つの特別な品なので、この決まりの外。"},{"id":"h092","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"武器屋・防具屋","body":"はじめに、そのお店の「ランクの品」6〜8品が並ぶ(武器は種類・防具は部位がなるべくかぶらないように選ぶ・お店のある世界のランクに合った強さの装備から、お店ごとにランダムな品と並びで)。この12品は現実の時間で10時間ごとに全部入れかわる(サーバーを止めていても時間は進む・入れかわるまでは何度開いてもだれが開いても同じ品)。入れかわるまでの時間は、お店の画面の上に「品物の入れかえまで あと○時間○分」と出る。そのあとに、自分で作ったことのある装備が並ぶ。⏎ときどき、金の札「限定」の品(その世界より1つ上のランクの装備・ふだんの1.5倍の値段・1つだけ)が一覧のいちばん上に、赤の札「○%OFF」のセール品(5〜70%引き・大きな値引きはめったに出ない)が並ぶことがある。どちらも画面を閉じると消える。一度どちらかが出ると、1時間はどの武器屋・防具屋でも出ない。セール品を売るときの値段はふだんと同じ。"},{"id":"h093","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"道具屋","body":"薬草・毒消し草・花のみつ・せかいじゅの葉・キメラのつばさ・ガンビットを売っている。回復の品は、お店のある世界のランクが高いほど増える(ランク2 上やくそう / 3 超薬草 / 4 特やくそう・上どくけしそう / 5 万能薬・いやしそう / 7 あやしい小ビン)。それより強い回復の品はお店では売っていない(拾う・宝箱・鍛冶・農業で)。種(苗)は売っていない。⏎『かんてい』ができるのは道具屋だけ。出荷依頼の受付もここ(しゃがみ右クリック)。"},{"id":"h216","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"まとめて売り買い","body":"店の一覧で Shift＋左クリックすると、何品でも選べる(もう一度で外す・ふつうのクリックで1つの選び直し)。右の欄の「まとめてかう／まとめてうる」から、確かめの窓で品と数と合計を見て「はい」で一度に売り買いする。⏎かうは、選んだ品をどれも「1品の数」ずつ(装備など1つずつしか買えない品は1つ)。所持金が全部の代金に足りないときは、何も買わない。⏎うるは、選んだ品をどれも持っている数ぜんぶ売る。袋とペット収納ベルは中身ごと売れてしまうので、まとめては選べない(1つずつ売る)。⏎うるの「袋の中」の札では、持っている大きな袋の中身を見て1品ずつ売れる(袋が2つ以上なら一覧の上の ◀ ▶ で切りかえ・売る数を選べる・ダブルクリックと Shift＋左クリックのまとめ売りも使える)。メダル王の景品とペット収納ベルは袋の中でも売れず、それが入った袋は袋ごとも売れない。Minecraft のブロックやアイテムと、値段の無い品は売れない。"},{"id":"h094","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"神父","body":"旅の扉のほこらなどにいる神父は、気絶したペットを生き返らせてくれる(まわり16マスとベルの中のペット・料金はLv×10G)。⏎1回目に話しかけると確認だけ。30秒以内にもう一度話しかけると生き返らせる。⏎中ボスの拠点のある世界では、話しかけると「おともだちを 生きかえらせる」「中ボスの拠点を ただす」を選べる。ただすと、まだだれも倒していない中ボスの拠点で、祭壇や建物が消えていたり建てられずに止まっていたりする所を直す(乱れの無い所・倒した所は何もしない・直したときだけ世界ごとに1日1回)。⏎「ダンジョンを ただす」は、直前(30分以内)に入ったこの世界のダンジョンを建て直す(宝箱やはしごが縦に積み重なった・同じ建物が上にもう1つ建った・崩れたダンジョンなど)。下に前の建物が残っていれば前の高さで建て直す。開けた宝箱・開けていない宝箱は中身ごとそのまま、あとから置いたブロックは消える。遠くにいてもただされ、終わるとチャットで知らせる。1人1日1回。"},{"id":"h095","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"カジノ","body":"コインを稼いで景品と交換。性格の書やすごろく券などの珍しい品も。勝負はほどほどに。"},{"id":"h096","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ダンジョン","title":"ダンジョンと石板・黒","body":"ダンジョンはランクの世界の決まった場所にあり、近くへ行くと建つ。奥ほど良い宝が眠る。⏎いちばん奥の金の宝箱のそばの「石板・黒」に触れると、建物リストに載り、そのダンジョンは「済」になる。⏎天空への塔のように、てっぺんの置き台のそばに石板・黒があるダンジョンもある。⏎そのランクの世界のダンジョンの石板・黒を全部記し、そのランクの中ボスを全部倒すと、ランクの魔王の祭壇が目を覚ます。⏎本家のダンジョン(ロトの洞窟など20か所・「本家のダンジョン」の項)は石板・黒ではなく石板・金なので、魔王の祭壇の条件には入らない。⏎ランダムダンジョンのいちばん上のボスの階は、奥の部屋へ通じる通路が「壊れる壁」でふさがれている。壊れる壁はみな壊して進める(前からある世界のランダムダンジョンも、近くへ来たときに壊れない壁が壊れる壁に変わる)。"},{"id":"h_canon_dg","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ダンジョン","title":"本家のダンジョン","body":"ランクの世界には、本家ドラゴンクエストにあってまだ無かったダンジョンが20か所ある(近くへ行くと建つ・前からある世界にも建つ。海の2つ〈幽霊船・海底都市〉は海底ダンジョンと同じく、これから作る世界だけ)。⏎【ランク1】ロトの洞窟(ロトの石版)・ガライの墓(銀のたてごと)⏎【ランク2】ロンダルキアへの洞窟(落とし穴の大広間・ループの回廊)⏎【ランク3】ナジミの塔(海の下の地下道から入る)・ガルナの塔(綱わたり)・地球のへそ・幽霊船(海に浮かぶ船)・ルビスの塔(闇のアレフガルド)⏎【ランク4】王家の墓・魔神像(像の中を足から頭へ登る)⏎【ランク5】古代の遺跡・封印の洞窟(魔界の門)⏎【ランク6】天馬の塔(1階からは上へ行けない)・魔術師の塔⏎【ランク7】世界一高い塔(10階)・海底都市(海の上の門の楼から海の底へ)⏎【ランク8】剣士像の洞窟⏎【ランク9】ドミール火山⏎【ランク10】王家の迷宮(地下9階まで)⏎【ランク11】古代図書館(本棚の通路)⏎小さなダンジョンと中くらいのダンジョンは、いちばん奥に名品の宝箱(人ごとに1回)がある。⏎大きなダンジョン(ロンダルキアへの洞窟・ルビスの塔・天馬の塔・世界一高い塔・海底都市・ドミール火山・王家の迷宮・古代図書館)は、いちばん奥の玉座に番人が座っている。近づくと台詞が始まり、魔王の間で戦う(中ボスの拠点と同じ・何度でも戦える・強さはそのランクの魔王のおよそ7割)。⏎どれも奥の建物ブロック(石板・金)に触れると建物リストに記す。番人と石板・金は、魔王の祭壇の目覚める条件・中ボスの数には入らない。⏎しかけは少しだけ(ダメージの床・落とし穴〈落ちた下の階から、はしごで戻れる〉)。中はブロックを壊すことも置くこともできない(クリエイティブは除く)。⏎ルーラ・キメラの自動登録には入口の前が入る。ガライの町の物語「ガライの墓と 銀のたてごと」の舞台は、このガライの墓。"},{"id":"h_dungeon_puzzle","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ダンジョン","title":"ダンジョンの謎解き(あり／なし)","body":"ロック三兄弟の山・賢者の塔・ヘルクラウド・トロッコ洞窟・魔王の城 など20か所のダンジョンは、はじめはレッドストーンやトロッコのしかけ(謎解き)を外した形で建つ。⏎DQM設定の「ダンジョン」のタブで、1か所ずつ「謎解きあり」(前のしかけのある形)にできる(「全部ありにする」「全部なしにする」でまとめても変えられる)。⏎設定はこれから建つダンジョンに効く。もう建っているダンジョンの形を変えたときは「建て直しますか？」と聞かれ、はいを選ぶと同じ場所に新しい形で建て直す(開けた宝箱・開けていない宝箱・石板・小さなメダルはそのまま残り、中にいる人は入口へ出る・OPだけ)。いいえなら、建ったときの形のまま。謎解きありは、しかけが動かないと宝箱やボスへ行けないことがある。"},{"id":"h_meihin","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ダンジョン","title":"ダンジョンの名品","body":"ランクごとのボスのダンジョン(魔王の城)と、各ランクの大きな建物(城・塔・神殿・洞くつなど)のいちばん奥の宝箱は「名品の宝箱」。海底ダンジョンの奥の宝箱も名品の宝箱だが、実績は「名品の宝箱をすべて」(32か所)とは別に、海底ダンジョンごとの実績で数える。開けると、その場所ならではの名品(その世界のランクより1段上のアクセや装備・錆びたロトの装備などの「名品のもと」・オーブなど)を持ち物に受け取れる。⏎名品は人ごとに1回だけ。マルチでも、それぞれが1回ずつ受け取れる。80%で職業の証かサブ職業の証もいっしょに入る。名品の宝箱は壊せない(ペットのガンビットも中身だけ渡して宝箱は残す)。⏎錆びたロトの装備や貴重なレシピは、鍛冶で伝説の装備に鍛え直せる。⏎名品の宝箱には、そのほかにその宝箱のランクの設計図が1枚と装備が1つ必ず入っている(設計図はまだ記していないものが出やすい)。"},{"id":"h097","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ダンジョン","title":"明かりと松明","body":"明かり(ブロックの明るさ1以上)のある所には、魔物が自然に湧かない。⏎ただしダンジョン・魔王の城・中ボスの拠点・大きな建物の中は、明かりがあっても湧く(ダンジョン用マジックツールで置いた光のまわりだけは湧かない)。ここではニフラムブロックも効かない。⏎魔王の城と中ボスの拠点はブロックを置けないが、たいまつ・ランタン・ダンジョン用の光は置けて、置いた明かりは外して取り戻せる。⏎町と城(城と城下町・町や村・お店・宿・神殿の都など)には魔物が出ない。野生の魔物は入ってこられず、中にまぎれた魔物は消える(町の中のダンジョンは今どおり出る・町の物語で出る敵は別)。⏎マジックツール(ダンジョン用・ダンジョン破壊)を持っていると、暗い屋内で松明を自動で置く。マジックツールを持ち物に入れて、松明を持ってブロックにShift+右クリックで補充(10本以上なら10本で20回ぶん、それより少なければ1本で2回ぶん)。⏎光アイテムでも補充できる(光の石300・たいようの石100・れんごくの羽根20・溶岩石のかけら20)。"},{"id":"h098","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"ランクの魔王の祭壇","body":"ランクの世界ごとに1つ、魔王の祭壇がある(近くへ行くと建つ。ランク1〜11はボスのダンジョンの奥にあることが多い)。⏎そのランクの世界(別の世界も含む)のダンジョンの石板・黒を全部記し、そのランクの中ボス(ランク1〜6)を全部倒すと目を覚ます。眠っている祭壇に触れると、残りの数と、まだの石板・黒と中ボスの名前・おおよその方角が出る(DQMメニューの「周辺情報」でも見られる)。⏎ランクの世界にいる間は、HUDのクエストの欄に「魔王の祭壇への道：石板・黒 a/b・中ボス c/d」が出る(目覚めたら祭壇の方角と道のり・その魔王を倒すと消える)。できごと帳の「魔王への道」で、画面に出す印も付けられる。はじめてランクの世界に入ると、ルルも教えてくれる。⏎祭壇のうしろの玉座には、そのランクの魔王が座っている(見えるだけで、殴っても呪文や弓を撃っても当たらない)。⏎目覚める前は、魔王の城の入口が壊せない結界でふさがれていて、城の中へ入ろうとすると「まがまがしい力に はばまれた…」と外へ押し戻される(ルーラ・キメラのつばさで中に着いても入口の前へ戻される)。城の無い祭壇は、玉座のまわり10マスに入れない。目覚めると結界は消える。⏎目覚めたあと、座った魔王に5マスまで近づくと戦いの前の台詞が始まり、読み終えると魔王の間へ引きずり込まれて戦う(はじめての台詞はとばせない。一度見た魔王は次から ESC でとばせる)。戦いが終わると祭壇の前へ戻る。装備・仲間の準備を整えてから近づこう。⏎だれかが倒すと座った魔王は消え、そのあとは祭壇に触れれば何度でも再戦できる。⏎魔王を倒すと、同じパーティで同じ世界の64マス以内にいた仲間も「倒した」に記される(放置中の人は除く・ゴールドはとどめの人だけ)。"},{"id":"h_midboss","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"中ボスの拠点","body":"ランク1〜12の世界には、本家の中ボスの拠点がある(近くへ行くと建つ。施設や目玉の建物をそのまま使う所もある)。⏎【ランク1】沼地の洞窟(ドラゴン)・城塞都市メルキド(ゴーレム)・ドムドーラの廃墟(あくまのきし)・迷いの森(ダークドリーマー)・妖精の隠れ里(ドラゴンゾンビ)⏎【ランク2】風の塔(まどう老師)・大灯台(ネコノマンサー)・妖精の城(ベリアル)・なぞの海底基地(ミリエラ)・満月の塔(クレセンス)・ルビスのほこら(アトラス)・海底火山の洞窟(バズズ・海底の洞窟の世界)⏎【ランク3】シャンパーニの塔(カンダタ)・ピラミッド(ナイルのあくま)・ネクロゴンドの洞くつ(バラモスブロス・前の版でおろちのどうくつ〈やまたのおろち〉が建った世界はそちらのまま)・サマンオサ城(ボストロール)・バラモス城(バラモス)⏎【ランク4】キングレオ城(キングレオ)・サントハイム城(バルザック)・地獄の帝王の城(エスターク)・闇の世界の結界のほこら4つ(南東 アンドレアル・南西 ギガデーモン・北東 エビルプリースト・北西 ヘルバトラー)⏎【ランク5】レヌール城(おやぶんゴースト)・氷の館(ゆきのじょおう・妖精の世界)・デモンズタワー(ジャミ)・ボブルの塔(ゴンズ)・見はらしの塔(ブオーン)・セントベレス山の大神殿(イブール)⏎【ランク6】ムドーの城(ムドー)・しあわせの国(ジャミラス・上の世界)・海底神殿(グラコス)・ヘルクラウド城(デュラン・上の世界)・牢獄の町(アクバー・はざまの世界)⏎【ランク7】からくり兵団の拠点(デスマシーン)・グラコスの間(グラコス)・大灯台(バリクナジャ)・マーディラス城(ゼッペル)・ダーマ廃墟(アントリア)・魔空間の神殿(オルゴ・デミーラ・過去の2つの姿の2連戦)。過去の世界の島の主8体(マチルダ・ネリス・スカイドラゴン・やみのドラゴン・ヘルクラウダー・ゴーレム・ボトク・炎の巨人)も中ボスで、島の封印の祭壇でその場で戦う(封印が解ければ倒したことになる)⏎【ランク8】闇の遺跡(ドルマゲス)・王家の山(アルゴングレート)・モグラのアジト(ドン・モグーラ)・闇の神鳥の巣(妖魔ゲモン・闇の世界)・法皇の館(魔犬レオパルド)・竜骨の迷宮(ジャハガロス)⏎【ランク9】ルディアノ城(妖女イシュダル)・ダーマの塔(魔神ジャダーマ)・エルシオン学院(魔教師エルシオン)・まじゅうの洞窟(大怪像ガドンゴ)・カデスの牢獄(ゴレオン将軍)⏎【ランク10】冥王の心臓(冥獣王ネルゲル)・聖都エジャルナの大神殿(邪竜神ナドラガ・竜の領界)・エテーネ王宮と時計塔(時元神キュロノス・古代エテーネ)・炎獄王の座(絶対滅神ジャゴヌバ・大魔王の魔界)・魔眼の月(ジア・メルド・ゲノス・天星郷)・天の雷砲(女神ゼネシア・果ての大地)⏎【ランク11】グロッタ地下遺構(アラクラトロ)・ユグノア城跡(嘆きの戦士)・海底王国ムウレア(覇海軍王ジャコラ)・崩壊後のデルカダール城(屍騎軍王ゾルデ)・グロッタの町 モンスターカジノ(妖魔軍王ブギー)・黄金城(鉄鬼軍王キラゴルド)・天空の古戦場の遺跡(さまようロトのよろい・ロトゼタシアの空)⏎【ランク12】スライムエンペラーの王宮(スライムエンペラー)・しっぽ団のアジト(しっぽ団のキラーマシン)・黒怨の城(黒怨王)・海に沈んだ神殿(魔天海フォルネー・旅人の浜)⏎中ボスは拠点の奥の玉座に座って待っている(見えるだけで、攻撃は当たらない)。5マスまで近づくと戦いの前の台詞が始まり、読み終えると魔王の間へ移って戦う(はじめての台詞はとばせない・一度見た中ボスは次から ESC でとばせる)。戦いが終わると祭壇の前へ戻る。過去の世界の島の主も封印の祭壇のうしろに座っていて、台詞のあとその場で戦いになる。⏎だれかが倒すと座った中ボスは消え、そのあとは祭壇に触れれば何度でも戦える(封印は無い。島の主は1回だけ)。ただし新しく戦いを始められるのは、1つの拠点につき1人30分に1回。倒したあと、遊んでいる時間で30分たつと(寝ても進まない)、また戦える(負けたときは数えない・ほかの人が始めた戦いに加わるのは止めない)。倒すと最後の一言を残す。強さはそのランクの魔王のおよそ7割。本家のボスがいない所は、姿の似た魔物が本家の名前で現れる。⏎はじめて倒すと、5,000×ランクのゴールドと、ランク+1の鍛冶の設計図が1枚もらえる(人ごとに1回)。2回目からは1,000×ランクのゴールド。⏎だれかが倒すと(ワールド単位)、そのランクの魔王の祭壇が目覚める条件の1つがそろう。新しく建つ拠点は、入口のそばの石板・金に触れると建物リストに載る。⏎ランク2の魔王はハーゴン(破壊神の祭壇)。バズズは海底火山の洞窟の中ボスになった。ランク7の魔王はデスキングレオから天魔王オルゴ・デミーラになった(前にデスキングレオを倒していれば、倒したことになる)。⏎倒すとそのランクの中ボスの魔石が手に入る(はじめて倒した拠点は3個・2回目からは1個とときどきもう1個。魔王の間にいる人みんなに)。⏎拠点の中は、魔王の城と同じく ブロックを壊す・置く・バケツを使うことができない(爆発・ピストン・外からの水や溶岩も止まる。クリエイティブは除く)。⏎拠点の中は、魔王の城と同じく、ブロックを壊すことも置くこともできない(しかけの「壊れる壁」は壊せる・「ボスのダンジョンと魔王の塔」の項)。⏎中ボス(島の主・海底ダンジョンのボス・神竜の天界の主も)を倒すと、同じパーティで同じ世界の64マス以内にいた仲間も「倒した」に記され、ごほうびも1人ずつもらえる(放置中の人は除く)。"},{"id":"h_maouweak","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"魔王の弱点の行い","body":"魔王には、それぞれ「弱点の行い」がある。うまくつくと大きなダメージが入ったり、魔王が体勢をくずして しばらく動けなくなったりする(体勢をくずしている間は受けるダメージ2倍)。体勢を立て直すまで(くずしていた長さの2倍)は、弱点の行いをしても次の「体勢をくずす」は貯まらない。⏎弱点の行いは魔王ごとにちがう。戦いの前の一言や、戦いの中の魔王のようすがヒントになる。何をすればよいかは、自分で見つけてみよう。⏎ジャンプや溜めなど体の動きの弱点には、呪文で応じる形もある(その魔王によく効く属性の呪文か、上位の攻撃呪文)。合図のお題も、攻撃の呪文を当てれば数えられる。⏎魔王が何かの合図を見せたら、頭の上に砂時計の輪が出る。輪が消えるまでに うまく応じれば、大技を止められる。間に合わなくても いつもの技が来るだけ。⏎弱点の行いをしなくても倒せる(少し時間がかかるだけ)。⏎一度戦った魔王は、戦いの始めに画面の上の札で弱点の行いを教えてくれる。倒した魔王は、モンスター図鑑のページにも書かれる。札は GUI位置調整の「魔王の弱点のお題」で動かせる。⏎一部の中ボスにも弱点の行いがある。"},{"id":"h_hidden_god","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"遺跡の奥のあたたかな光","body":"ある世界の魔王を倒すと、その世界の遺跡の奥に あたたかな光が ともるという(光の主が応えてくれるのは、その魔王を自分で倒した人だけ)。⏎◆光のもとには だれかが待っている。近づけば、きっと分かる。⏎◆その主に勝つと、まれに めずらしいアクセサリーを 落とすらしい。何度でも 手合わせできる。"},{"id":"h_bossaggro","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"ボスは攻撃してきた相手を狙う","body":"魔王・中ボス・転生などのボスは、攻撃を当ててきた相手(プレイヤー・仲間のペット・勇者)をしばらく狙って追いかける。⏎遠くから撃ったり、高い所や壁の向こうから攻撃して近づけないときは、呪文や大技で遠くからやり返してくる。離れていても安全ではない。⏎忍び足も、攻撃を当てると解ける。"},{"id":"h_sea","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"海底ダンジョン","body":"ランク1〜12の海に1つずつ、海の底のダンジョンがある(新しく作った世界だけ・陸から離れた深い海)。中はすべて空気で、息の心配はない。⏎【ランク1】アレフガルド沖の沈んだほこら(島のほこら→泡のトンネル)⏎【ランク2】沈没船(折れたマストから泳いで甲板の扉へ)⏎【ランク3】海賊の沈んだ宝の洞くつ(岩の島の桟橋)⏎【ランク4】海鳴りの塔(海の上の舞台のほこら)⏎【ランク5】海の神殿(北の祭壇)(白い柱の輪から泳いで正面の扉へ)⏎【ランク6】海底宝物庫(渦のまん中の柱・奥に番人クラーゴン)⏎【ランク7】サンゴの洞くつ(サンゴ礁の島の船着き場)⏎【ランク8】海竜の住みか(竜の骨の岩から泳いで岩の門へ・奥に海竜)⏎【ランク9】ぬしさまの海底の住みか(小島の岩屋→泡のトンネル・奥に凶ぬしさま)⏎【ランク10】海底都市ルシュカ(竜の領界ナドラガンドの海・白い塔)⏎【ランク11】人魚の入り江の海底洞くつ(入り江の船着き場)⏎【ランク12】タイジュの根の海底迷宮(根の大樹のうろ)⏎いちばん奥に名品の宝箱(人ごとに1回)と建物ブロック(石板・金)。触れると建物リストに記し、ルーラ・キメラの自動登録には入口の前が入る。⏎ランク6・8・9の奥の祭壇に触れると、魔王の間でボスと戦う(何度でも・魔王の祭壇の目覚める条件には数えない)。⏎ダンジョンの中は壊せず、ブロックも置けない。"},{"id":"h_explore","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"冒険","title":"探索の世界","body":"はじまりの神殿の探索の島には、ランク1〜12の「探索の扉」がある。扉は、そのランクの魔王を倒すと開く。⏎探索の世界は、そのランクのバイオームだけでできた、本編よりせまい世界。扉に乗ると、まん中に建つ「旅の扉のほこら」の中に着く。ほこらには本編と同じく、神父・配合の神官・道具屋・武器屋・防具屋がいる(お店の品はその探索の世界のランク)。帰りの旅の扉ははじまりの神殿へ。ほこらのまわりには魔物が近よれない。⏎ほこらのまわりには、そのランクのダンジョンが毎回ランダムに12〜16か所建っていて、宝箱・キラキラ・採集の場所をさがせる。人(NPC)はほこらにしかいない。小さなメダルや物語・依頼もない。⏎◆作り直し: 探索の扉を Shift＋右クリックすると、その世界を作り直せる(だれでも・世界ごとに1日に1回)。作り直すと新しい土地になり、中にいた人は神殿へ戻る。中に置いた物は消える。⏎◆決まり: 遊べるのは、ほこらから半径700マスまで(果てまで行くと押し戻される)。ルーラ・キメラのつばさの行き先には登録できない(脱出には使える)。ベッドやDQMベッドでは休めない。ビルダーの旗・マイホームの設備・農業や鍛冶の設備・防衛戦の旗は置けず、施設生成アイテムも使えない。倒れたら、はじまりの神殿で生き返る。⏎◆宝箱は本編と同じ中身(設計図やダンジョンの力も出る)。職業の証と名品は出ない。"},{"id":"h099","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"討伐の証","body":"魔王の最終形態を倒すと、必ず討伐の証を落とす(まれにレア防具も)。討伐の証は記念品(魔王の証の数の記録)。⏎そのほかに、魔王ごとの「魔王の素材」(竜王のうろこ・邪神官の魔玉など)が手に入る(はじめて倒した魔王は2個・2回目からはときどき1個。魔王の間にいる人みんなに)。最上位の装備の素材になる。"},{"id":"h208","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"魔王の間での戦い","body":"目覚めた魔王の祭壇のうしろの玉座に座った魔王へ近づくと、戦いの前の台詞があり(竜王だけ「はい/いいえ」を聞いてくる)、読み終えると魔王の間へ移る。一度倒した魔王の再戦は、祭壇に触れると魔王の間へ移り、そこで台詞がある。⏎魔王の強さはそのランクの世界のいちばん強い段で、HPがとても多い(倒すまで3分ほど・回復と蘇生がいる)。魔王のふつうの殴りは、受けた人の最大HPの3割まで。何度でも挑める(強さは同じ)。⏎【変身する魔王】竜王は真の姿に、ランク2のハーゴンは倒れると「破壊神シドーよ！今ここに生け贄を捧ぐ！」と破壊神シドーを呼ぶ(2段の合計で1人の魔王ぶんの長さ)。デスピサロは3つの姿。ランク7の天魔王オルゴ・デミーラは 第一形態→第二形態→第三形態→第四形態 の4連戦(4つ合わせて1人の魔王ぶんの長さ・あとの姿ほど攻撃が強い。氷と炎の霧・いてつくはどう・足元の爆発の印・業火の輪・手下のドゴロクとベロドムなど、姿ごとに技が変わる)。ランク6の幻魔王デスタムーアは 第1形態→第2形態→最終形態 の3連戦、ランク8は ラプソーン→暗黒神ラプソーン の2連戦(どちらも合わせて1人の魔王ぶんの長さ・あとの姿ほど攻撃が強い)。ランク11の魔王ウルノーガは5連戦(「ランク11の魔王ウルノーガ」の項)。魔王の塔の屋上の全てを超越せし者は、倒すと「強化」、さらに「覚醒」へ姿を変える3連戦(HPは3つ合わせて1人ぶん・あとの姿ほど攻撃が強い)。⏎【専用技】竜王(はげしいほのお・しゃくねつのほのお)・ハーゴン(死の呪文陣)・破壊神シドー(破壊の連撃)・ゾーマ(こごえるふぶき・闇の衣)・デスピサロ(暗黒の剣舞・進化の秘法・ジゴスパーク)・全てを超越せし者(神の裁き・天罰の十字・時の凍結)は、名前が出たあとに大きな技を使う。予告の輪や扇形を見てよけよう(一撃は最大HPの3割まで)。⏎【魔王のマホカンタ】ゾーマ・デスピサロ(進化の秘法)・エスターク・キラーマジンガ・大魔王ミルドラース・暗黒神ラプソーン・全てを超越せし者と、コインボス(専用のイベント)のスラリンガル・神獣王WORLD・ドン・モジャールは「マホカンタ」を張る。張ると「〇〇は マホカンタを となえた！」と出て、体のまわりに金の光の膜・HPバーの横に「▶マホカンタ」。その間は攻撃と状態異常の呪文(ディバインスペルも)を撃った本人へはね返す(撃った人の最大HPの3割まで・ザキ系は即死せず3割・範囲の呪文も1回ぶん)。回復・補助・魔法剣・特技・息・必殺技ははね返らない。⏎ゾーマ(闇の衣のあと)・キラーマジンガ・全てを超越せし者・覚醒は、マホカンタとアタカンタ(殴りをはね返す)を入れかえる(「魔王戦のギミック」)。ほかは段階の始めや時々張り、しばらくすると「マホカンタの 光の壁が 消えた！」。ペット・勇者ははね返す間は呪文を撃たず、殴りと特技で戦う。プレイヤーや仲間のアタカンタは、魔王の間の魔王・中ボスの攻撃ははね返さない。ペットの特技「いてつく波動」と爪の特技「ゴールドフィンガー」でマホカンタをはがせる。⏎魔王を倒すと、スキルパネルの魔王のしるしが取れるようになる(ランク1〜11は魔王の証とゴールドも・はじめて倒したときはスキルポイント+50)。10秒後に祭壇の前へ戻される。⏎魔王の間で力尽きたときは、そのたびに死んだときの画面で「祭壇の前で生き返る」(すぐ挑みなおせる)か「ベッドで生き返る」(ベッドが無ければはじまりの神殿)を選べる。選ばずに「リスポーン」を押すと祭壇の前で、連れていたペットはどちらでも一緒に戻る。⏎魔王の間で戦っている間は、ルーラ・リレミト・キメラのつばさは使えない。"},{"id":"h_urunorga","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"ランク11の魔王ウルノーガ","body":"ランク11の魔王は ウルノーガ。空に浮かぶ魔王の城の奥の玉座に座っている。戦いは5つの段の連戦で、5つ合わせて1人の魔王ぶんの長さ(あとの段ほど攻撃が強い)。⏎①魔王ウルノーガ: 魔王の剣で斬りかかる 近接の物理が主。⏎②大魔王ウルノーガ: 命の大樹の力を吸った姿。呪文が主(ドルマ系・メラ系・イオ系など)。⏎③邪竜ウルナーガ: ウルノーガの半身の邪竜。牙と爪と息の 近接の物理が主。⏎④大魔王ウルノーガ＆邪竜ウルナーガ: ひとつになった姿。近くの相手は殴り、離れた相手には呪文と、使い分ける。⏎⑤大魔王ウルノーガと邪竜ウルナーガ: 2体に分かれ、それぞれ別々に動く。片方を倒してから30秒のうちに もう片方も倒さないと、残った方が「ザオラル」を唱えて、倒れた方を生きかえらせる(HPは半分で起きる)。残りの秒数は画面の上のHPバーの名前に出る。2体とも倒せば勝ち。片方のHPを減らしておいて、もう片方を倒したらすぐに仕留めよう。⏎倒すと 魔王の証・10万ゴールド・ときどき「魔王の剣」と「ウルノーガ討伐の証」・ボス配合の解禁(前にマスタードラゴンを倒した人は、ランク11の魔王を倒したまま)。⏎【スカウト】ランク11の魔王を一度倒した人が祭壇から再戦すると、①魔王ウルノーガの段の間だけ スカウトアタックができる(魔王の中で ウルノーガだけ・成功率はメタル系と同じくらい とても低い・マスターランクは問わない)。成功すると魔王ウルノーガが仲間になり、その戦いはそこで終わって祭壇の前へ戻る(勝ちにはならない)。大魔王ウルノーガ・邪竜ウルナーガ・＆はスカウトできず、配合で仲間にする。"},{"id":"h209","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"ボスのダンジョンと魔王の塔","body":"ランクの最後のボスには、本家ゆかりのダンジョンがある(竜王の城・ハーゴンの神殿・ゾーマの城 など)。いちばん奥の玉座に魔王が座っていて、近づくと台詞のあと魔王の間へ移って戦う(ランク2・4・6・8・9・11は、新しく作った世界だけ)。祭壇が目覚める前は、入口が魔王の結界でふさがれている。⏎ランク12は魔王の塔(DQ1〜11の魔界の11層と屋上)。各層の玉座にその層の魔王が座っていて、近づくと台詞のあと魔王の間へ移って戦う(はじめての台詞はとばせない・一度見た層は ESC でとばせる)。倒すと上への大階段の結界が解け、そのあとは玉座の前の祭壇で何度でも再戦できる。屋上の魔王は姿を変える3連戦。⏎魔王の城・ボスのダンジョン・魔王の塔・中ボスの拠点・海底ダンジョンの中は、ブロックを壊すことも置くこともできない(「まがまがしい力で ブロックを壊せない・・・。」と出る・バケツも使えず、外から水や溶岩も流れこまない・爆発でも壊れない)。しかけの「壊れる壁」だけは壊せる。クリエイティブでは壊せる。"},{"id":"h_coinboss","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"コインボスの専用イベント","body":"コインボスは、コインで戦う形をやめて、それぞれの世界の専用の物語で戦う(町の物語と同じしくみ・できごと帳に出る・はじまりの人の頭上に「！」)。⏎物語の最後は、玉座に座ったボスへ近づくと戦いの前の台詞(はじめはとばせず、2回目からは ESC でとばせる)があり、読み終えると魔王の間へ移って戦う。勝つと玉座の前へ戻る。話が済んだあとも、玉座で何度でも再戦できる(勝つたびに +10%・最大 +100% 強くなる・再戦のごほうびはゴールドと、3回に1回の目玉の落とし物)。⏎強さは置かれたランクの魔王を1として、前座(HP7割)・本編(HP10割)・裏(そのランクの魔王を倒したあと・HP15割)・頂点(HP20割)。⏎◆しっぽ団の大どろぼう(ランク2・前座・モモンジャガー): ローレシアの城下町の牧場の娘から。荒れた民家 → オオキヅチの巣の奥の玉座。⏎◆破壊神の目ざめ(ランク2・裏・青いシドー): ランク2の魔王を倒したあと、ロンダルキアのほこらの老人から。3つの聖水 → ハーゴンの神殿の破壊神の祭壇。⏎◆闇の覇者の帰還(ランク3・裏・闇の覇者ゾーマ): ランク3の魔王を倒したあと、闇のアレフガルドの精霊の聖域のルビスの使いから。3か所の番人 → 大魔王の城の島の玉座。⏎◆ロザリーの涙(ランク4・本編・魔剣士ピサロ): ランク4の中ボスを2体倒したあと、エンドールの酒場の吟遊詩人から。ロザリーヒルの「ロザリーの塔」の上の玉座。⏎◆裏カジノのドン(ランク8・本編・ドン・モジャール): ランク8のカジノで、その日のうちにコインを1000枚以上もうけると、ベルガラックの黒服の男が声をかけてくる。町の外れの小屋から「ベルガラックの地下」へ。手下と3回戦ったあと、玉座のドンと勝負。⏎◆異界の門(ランク10・裏・異界滅神ジャゴヌバ→絶対滅神): ランク10の魔王・イルーシャの物語・中ボス「炎獄王の座」を済ませたあと、ユーマグラムの渡りの鐘の番人から(イルーシャを連れていく)。3つの世界の女神の力 → 渡りの野の玉座(2段)。⏎◆スライム王国の大事件(ランク11・本編・スラリンガル): スライムの丘の村長から(スライム系の仲間を連れていく)。3つの門の番人(キングスライム・メタルキング・クイーンスライム) → ダンジョン「スラリンガル」の奥の玉座。⏎◆星を喰らう大魔王(ランク12・裏・大魔王オン・ゾ・エーグ): 星降りの大会で優勝したあと、星降りの丘の星見の老人から。「黒い星の穴」の3つの層の見張り → 最奥の玉座。⏎◆WORLD杯 ― 闘技場の頂点(ランク12・頂点・神獣王WORLD): 「星を喰らう大魔王」とランク1〜12の魔王をすべて済ませたあと、はじまりの神殿の闘技場のWORLD杯の使者から。勇者4人組と2試合し、決勝は闘技場で神獣王WORLDと戦う(魔王の間へは移らない)。決勝の間は闘技場の中の人の強化とアクセサリーの力が封じられる。再戦は使者の「挑む」。⏎ハーゴンはランク2の魔王の祭壇、魔勇者アンルシアはランク10の勇者の物語で戦う(新しい物語は無い)。⏎前のコインボスのコインは、ログインしたときか使ったときに主の証へ払い戻される(交換の値段のまま)。"},{"id":"h_canon1","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"物語","title":"本家のイベント","body":"それぞれの世界には、本家ドラゴンクエストの名場面をもとにした物語がある(町の物語と同じしくみ・できごと帳に出る・はじまりの人の頭上に「！」)。⏎【ランク1】沼地の洞窟の囚われの姫(ラダトーム王)・虹の橋をかける三つの宝(城の書庫)・眠りの笛と石の門番(マイラの村の温泉番)⏎【ランク2】港の娘を救え(港のある町)・精霊ルビスの守り(ローレシア城の宝物庫)・まぼろしの城を破れ(ハーゴンの神殿)⏎【ランク3】こしょう屋の娘(バハラタの村)・王の正体を映せ(サマンオサ城の入口)・不死鳥のたまご(レイアムランドのほこら)⏎【ランク4】武器屋の店番(エンドールのトルネコの店)・病の神官とパデキア(ソレッタの村)・天空の勇者のしるし(天空への塔のふもと)⏎【ランク5】二人の太后(ラインハットの離宮)・ルーラの復活(ルラフェンの学者の家)⏎【ランク6】山の村の祭り(ライフコッド)・転職の神殿を取り戻せ(ライフコッドにかくれた神官)・スライムだけの闘技場(闘技場)⏎【ランク7】にせの英雄(過去の世界のウッドパルナ)・恩知らずの村(レブレサック村)⏎【ランク8】兄の残した光(リーザス像の塔)・バトルロードの挑戦者(ベルガラック)⏎【ランク9】星のオーラ集め(ウォルロ村の水車小屋)・学院の七不思議(エルシオン学院)⏎【ランク10】英雄ダストンの宝(ドワーフの村)・職人の三つの試し(メギストリスの都の武器屋)⏎【ランク11】悪魔の子の脱出(崩壊の前のデルカダールの城下)・神の岩の頂上(イシの村の旅の扉のほこら)⏎【ランク12】わるぼうとぴぴぼう・ライバルあらわる(タイジュの城と城下町)⏎いくつかの物語は「章」に分かれている。章を済ませるたびに小さなごほうびがもらえ、できごと帳に「★ 章の名前(済)」と出る。⏎◆真の姿を映す品(ラーの鏡・ルビスの守り)を持って、化けた人に話しかけると正体が現れる。⏎◆姿を変えられた人(眠り・石・幽霊など)がいる。物語を進めると元に戻る。⏎◆腕くらべ: 試合の相手の人に話しかけると試合が始まる。仲間を1匹(1対1)か3匹(3対3)出し、ほかの仲間は試合のあいだ待機になる(終わると元に戻る)。自分で手を出してはいけない。相手を全部倒すと勝ち。仲間が全部倒れる・試合の場から48マス離れる・5分たつと負け(何度でも挑める)。試合のあとは出た仲間が全回復する。⏎◆物語で手に入る『だいじなもの』は売れない(デバッグのタブにも並ぶ)。ラーミアの羽はランク3の世界で使うと、ルーラの画面が開いて杖やつばさが無くても飛べる。⏎◆人をかかえて歩く場面では、ルーラもキメラのつばさも使えない。⏎◆マイラの村・バハラタの村・ソレッタの村・ラインハットの離宮・ルラフェンの学者の家・レブレサック村・神の岩は、それぞれの世界で近くへ行くと建つ(入口の石板・銅に触れると建物リストに載る・村の中には魔物が湧かない)。⏎◆ごほうびは物語の大きさで3段(小・中・大・ほかの物語と同じ決まり・大きな話には目玉の品)。⏎◆同じ人物は1人だけ: ほかの物語と同じ人(城の書庫の老人・トルネコ・牧場の番人・タイジュの王など)は、1人がどちらの話も受け持つ。仲間にした勇者(ゼシカ・ヘンリー・モリー・ダストンなど)は、仲間にした人には物語の場所に見えなくなる。"},{"id":"h_maintown","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"物語","title":"主要な町と町の物語","body":"ランクの世界には、城と城下町のほかに「主要な町」が2つずつ(全部で24か所)ある(宿屋・教会・お店・うわさの掲示板・魔物は湧かない・近くへ行くとルーラ・キメラの自動登録に入る・施設の石板)。⏎どの町にも、本家の名場面をもとにした町の物語が1つある(できごと帳に出る・はじまりの人の頭上に「！」)。今ある塔や城や洞窟も舞台になる。⏎【ランク1】リムルダールの町「魔法の鍵と 牢の老人」⏎【ランク2】ムーンペタの町「犬にされた王女と ラーの鏡」(ムーンブルク王女が仲間になる)⏎【ランク3】ロマリア城と城下町「一日王様と 金の冠」⏎【ランク4】モンバーバラの町「劇場の踊り子姉妹」⏎【ランク5】サンタローズの村「洞窟のドワーフと 春風のフルート」⏎【ランク6】アモールの町「アモールの水と 涙の洞窟」⏎【ランク7】リートルードの町「止まった時の町と 時の砂」⏎【ランク8】リーザス村「リーザス像の瞳と 兄の手紙」⏎【ランク9】セントシュタイン城と城下町「黒騎士と フィオーネ姫」⏎【ランク10】風の町アズラン「風の町と 大精霊」⏎【ランク11】ホムラの里「ヤヤクと 人食い火竜」⏎【ランク12】マルタの国「王子と 鍵の世界」⏎▼ もう1つの主要な町⏎【ランク1】ガライの町「ガライの墓と 銀のたてごと」⏎【ランク2】ベラヌールの町「呪いの熱と 世界樹の若葉」⏎【ランク3】ノアニールの村「眠りの村と 夢見るルビー」(結末2つ)⏎【ランク4】ガーデンブルグ「盗まれた首飾りと 女王の疑い」⏎【ランク5】カボチ村「畑を荒らす魔物の正体」(結末2つ)⏎【ランク6】ゲントの村「ゲントの杖と 長老の試し」⏎【ランク7】グリンフレーク「お屋敷の娘と 羊飼いの恋」(結末2つ)⏎【ランク8】マイエラ修道院「院長の館に 忍びよる影」⏎【ランク9】ベクセリアの町「はやり病と 封印の遺跡」⏎【ランク10】ジュレットの町「失われた歌と 人魚の楽譜」⏎【ランク11】ダーハルーネの町「海の男コンテストと 消えた船」(結末2つ)⏎【ランク12】わたぼうの丘の宿場「まいごのわたぼうと 星の地図」⏎▼ 第3弾(今ある施設・塔・洞窟・目玉の建物・海底ダンジョンを舞台にした話・各ランク2本)⏎【ランク1】「ドムドーラの亡霊と 木の下の留め金」「岩山の洞窟と 竜王の密使」(結末2つ)・ラダトームの城下「白い馬と 古い馬車」(馬車がもらえる)⏎【ランク2】「風のマントと ドラゴンの角」「沈没船と 船乗りの骨」(結末2つ)⏎【ランク3】「サイモンの剣と 死の火山」「オリハルコンと 王者の剣の台座」(結末2つ)⏎【ランク4】「希望のほこらと 四つの結界の要石」(結界の番人が弱まる)「トンネル掘りの老人と ふさがれた穴」⏎【ランク5】「王の試練と 大臣のたくらみ」(結末2つ)「エルヘブンの長老と 海の神殿の封印」⏎【ランク6】「ゼニス王の願いと 雲の上の牢」「サンマリーノの町長と メイドの濡れ衣」(結末2つ)⏎【ランク7】ユバール族の野営地「ユバールの踊り子と 大地の精霊の壺」・「聖風の谷と 風の精霊の祈り」⏎【ランク8】「荒野の古代船と 月影のハープ」「闇のレティシアと 神鳥の影」⏎【ランク9】グビアナ城下「グビアナの女王と 消えたアノン」(結末2つ)・「天使の滝と 落ちた見習い天使」⏎【ランク10】「止まった箱舟と 空の飛行船」「眠りの村メネトと 夢見の水晶」⏎【ランク11】「聖地ラムダと 始祖の森の光」「最後の砦と 帰らない見張り」(結末2つ)⏎【ランク12】「旅の扉の間の 迷い星」「モンスタータウンの市と 鉱石の大樹の実」(結末2つ)⏎▼ 第4弾(まだ物語の舞台になっていなかった施設・ダンジョン・中ボスの拠点・目玉の建物・海底ダンジョンを舞台にした61本・新しい町は無い・中ボスの拠点の話は最後に奥の祭壇の中ボス戦へつながる)⏎【ランク1】「迷いの森の悪い夢と 妖精の隠れ里」「よろいの番人と 竜王の手下の砦」「沖に沈んだほこらと 祈りの書」(結末2つ)⏎【ランク2】「邪神の像と 大鍾乳洞の元信者」(結末2つ)「妖精の城と 雨露の糸」「なぞの海底基地と メタスラ城の王子」⏎【ランク3】「ラーミアの翼と バラモス城の毒の霧」⏎【ランク4】「キングレオ城の地下牢と 水門の塔」「世界樹のてっぺんと 一輪の花」(結末2つ)「架け橋の塔と 四つの結界の番人」「海鳴りの塔と 灯台の聖なる種火」⏎【ランク5】「ボブルの塔と 竜の目」「デモンズタワーと 石の夫婦」「大神殿の奴隷たちと 光の教団」「見はらしの塔と 大きな足あと」⏎【ランク6】「月鏡の塔の鏡と ムドーの城の幻」「しあわせの国の 帰らない村人」「天空の城と ヘルクラウドの騎士」「海底神殿と 海底宝物庫の王冠」「牢獄の町と 地下墓地の名簿」⏎【ランク7】「マーディラスの宮廷と からくり兵団」「ダーマ廃墟と 転職の神官の祈り」「水没した町の神父と 水の精霊の紋」「大灯台の炎と サンゴの洞くつ」「謎の遺跡の最後の台座と 魔空間の神殿」「ユバールの守り手と カラーストーンの鉱夫」「山奥の塔の竜と リファ族の風」「ルーメンの闇と 魔物の岩山」「エンゴウの炎の祭りと 炎の巨人」⏎【ランク8】「いばらの城の夜と 城の書庫の日誌」(結末2つ)「闇の遺跡と 太陽の鏡」「王家の山と アルゴンハート」(結末2つ)「竜骨の迷宮と 竜神の道」「竜神族の里の試練と 天の祭壇」「世界の破れ目と 神鳥の巣の妖魔」「法皇の館と 海竜の住みか」「暗黒城都市の 影の住人」⏎【ランク9】「ダーマの塔と 消えた大神官」「まじゅうの洞窟と 女王の宝石」「カデスの牢獄と 天の箱舟」「女神の果実と セレシアの大樹」(結末2つ)「宝の地図の迷宮と ぬしさまの海」(結末2つ)⏎【ランク10】「冥王の心臓と 勇者姫の城」「聖都エジャルナと 水の領界のルシュカ」「時の扉と エテーネの時計塔」「ファラザードの砂の都と 炎獄王の座」「天星の大神殿と 魔眼の月」「宙に浮く球体と 天の雷砲」「ヴォルザッド要塞と 渡りの鐘」⏎【ランク11】「ユグノア城跡の 嘆きの戦士」「ナギムナー沖の渦と 人魚の女王」「神の民の里と 天空の古戦場」「崩壊の裂け目と 忘れられた塔」「崩壊後の三軍王」「グロッタ地下遺構と スライムの塔の糸」「ネルセンの試練」「ナギムナー沖の渦と 渦守りの灯」⏎【ランク12】「スラパレスと スライムエンペラーの王宮」「しっぽ団のアジトと 闘技場の優勝旗」「黒怨の城と 星の丘の黒い霧」「海に沈んだ神殿と タイジュの根の迷宮」"},{"id":"h_gimmick","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"魔王戦のギミック","body":"魔王・魔王の塔の層・中ボスには、それぞれの「しかけ」がある(魔王は2〜4つ・塔の層と中ボスは1つ)。HPバーの横と画面のまん中に、いまの様子が出る。⏎【予告の円】足元に赤い円が出て、1.5秒後に円の中へ大ダメージ。円の外へ逃げればよい(ペットも円の外へ逃げる)。⏎【燭台】魔王の間の柱の内がわに燭台が立つ。残っている間、魔王はHPが回復し、受けるダメージが2/3になる。燭台をこわすと(ふつうにブロックを掘る)消え、全部こわすと魔王が10秒ダウン。⏎【手下の結界】手下を呼ぶと、手下が生きている間は魔王に攻撃が通らない(「▶手下の結界」)。手下を全部倒すと結界が割れ、5秒ダウン。⏎【段階の変わり目】HPが減って姿や技が変わる2.5秒は、攻撃が通らない。⏎【闇の衣】魔王の受けるダメージが1/4になる。部屋の4つの光の台のうち1つが光っているので、上に立って右クリックするとはがれる(30秒でまた着る)。呪われた剣の闇の結界は、燭台を全部こわすとはがれる。⏎【回復の妨げ】呪われると10秒の間、回復が半分(状態異常を治す道具や呪文で解ける)。⏎【吸いこみ】魔王が3秒吸いこんだあと、まわりへ大きな一撃。外へ走って逃げよう。⏎【足場が崩れる】全てを超越せし者・強化は、床の外がわを順に溶岩にする(溶岩の中は毎秒最大HPの2割)。段階が変わると床が戻る。⏎【弱点の時間】「隙ができた！」の6秒の間か、パワーを溜めている間に最大HPの5%を削るとダウン。ダウン中(眠っている間も)は8秒動かず、受けるダメージ1.5倍。⏎【分身】分身が出たら本物をさがす(足元の影が濃いのが本物)。分身は殴ると消え、本物を殴れば分身は消える。放っておくと大技。⏎【長い詠唱】5〜6秒の大呪文。最大HPの10%を削れば止まる。止められないと全員に最大HPの半分ほど。⏎【属性の切り替え】体の色で効く呪文が変わる(赤=ヒャド・青=メラ・ギラ・黄=ドルマ・紫=デイン・緑=イオ・白=バギ)。合わない攻撃の呪文は半分。⏎【ペットへの惑わし】ペットがまどわされて仲間どうしで殴り合う。飼い主が殴ると正気に戻る(ダメージは無し)。⏎【時の停止】時が止まり2秒動けない。その間に痛恨の一撃が来る。2回に1回は1人を檻へ閉じこめる(壊せば出られる)。⏎【はね返しの切り替え】マホカンタ(呪文をはね返す・金の光)とアタカンタ(殴りをはね返す・赤い光)を20秒ごとに入れかえる。今どちらかを見て、殴るか呪文かを変えよう。⏎【床の毒・溶岩】毒・炎・氷の床が20秒かけて広がる。上にいると毎秒最大HPの2%。⏎どの一撃も、今の決まりどおり1回で最大HPの3〜4割まで(守り切った詠唱は5割まで)。"},{"id":"h203","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"防衛戦の砦","body":"防衛戦は、はじまりの神殿の北の旅の扉から行く「防衛戦の砦」で遊ぶ。まん中の祭壇には、いつも『防衛戦の旗(ランク1)』が立っている(だれでも使える・壊せない)。⏎旗を右クリックすると「防衛戦をはじめますか」の画面が出て、『はじめる』を押すと始まる(立っているだけでは始まらない)。しゃがんで右クリックすると戦場の枠が見える。⏎5回の波のあとにボス。旗のランク(1〜12と∞)が高いほど敵が強く多い。敵はそのランクの世界に湧く魔物(配置表)と同じ強さ・同じ経験値で、ボスはそのランクの最後の強さ。参加者が増えると敵も増える。⏎敵が旗のそばに5秒いるか、参加者が全員倒れると負け。勝っても負けても旗は残り、次に始められるのは3分後(ワールドを開き直しても待ちは消えない)。⏎ランク2〜12の旗は、そのランクの世界の城と城下町の物語を終えたときのごほうび(1人1本ずつ)。∞の旗はランク12の旗で勝ったときのごほうび。旗は鍛冶では作れない。⏎ほかのランクの旗で戦うときは、その旗を手に持って祭壇の旗を右クリックすると立てかえられる。立てかえた旗は壊すと手もとに戻り、祭壇にはまたランク1の旗が立つ。⏎砦の建物と地面は、守りの力で壊すことも、ブロックを置くことも、水や溶岩を流すこともできない(ずる対策)。守りの設備は今までどおり置けて外せる(防衛戦の最中は置けない)。⏎防衛戦の最中に加わっている人が旗を右クリックすると「防衛戦をやめますか」の画面が出て、『防衛戦をやめる』を押すと負けと同じように終わる(ごほうびなし・次は3分後)。⏎防衛戦の最中に1分動かないと(自分で歩いて5マス以上動かないと)、防衛戦が終わる。2人以上のときは動かなかった人だけが外れ、ごほうびももらえない。30秒前に知らせが出る。"},{"id":"h204","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"防衛戦のメダルと主の証","body":"防衛戦に勝つと『防衛戦のメダル』がもらえる(旗のランク×2枚・∞は30枚・お題1つにつき+20%)。ランク12に勝つと∞の旗も付く(ランク2〜12の旗は、そのランクの城と城下町の物語でもらう)。⏎メダル王の城(はじまりの神殿の北西の島)の1階の大広間にいる『主の証の交換所』で、メダルを守りの設備(バリケード・トゲ床・おとりの太鼓・かがり火・祈りの像・結界石・やぐら・大砲)や主の証(メダル3枚で1つ)と交換できる。⏎空の証(メダル30枚・ランク10の世界へ行ったことがあると交換できる)と、スキルポイント+5(メダル10枚・1人SP1000まで・スキルパネルのSPに足される)も交換できる。⏎「職業の証」の札では、ダーマに渡したことのある職業の証(メインとサブ)をメダルで交換できる。枚数は基本5職 10枚・中級 30枚・上級 60枚(サブの証はその2倍)。まだ渡していない証は灰色で交換できない。⏎主を倒すと『主の証』が1つ(主の決闘の勝者なら2つ)。交換所で主の証を『主のタマゴ』(主として倒したことのある種族の主が生まれる)に換えられる(配合ランク I は6つ 〜 SSS は120こ。主はスカウトアタックでは仲間にならないので、主のペットはこのタマゴだけ)。⏎前の『コイン』の札(コインボスのコイン)はなくした。コインボスとは、それぞれの世界の専用のイベントで戦う(「コインボスの専用イベント」の項)。持っていたコインは、ログインしたときか使ったときに主の証へ払い戻される(交換の値段のまま)。⏎主を倒すと、同じパーティで64マス以内にいた仲間も「主として倒した」に記される(主のタマゴの交換に使える)。"},{"id":"h205","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"博物館","body":"神殿の東の旅の扉から行く博物館では、館長にオブジェ・フィギュアを渡して飾れる。記録はワールドのみんなで1つ(DQMメニューの図鑑の『博物館の記録』で見られる)。⏎1つ飾るごとに100G。みんなの記録がフィギュアは50・100・200・300・500・全部、オブジェは25・50・100・150・250・全部になると、飾った人にゴールド(オブジェはペットのなつき度でもらうので節目を下げた)。オブジェとフィギュアの合計が10種ふえるごとに、飾った人にスキルポイント5(上限なし)。ある系統のフィギュアがそろうとフィギュア棚がもらえる。⏎【コレクション効果】博物館の記録(オブジェとフィギュアの合計)が30種でペットの経験値+5%・100種で+10%、50種で魔物の落とし物の率+5%・100種で+10%。みんなの記録なので、ワールドの全員に効く。⏎モンスター図鑑では、博物館にある魔物の模型が回って見える。⏎まだ博物館に飾られていないオブジェ・フィギュアは、説明に「未寄贈」と出て、アイコンの右上に小さな金の点が付く。"},{"id":"h_collector","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"収集家の老人と装備図鑑","body":"ランク1の「老人の家」にいる収集家の老人は、武器・防具・アクセサリーを集めるのが好き。話しかけると、自分の装備図鑑(DQMメニューの『図鑑』から、武具を1つ使って載せる)の数を見て、節目のごほうびをくれる。⏎節目は 30・100・200・350・500・700種と全部。ごほうびはゴールド(先の節目ほど多い)と設計図(30・100種は1枚、200〜500種は2枚、700種と全部は3枚・先の節目ほど高いランク)。全部そろえると称号「装備の大収集家」(飾り)。⏎ごほうびは1人1回ずつ。節目に届いたら老人に話しかけて受け取る。⏎オブジェ・フィギュアのごほうびとコレクション効果は博物館へ移った。"},{"id":"h206","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"建材屋と地形ブロック図鑑","body":"地形ブロック図鑑(DQMメニューの図鑑)には、地形ブロックのタブの品を1種類1つ使って登録する(人ごと・鉱石は載らない)。⏎神殿の西の旅の扉から行く建材屋では、図鑑に載ったブロックを1つ10Gで買える(まとめ買いもできる・図鑑590種から5G)。ビルダーの旗は5,000G。見本の部屋もある。島の東西の通りには、隠しレシピの見本の部屋が7つ(大聖堂・大図書館・幽霊の部屋・王家の玉座の間・大浴場・星空の温室・召喚の間)あり、入口の看板に名前が書いてある。中の家具の置き方をまねると、自分の町でもその部屋になる。"},{"id":"h207","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"ビルダーの旗","body":"ビルダーの旗を立てると、まわり(はじめは半径24マス・上下16マス。旗の画面の下の「広さ」で半径24・32・48・64から選べる・選べるのは旗を立てた人だけ・ほかの人の旗の範囲と重なる広さにはできない)の部屋を数えて、町のレベル(1〜30)が決まる。⏎部屋の条件: かべ2段以上・ドア1つ以上・明かり・床4〜150マス。ただの部屋は +5(床9マス以上・町で10個まで)、部屋のレシピに合うと +20〜30(同じレシピは2〜4つ目が +10)。レシピは寝室・宿屋・台所・酒場・宝物庫・図書室・鍛冶場・教会・牧場の小屋・浴場・道具屋の店・武器屋の店・防具屋の店・玉座の間と、庭8つ。レシピごとに床の広さの下限がある(寝室・台所・宝物庫・浴場 9マス／酒場・図書室・鍛冶場・お店3つ 12マス／宿屋・牧場の小屋 16マス／教会・玉座の間 20マス／庭のレシピ8つ 16マス)。家具がそろっていても床が狭いとそのレシピにならず、旗の画面にあと何マス要るかが出る。ベッド・机・樽・宝箱・本棚・椅子・燭台・扉などは DQ の家具でもよい(店のカウンターや玉座のような背の高い家具も数える)。⏎町のレベル: 60・150・260・400・550・720・900・1100・1300点で 2〜10。その先は 1400・1448・1498 … 2570・2654点で Lv11〜30(隠しレシピをたくさん作らないと届かない)。⏎隠しレシピ: ふつうのレシピのほかに、作るまで名前もそろえる物も「？？？」の隠しレシピが51ある(旗の画面に見つけた数が出る)。はじめてできると「隠しレシピ発見！」と知らせ、名前とそろえる物が開く(見つけた記録は人ごと)。元のレシピの上位(王の寝室・大宿屋・大図書館など)は元のレシピとしても数えて +15、新しい部屋(バー・劇場・牢屋・美術館など)は +25(どちらも1つ目だけ)。ヒント: 旗の画面の「？？？」にマウスを乗せるとヒントの文(町のレベル4で場所・8で床の広さ・12でそろえる物の1つ・18でそろえる物の数・24でもう1つ)。部屋の一覧に「あと少しで何かになりそう…」と出たら、まだのレシピにあと1つ足りない。町の住人は話しかけるたびに受け持ちのヒントを言い、隠しレシピに使う家具をはじめて町の中に置くと「何かの部屋に使えそう…」とつぶやく。町のレベルが上がるとルルがひらめきを話す(できごと帳の「ルルの話(読みなおし)」で読める)。建材屋の「レシピの書」(5,000G〜・読むたびに+1,000G・20,000Gまで)を読むと、まだのレシピを1つ名前とそろえる物まで知る(作るまで点は入らない)。⏎ごほうび(1人1回): 町の飾り(ここでしか手に入らない9品)・その飾りやはしご・光の玉などが鍛冶で作れるようになる・称号(みならい大工・町づくりの名人・名工の棟梁・町の王、Lv15〜30 で 隠しレシピの探求者・伝説の棟梁・町づくりの賢者・伝説のビルダー)・町のSP(合わせて70)・設計図や福引券や主の証などの品。品はレベルごとに目安のランクがあり、まだその世界に行っていなければ町長が預かる(行ってから旗を開くか町長に話すと受け取れる)。⏎町に人が住みつく: 町長と町の人のほか、宿屋・酒場・教会・お店・鍛冶場・宝物庫・図書室・玉座の間を作ると、そこに宿屋の主人・酒場のマスター・神父・道具屋・武器屋・防具屋・鍛冶屋・預かり屋・収集家の老人・ルイーダ・大臣・王様たちが住む。名前を付けた名札を持って町長に話すと、町の名前を付けられる。町に住みついた人は、町の人の小話のおねがいはしない。⏎町の中だけの効き目: 町の名前の表示とルーラの自動登録・HPとMPが少しずつ回復(Lv3から)・空腹が減りにくい(Lv4)・魔物が湧かない(Lv5)・歩くのが速い(Lv6)・落ちても痛くない(Lv7)・住人のお店の値引き(Lv8)など。Lv5からは、持ち主とパーティの仲間でない人は町のブロックを壊せない・置けない。⏎旗は1人1本。神殿・決戦の異空間・メタル迷宮と、魔王の城・ダンジョン・町と城の中には立てられない。⏎マイホームの島には、まん中(家の前)に自分の旗がはじめから立っている(ほかの場所にもう旗を立てていれば置かない)。こわせば持ち物に戻り、ふつうの旗と同じように立て直せる。⏎酒場の部屋ができると、町のレベルを問わず、その部屋にルイーダが1人来る(勇者の入れかえと雇いができる)。部屋がなくなると帰る。みんなの町の旗でも同じ。"},{"id":"fl01","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"地形ブロック図鑑の節目","body":"地形ブロック図鑑に登録した種類が 25・50・100・150・200・250・300・350・400・450・500・550・590種 に届くと、ごほうびがもらえる(人ごと・前から登録していた人は、次に図鑑を開いたときにまとめて)。⏎ごほうび: ゴールド(その節目の目安のランクの魔物100体ぶん)・スキルポイント(合わせて100・死んでも盤を初期化しても残る)・称号4つ(地形あつめの見習い・石工の目利き・大地のものしり・地形ブロック博士・見るだけ)・家具6つ。⏎200種で建材屋のまとめ買いが27スタックまで、350種でビルダーの旗の「DQの種類」の点が150まで、590種で建材屋の値段が1つ5Gになる。⏎魔王の城の壁はボスのダンジョン(壊せない)だけにあるので、集められるのはおよそ600種まで。"},{"id":"fl02","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"庭のレシピ","body":"ビルダーの旗の町の評価に、庭のレシピが8つある。庭は柵・塀・生け垣・かべで囲み(高さ1段でよい)、フェンスゲートかドアを1つ付ける(床4〜150マス・明かりはいらない・屋根が半分より多いと庭にならない)。庭のレシピはどれも床16マス以上(温室・花壇・薬草園を部屋に作るときも同じ)。⏎花壇(花8本・3種・20点・部屋でも)／庭園(花12本・5種・床の地形ブロック3種・椅子かベンチ・30点)／温室(部屋・ガラス8枚・植物10・30点)／薬草園(やくそう・上やくそう・どくけしそう・まんげつそう・ホイミの花 から3種を2本ずつ・30点・部屋でも)／水の庭(水4マス・すいれん2・花6本・30点)／和の庭(竹4本・石か砂利2種・花びら1・25点)／魔界の庭(魔界の黒バラ・魔界キノコ・悪魔の茨・呪われた蔦・闇色の枯れ木・魔界の発光樹 から3種・30点)／菜園(耕した土8マス・作物4・水1マス・20点)。⏎1つ目の庭は、花の種類が多いほど点が増える(2×(種類−3)・最大20)。同じレシピの2つ目からは10点。花は DQ の花も Minecraft の花も数える。"},{"id":"mt01","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"建築のツール","title":"マジックツール(全ブロック破壊)","body":"クリエイティブで使う範囲破壊のツール。Shift＋左クリックで幅・高さ・奥行き(各1〜99)を決め、右クリックで向いた方角へ消す(物は落ちない)。⏎Shift＋右クリックか設定画面のボタンで、「全部消す」(ブロック・水・溶岩)と「水と溶岩だけ消す」(ブロックは残し、水と溶岩の源と流れを空気に・水浸しのブロックは水を抜く)を切りかえられる。どちらも Ctrl+Z で元に戻し、Ctrl+Y でやり直せる。⏎マジックツール(建築ブロック選択)のブロック表には、クリエイティブのタブと同じく、手に入れたことのある DQM のブロックだけが出る(マイクラのブロックは全部・お気に入りと履歴の記録は残り、手に入れると出る)。"},{"id":"h_builder_tools","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"建築のツール","title":"ビルダーの道具(サバイバル)","body":"サバイバルで使える建築の道具が3つある(作業台で作る)。⏎かわきのつぼ(レンガ4つと バケツ): 水源を右クリックで吸い、ブロックを右クリックで置く。256まで ためられる。しゃがむと 3×3×3 をまとめて。水だけ(溶岩は吸わない)。壊せない場所と、ほかの人のマイホームの島では使えない。⏎ビルダーハンマー(鉄インゴット5つと 棒2つ): 自分のマイホームの島でだけ。速く掘れて、取れたものは持ち物へ。右クリックで溜めて放すと、1秒で 3×3×3・2.5秒で 5×5×5 をまとめて壊す。⏎リフォームコテ(鉄インゴット2つと 棒1つ): 自分のマイホームの島でだけ。ホットバーの9番のブロックを使って、右クリックした面の 5×5 の同じブロックを置きかえる(元のブロックは持ち物へ)。しゃがんで右クリックすると 高さ2×横5 の壁を置く。⏎どれも、宝箱や設備など中身のあるブロックと、壊せないブロックは さわらない。"},{"id":"h_isle_jiisan","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"モンスターじいさんの牧場（ペットの預かり所）","body":"はじまりの神殿の北東の旅の扉から行く浮島。柵で囲った牧場の北の小屋に、モンスターじいさんがいる。⏎じいさんに話しかけると、ペット収納ベルと預かり所のあいだで仲間のモンスターを移せる(預けられる数に限りは無い)。⏎預けた子は牧場で修行して、少しずつ経験値をもらう(経験値だけ・落とし物とゴールドは無し)。あなたが遊んでいるあいだ(ログアウト中と放置中は進まない)の5分ごとに、1匹あたり いま いる世界のランクのふつうの魔物1体ぶん(神殿や島など ランクの無い世界では、行ったことのある いちばん高いランク)。預けた子が3匹より多いと、3体ぶんを等分する。上がるのは、あなたのペット(連れている子・持ち物のベルの中・預けた子)の いちばん高いレベルまで。気絶している子は修行しない。連れて戦うほうが ずっと早く育つ(倒した1体ごとに1体ぶん・ホットバーのベルの控えでもその1/10)。じいさんに話しかけると、今の修行のようすをチャットで教えてくれる。⏎小屋の下には、預かった魔物たちの地下の部屋がある。島の南の着く所のそばの旅の扉で神殿へ戻れる。⏎ランクの世界にあった「モンスターパーク」は建たなくなった(前に建ったものは残るが、じいさんは神殿の島にいる)。"},{"id":"h_isle_medal","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"はじまりの神殿の島","title":"メダル王の城","body":"はじまりの神殿の北西の旅の扉から行く浮島の小さな城。2階の玉座の間に、メダル王がいる。⏎見つけた小さなメダルの数(減らない)に応じて、スタンプラリーのごほうびがもらえる(くわしくは「メダル王」の項目)。⏎島の南の着く所のそばの旅の扉で神殿へ戻れる。⏎ランク3の世界にあった「メダル王の城」は建たなくなった(前に建ったものは残るが、メダル王は神殿の島にいる)。"},{"id":"h_achievement","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"実績","title":"実績のしくみ","body":"冒険のいろいろな行いが「実績」として記される(人ごと・死んでも残る)。DQMメニュー「基本」の「実績」で見られる。⏎上の札は「全体」「ランク1〜12」「隠し」。行ったことのない世界の札は出ない。札の輪は、その札の実績を取った割合。⏎左は分類(探検・討伐・スカウトと配合・物語・ダンジョンと魔王・収集・生産・遊び・やりこみ・隠し)、まん中は一覧(取った／まだで絞る・名前で探す・並びの切りかえ)、右は選んだ実績のくわしい欄(段階の流れ・いまここ・ごほうび)。⏎難しさはブロンズ・シルバー・ゴールド・プラチナの4つ。取ると画面の右上に札が出て音が鳴る。プラチナは画面のまん中に大きく出てファンファーレが鳴る。⏎ごほうびは、実績ポイント・実績のSP(スキルパネルのSP・ほかの枠とは別で300まで)・ゴールド・称号・飾り。称号は右の欄の「称号」で一覧を見て、名乗る称号を選べる。⏎実績ポイントは、メダル王の城(はじまりの神殿の北西の島)の主の証の交換所の札「実績」で、見た目の品(紋章の旗・像・家具)と交換できる。強さに関わる品は無い。⏎隠し実績は「？？？」とだけ出て、取ると名前と条件が分かる。⏎記録は実績のしくみを入れたときから数える(前の分はさかのぼらない)。すでに済んでいて、もう増えようのない記録(物語を見届けた・総数に届いた など)は、そのまま取れる。⏎前の数字の一覧は「一覧表」の「記録」に名前を変えて残っている。吟遊詩人の「功績の旋律」は、取った実績40個ごとに歌が1%強くなる(最大15%)。"},{"id":"j_0","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"遊び人","body":"ステータス: HP C / MP D / 攻撃 C / 守備 C / 魔力 C / 魔法守備 C⏎得意武器: ムチ(S)、ブーメラン(SS)、戦輪(S)、竪琴(S)⏎全武器ランク: バニラ剣B / 剣D / 勇者の剣E / 槍D / 短剣B / 杖E / 棍B / 爪B / 拳E / ハンマーD / 斧D / ムチS / 弓D / ブーメランSS / 銃B / 戦輪S / 竪琴S / 大鎌D / 戦籠手B / ドリルD / 鎖鎌B⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"j_1","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"戦士","body":"ステータス: HP S / MP E / 攻撃 S / 守備 S / 魔力 E / 魔法守備 D⏎得意武器: 槍(S)、斧(SSS)、大鎌(S)、戦籠手(S)⏎全武器ランク: バニラ剣B / 剣A / 勇者の剣B / 槍S / 短剣B / 杖E / 棍B / 爪A / 拳B / ハンマーA / 斧SSS / ムチB / 弓C / ブーメランB / 銃D / 戦輪D / 竪琴E / 大鎌S / 戦籠手S / ドリルA / 鎖鎌C⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"j_2","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"武闘家","body":"ステータス: HP S / MP E / 攻撃 S / 守備 A / 魔力 E / 魔法守備 E⏎得意武器: 棍(S)、爪(SSS)、拳(SS)、戦籠手(S)⏎全武器ランク: バニラ剣B / 剣D / 勇者の剣E / 槍B / 短剣D / 杖E / 棍S / 爪SSS / 拳SS / ハンマーD / 斧D / ムチD / 弓D / ブーメランE / 銃E / 戦輪B / 竪琴E / 大鎌D / 戦籠手S / ドリルB / 鎖鎌B⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"j_3","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"バトルマスター","body":"ステータス: HP S / MP D / 攻撃 S / 守備 S / 魔力 E / 魔法守備 D⏎得意武器: 槍(S)、爪(S)、拳(SSS)、ハンマー(S)、斧(S)、大鎌(S)、戦籠手(SS)、ドリル(S)⏎全武器ランク: バニラ剣B / 剣A / 勇者の剣B / 槍S / 短剣B / 杖E / 棍B / 爪S / 拳SSS / ハンマーS / 斧S / ムチA / 弓C / ブーメランC / 銃D / 戦輪D / 竪琴E / 大鎌S / 戦籠手SS / ドリルS / 鎖鎌A⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"j_4","unlockStage":4,"majorCategory"  / 攻撃 S / 守備 B / 魔力 A / 魔法守備 B⏎得意武器: 銃(SSS)、ドリル(SS)⏎全武器ランク: バニラ剣E / 剣E / 勇者の剣E / 槍E / 短剣E / 杖E / 棍E / 爪E / 拳E / ハンマーE / 斧E / ムチE / 弓E / ブーメランE / 銃SSS / 戦輪C / 竪琴D / 大鎌D / 戦籠手D / ドリルSS / 鎖鎌D⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"j_25","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"戦輪士","body":"ステータス: HP A / MP D / 攻撃 S / 守備 A / 魔力 C / 魔法守備 B⏎得意武器: ブーメラン(S)、戦輪(SSS)⏎全武器ランク: バニラ剣E / 剣D / 勇者の剣E / 槍D / 短剣A / 杖E / 棍D / 爪D / 拳D / ハンマーD / 斧D / ムチD / 弓B / ブーメランS / 銃B / 戦輪SSS / 竪琴D / 大鎌C / 戦籠手C / ドリルD / 鎖鎌A⏎その職業の証をダーマ神官に渡すと就ける(一度就いた職業は証なしで選び直せる)。ランクが高い武器ほど与えるダメージが上がる(SSS+30%〜E−40%・杖は魔力に効く)。"},{"id":"h100","unlockStage":4,"majorCategory":"職業","minorCategory":"転職のきほん","title":"ダーマ神殿で転職","body":"転職は、ダーマ神官に話しかけてする。ダーマ神官はランク1のラダトーム城と城下町の教会と、ランク3のダーマ神殿にいる。⏎転職してもそれぞれの職業のレベルは別々に記録される。いろんな職業を極めよう。⏎ダーマの画面(DQM設定のメニューが「新」のとき)は「見た目」ボタンで2つの形を切りかえられる: 「神官と話す形」(左のコマンドで てんしょく・サブ・証の交換を選び、まん中の一覧から職業を選んで「はい／いいえ」で決める)と「職業の系統樹」(基本職→中級職→上級職を道でつないだ図・道は見た目のまとまりで、どの職業にも証があれば就ける)。矢印キーとEnterでも動かせる。はじめは神官と話す形。"},{"id":"h101","unlockStage":4,"majorCategory":"職業","minorCategory":"転職のきほん","title":"職業とランク表","body":"職業ごとに武器(21種)・ステータスの得意不得意がSSS〜Eのランクで決まっている。DQMメニューの一覧表の『職業 武器適正表』『職業 ステータス表』で見られる。"},{"id":"h188","unlockStage":4,"majorCategory":"職業","minorCategory":"転職のきほん","title":"転職の条件","body":"どの職業も、その職業の証をダーマ神官に渡せば就ける。ほかの職業のレベルの条件は無い。一度就いた職業は、証なしで選び直せる。⏎証の入手: ボスのダンジョン(魔王の城)の金の宝箱・ダンジョンの名品の宝箱・ダーマ神官の証ポイント交換(余った証を売ってためる)・バイオームリスト/建物リストの記録・防衛戦のメダルの交換所の「職業の証」(一度ダーマに渡した証)。"},{"id":"h189","unlockStage":4,"majorCategory":"職業","minorCategory":"転職のきほん","title":"リストで証を受け取る","body":"ランクの世界のバイオームブロック・建物ブロックに触れてリストに記すと、全体の3%を記すたびに証を1つ受け取れる(確率ではなく、記した数で決まる。例: 全体が300なら9つ記すごとに1つ)。⏎バイオームリストはメイン職業の証、建物リストはサブ職業の証。DQMメニューの『バイオーム一覧表』『建物一覧表』の『証を受け取る』から職業を選ぶ。⏎初期職(遊び人・戦士・武闘家・魔法使い・僧侶)はいつでも、上級職は記録20%から、最上級職は記録50%から選べる。⏎リストそのものはワールドで共有だが、証の数は自分で触れて記した記録で数える(受け取った回数も人ごと)。⏎そのランクの魔王を倒すと、バイオームリストにそのランクの世界のまだ触れていないバイオームの名前が灰色で出る(場所は出ない)。⏎マルチではリストの記録はみんなで同じ。バイオームリスト・建物リストの「★」(薄い金色)は、自分で石板に触れて記したもの。⏎リストの下の「表示：全体／自分」で、自分で記したものだけを出せる(見出しの数と発見済みの数も自分の数になる)。"},{"id":"h171","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"スキルポイント(SP)","body":"職業ごとの最高到達レベルから (Lv−1)×2 のSPを合わせた、共通のSPをもらう。転生やレベル低下でSPは減らず、同じレベルのぶんを二度もらうこともない。⏎主の証の交換所で、防衛戦のメダル10枚をスキルポイント+5に交換することもできる(1人SP1000まで)。⏎町の物語・勇者の物語・町の小話のごほうびのスキルポイントは、これとは別の枠(物語は上限なし・町の小話の分は合わせて300まで。博物館のSPも上限なし)。⏎ランクの魔王(ランク1〜12)をはじめて倒すと、1体につきスキルポイント+50(これも別の枠・魔王の塔の層の魔王は数えない)。⏎盤のところどころ(約10枚に1枚)に『ラッキーパネル』がかくれている。場所は人ごとにちがい、取るまでわからない。取るとふつうの効き目に加えて、そのマスと同じだけSPが増える(ラッキーで増えるSPは1人1000まで・メダルの1000とは別)。取ったラッキーパネルには金のひし形の印が付き、上の帯に「ラッキー ○/1000」と出る。⏎DQMメニューの「プレイヤー編集」(旧メニューは「魔法・特技」)→「スキルパネル」でマスを選び、『SPを使って取得』を押す。となりのマスはダブルクリックでもすぐ取れる。⏎離れたマスを選ぶと『ここまで自動で取る』になり、SPがいちばん少ない道を、確認のあとまとめて取る。⏎呪文・特技・能力アップ・必殺技・職業の力は、みなパネルで取る。必殺技のマスは、その職業の最高Lvが130(2つ目は230)になり、武器Lvも足りるまで取れない(取れないマスには足りない条件が出る・「大きな1枚の盤」の項)。まだ取っていないマスは「？」で、取ったマスのまわり6マスは中身が見える。⏎『取ったパネルを全部やめる』(2回押す)でSPに戻せる(ラッキーで増えたSPも0に戻り、同じマスを取り直すとまた増える)。⏎上の帯の『アイコン：あり／なし』でマスに絵を出せる(はじめは「なし」で文字の表示)。"},{"id":"h172","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"大きな1枚の盤","body":"全職業と全武器を1枚にまとめた盤。まん中の導きの書と、導きの書で選んだ職業の門がスタート。持っているパネルの隣だけ取れる。⏎職業のエリアには「証の門」からだけ入れる。門はどの職業も1つで、その職業のメインの証を持っていれば開く(開けると証を1つ使う。ダーマで証を渡して就いた職業は証なしで開く。開けた職業へは、ダーマで証なしで転職できる)。最上級職の門は、ゆかりの上級職のエリアのがわにある。初期職の外がわの「魔王の道」はどの職業からも進め、その外がわの魔王のしるしは各ランクの魔王を倒すと取れる。⏎取ったパネルは職業に関係なくいつでも効く。武器のエリアの数値の効果は、その武器を持っている間だけ。武器のエリアの呪文・特技は覚えたままだが、使うには対応する武器が要る。⏎呪文・特技・必殺技には解禁のレベルがある(0.35.10)。職業のエリアの技は、その職業の最高到達レベルが足りないと取れない(弱い技は低いレベルから、強い技ほど高いレベル)。強い特技と必殺技は、さらに武器Lv(武器の熟練度)も要る。呪文は、その系統の魔法Lv(魔法の熟練度)も要る(1段目の呪文・ルーラ・リレミトは条件なし・魔法剣は剣の武器Lv)。必殺技は1つ目がLv130、2つ目がLv230から。武器のエリアの特技は、その武器の武器Lvだけで取れる。能力・極意・門・魔王の道としるしにはレベルの条件は無い。⏎足りないマスは灰色になり、選ぶと「解禁: 戦士 Lv130(今 95)・斧 武器Lv35(今 12)」「解禁: 魔法使い Lv130(今 120)・メラ 魔法Lv30(今 22)」のように条件が出る。前に取ったマスはそのまま使える。"},{"id":"h_wmastery","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"武器の熟練度","body":"武器の種類21ごとに武器Lv(1〜99)がある。熟練度は、その武器で戦った「行い」で上がる(経験値・世界のランク・職業の適性とはつながっていない)。当てたときにその場で入る。仲間のモンスターだけで倒した相手からは上がらない。⏎入る量: その武器で当てると 1/4 で +1。会心の一撃 +5・溜め攻撃 +2・ジャンプ攻撃(落ちながら当てる)+1・ダッシュ攻撃(走りながら当てる)+1 は、それぞれ 1/2 で入る(重なったときは別々に抽選して足す)。1回の行い(1回振る・1回投げる・1回撃つ)では、何体に当たっても、何回跳ね返っても、この抽選は1回だけ(戦輪の跳弾・ブーメランの行きと帰り・ムチや槍の何体もへの当たり・鎖鎌の振り回しやドリルの巻き込みは、0.4秒の間を1回にまとめる)。特技 +1(1回の特技・1発の呪文で1回)・必殺技 +3・主やキラキラ・中ボス・魔王を自分でとどめ +5。はじめて倒す種族 +10・はじめての中ボス +30・はじめての魔王 +50(1回だけ)。⏎共闘: 自分が1回でも当てた魔物を、仲間(自分のペット・勇者・ほかの人)が倒すと、いちばん使った武器に +1(1体1回)。追いつき: いちばん高い武器Lvより10以上低い武器は、入る量が2倍(持ちかえた武器が遠すぎないように)。持ちかえ: ある武器に熟練度が入ると、その1割が、それより武器Lvの低い使ったことのある武器(熟練度が0より上)にも入る。⏎武器ごとに得意な行いがあり、すると +1(1体から3回まで・剣は特技でとどめ・槍は溜めで2体を貫く・弓と銃は12マス以上離れて当てる・ハンマーと棍は溜め2段・爪と拳は続けて当てる・ムチは2体まとめて・ブーメランと戦輪は2体目へ・短剣は毒やマヒの相手・杖は呪文でとどめ・大鎌は弱った相手を刈り取る・戦籠手はパリィの直後・ドリルはかたい相手・鎖鎌は離れて打つ・竪琴は竪琴で触った相手を仲間が倒す・斧は会心・勇者の剣は強敵・バニラ剣は会心でとどめ)。⏎上がらないとき: 放置中・地形のダメージで倒れた魔物・サンドバッグ・闘技場と格闘場。1体から入る量には上限があり(ふつうの魔物15・主やキラキラ30・中ボスと魔王150、殴り続けても増えない)、当たりは1分に40回まで数え、当たったときの行い(当たり・溜め・特技・必殺技・会心・ジャンプ・ダッシュ・得意)で入る量は合わせて1分に16まで、同じ場所で10分に60体を超えて倒すと倒したときの分が半分になる。防衛戦は1戦で武器Lv1つぶんまで。⏎武器Lvは能力を上げない。スキルパネルの技の解禁に使う(武器のエリアの特技・強い呪文と特技・必殺技)。呪文の解禁は魔法の熟練度で見る(「魔法の熟練度」の項)。杖の熟練度は、杖のエリアの特技・杖の必殺技・杖の節目の力に使う(杖で呪文を当てると杖にも入る)。魔法剣は剣の武器Lv。⏎武器Lvが上がると、画面の上に「武器のレベルアップ」の帯が出てファンファーレが鳴り、新しく取れる技があれば技の札も出る(チャットにも1行)。HUD の装備の欄の武器の行の下に細い熟練度のゲージ、熟練度が入ったときは照準の右に黄色の数字「+n」が出る(DQM設定「表示」の「熟練度のポップ」で消せる)。帯と数字は GUI位置調整(「武器のレベルアップ」「熟練度の数字」)で動かせる。⏎DQMメニュー「基本」の「武器の熟練度」で、21種の武器Lvと次のLvまでの残り、次に技が解禁する武器Lvが見られる。武器熟練度は死んでも消えない。0.35.29 で入る量と武器Lvの表を作り直した(それまでの武器Lvはそのままで、次のLvまでの量は はじめからになった)。熟練度の練り直しで、武器Lvの表をはじめのほうが上がりやすい形にした(たまった熟練度はそのままで、新しい表でLvを数える)。⏎【節目の力】武器Lvが節目に来ると、その武器を手に持っているときだけ効く力が付く(DQMメニュー「基本」の「武器の熟練度」で、左の一覧の武器を押すと右に出る)。⏎・溜めがのびる(Lv30・55・75): Lv30 で溜め時間−20%、Lv55 で溜めの段が1つ増える(ムチ・槍・斧・ハンマー・棍は3段目〈長さ・範囲+1マス・威力×1.25〉、勇者の剣・大鎌は2段目、戦籠手は2.0秒でロケットパンチの距離+3、弓・ブーメラン・戦輪は成功の幅の最後の0.2秒で放す「強溜め」、銃は「強装弾」、竪琴は1.2秒の2段目、杖は詠唱を終えて2秒持つ「溜め保持」、ドリルは3秒回すと「全開」、鎖鎌は2秒振り回すと範囲+1)、Lv75 で溜めている間の歩く速さが2割→6割。溜めの無いバニラ剣・剣・短剣・爪・拳は、かわりに 振りの間隔−5%・4回続けて当てると4回目に追撃・走っている間の最初の一撃+15%。⏎・熟練の技(Lv15・35・55・70・95): 武器ごとの小さな力(例: 剣は消費MP−10%と特技の威力+8%、槍は届く距離+1マスと溜めの突きが守備を15%無視、弓はヘッドショット+15%、ハンマーはよろめかせる、短剣は毒の時間+20%と背中から+10%)。会心率・会心のダメージ・みかわし・受けるダメージの軽減は、今までの上限の中で足す。⏎・棍は 0.35.15 から溜められる(1段 前へ3マス×1.5・2段 前へ4マス×2.0)。⏎・節目の力をすべて(Lv95)取ると、強さはスキルパネルの武器の極意＋適性アップの約8割ぶん。節目に来るとレベルアップの札に「新しい力」が出て、鐘が1つ鳴る。"},{"id":"h_mmastery","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"魔法の熟練度","body":"呪文の系統14(メラ・ギラ・ヒャド・バギ・イオ・デイン・ドルマ・回復・蘇生・補助・弱体・状態異常・即死・特殊)ごとに魔法Lv(1〜99)がある。その系統の呪文を使った「行い」で上がる。どの職業で唱えても同じ熟練度に入る。⏎入る量: 攻撃の呪文が当たると 1/2 で +1・弱点を突くと 1/2 で +2・呪文でとどめ 1/2 で +2(どれも1回の呪文で1回。イオ系などの全体の呪文で何体に当てても、何発も出る呪文でも1回分)・主やキラキラ・中ボス・魔王を呪文でとどめ +5(1体ずつ)。はじめて中ボスを呪文で倒す +30・はじめての魔王 +50(1回だけ)。回復は、戻したHPが相手の最大HPの25%ごとに +1(1回の呪文で +3まで)、キアリー・ザメハ・マホリーで実際に治すと +1。補助(リホイミ系も)は、まだ効いていない相手(自分にかけてもよい・戦いの外でもよい)に効くと +1・効き目が切れていない相手に掛け直しても0(同じ呪文は10秒に1回・1分に10回まで)。弱体と状態異常はかかると +2(かからなかったら 1/4 で +1)。即死は効くと +3(外れたら 1/4 で +1)。蘇生は起こすと +3(失敗でも +1)。特殊(ビッグバン・マホトラ)には、ほかの系統に入った量の1割も入る。補助・弱体・状態異常・即死・蘇生は使う機会が少ないので、入る量が2倍。追いつき: いちばん高い魔法Lvより10以上低い系統は、入る量がさらに2倍。⏎上がらないとき: 放置中・サンドバッグ・闘技場と格闘場の相手。回復は、HPが減っている相手を本当に治したぶんだけ数える(満タンの相手にかけても0)。1体の魔物から入る量は系統ごとに上限(ふつう15・主やキラキラ30・中ボスと魔王150)、数えるのは1分に30回の呪文まで(回復とザオ系も、別に1分に30回まで)、同じ場所で10分に60体を超えたとどめは半分、防衛戦は1戦で系統ごとに魔法Lv1つぶんまで。⏎スキルパネルの呪文は、職業Lvに加えて、その系統の魔法Lvが要る(例: メラ1・メラミ10・メラゾーマ20・メラガイアー35、ホイミ1・ベホイミ9・ベホマ20・ベホマズン30)。職業Lvと魔法Lvは、本家(DQ3)で覚えるころの冒険の進みに合わせ、2つがだいたい同じころにそろう(例: 魔法使いのメラミ 職業Lv55・メラゾーマ 職業Lv130)。1段目の呪文・ルーラ・リレミトは条件なし。⏎ほかの系統の呪文の覚え方: 熟練度は、その系統の呪文を使ったときだけ上がる(メラを使い続けてもギラやヒャドは覚えない)。ほかの系統のはじめの呪文(ギラ・ヒャド・バギ・イオ・ホイミなど)は魔法Lv1で取れるので、スキルパネルのその呪文を持つ職業のエリアで、その職業のLvを上げ、となりのパネルとSPで取る。取ってその呪文を使うと、その系統の熟練度が上がりはじめる。盤でそのマスを選ぶと、どの職業の何Lvで取れるかが出る。魔法剣は今までどおり剣の武器Lv。魔法Lvは能力を上げない(解禁だけ)。⏎魔法Lvが上がると、画面の上に「魔法のレベルアップ」の帯が出てファンファーレが鳴り、新しく取れる呪文があれば札も出る(チャットにも1行)。熟練度が入ったときは照準の右に黄色の数字「メラ +2」が出る(「熟練度のポップ」で消せる)。⏎DQMメニュー「基本」の「武器の熟練度」の画面の上の札「魔法」で、14系統の魔法Lvと次のLvまでの残り、次に呪文が解禁する魔法Lvが見られる。魔法の熟練度は死んでも消えない。はじめて入ったときは、持っている呪文の段の魔法Lvから始まる。"},{"id":"h_forcepanel","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"条件を無視して取る","body":"職業Lv・武器Lv・魔法Lv の解禁の条件だけが足りないパネルは、詳細の「条件を無視して取る」から、ふつうの3倍のSPと、ふつうのSP×10,000G を払って取れる(となりのパネル・証の門・魔王のしるしの決まりはそのまま。まとめて取る道には入らない)。⏎この取り方をするとSPを多く使うので、スキルパネルをすべて取りきれなくなるかもしれない。取ったパネルを戻す・全部やめるとSP(3倍のぶん)は戻るが、払ったゴールドは戻らない。"},{"id":"h_panelrefund","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"パネルを戻す・プリセット","body":"取ったパネルは、選んだパネルの詳細の「このパネルを戻す」で戻せる(1枚1,000G)。導きの書とスタートの門からつながらなくなる取ったパネルも一緒に戻り、ゴールドは戻す枚数×1,000G。確認の窓で、戻す枚数・戻るSP・かかるゴールドを見せてから戻す。導きの書とスタートの門は戻せない。条件を無視して取ったパネルは3倍のSPが戻る(払ったゴールドは戻らない)。ラッキーパネルを戻すと、そのぶんのラッキーのSPも減る(また取ればまた増える)。⏎「取ったパネルを全部やめる」は、取っているパネルの数×1,000G(導きの書とスタートの門は数えない)。⏎◆プリセット: 上の帯の「プリセット」から、取ったパネルの組を切りかえられる(切りかえはただ)。プリセット1ははじめから、2つ目は10,000Gで買い、1つ買うごとに次の値段は2倍(10個目は2,560,000G)、合わせて10個まで。SPの総量はどのプリセットも同じで、プリセットごとに別々に使う。効き目を切ったパネルと条件を無視したパネルの印もプリセットごと。名前も付けられる(12文字まで)。⏎戦いの最中(決戦の異空間・防衛戦の戦場・闘技場の試合中)は、切りかえも戻すこともできない。プリセットを切りかえると、魔法・特技ホットバーに入れていた技のうち、そのプリセットで持っていない技は外れる。"},{"id":"h215","unlockStage":4,"majorCategory":"職業","minorCategory":"スキルパネル","title":"勇者のスキルパネル","body":"仲間にした勇者は、1人ずつ本人だけの盤(199マス)を持つ。DQMメニューの「勇者パーティ一覧」の『スキル』か、ルイーダの酒場の雇っている勇者のカードの『スキルパネル』で開く。⏎まん中の紋から6つの系統に分かれ、外の輪ほど強い技。輪4・5・6・7・8は勇者Lv 50・100・170・240・280から取れる(勇者Lv は固有職業の最高到達Lv。転生しても下がらない)。となりのマスを持っていれば取れる。⏎勇者の呪文・特技・必殺技は、みなこの盤で取る(レベルで自動では覚えない・特技の書は使えない)。取った技はいつでも使える(剣・弓・ムチの技は、その武器を持っているときだけ)。⏎SP = (勇者Lv−1)×3.5 ＋ 転生1回ごとに30。Lv300 で盤の約85〜94%、転生を重ねると盤ぜんぶ。取り直しはできない。⏎勇者が技を使うと、その人の声で掛け声を出す(同じ人は4秒に1回まで・音量はDQM設定の声の音量)。⏎⏎勇者にも武器の熟練度(21種)と魔法の熟練度(14系統)がある(プレイヤーと同じ表)。勇者が自分で当てた・唱えた・治した・とどめを刺したときだけ上がる(飼い主が放置中・闘技場・サンドバッグは0)。量はプレイヤーと同じ値に勇者の倍率(得意なほう1.5倍・苦手なほう3倍: 前に出る勇者は武器1.5倍・呪文3倍、呪文の勇者は武器3倍・呪文1.5倍、弓の勇者は武器1.5倍・呪文2倍)。当たりの抽選はプレイヤーと同じく1回の行い(振る・撃つ・唱える)で1回だけで、何体に当てても増えない。⏎⏎盤の条件: 呪文はプレイヤーと同じその系統の魔法Lv。特技・固有の技・必殺技は、輪ごとの熟練度Lv(輪1〜8: 1・3・8・15・25・40・55・60・必殺技は+5)を、その勇者の「いちばん高い熟練度」(武器でも魔法でも)で見る。能力・極意のマスは条件なし。⏎能力のマス(攻撃力+9 など)は足し算で、数は勇者ごとに決まっている(全能力アップは6つの能力ぜんぶに足す・マスの説明に数が出る)。極意の「+%」は割合のまま。盤を全部取った Lv300 の勇者は、同じ Lv のプレイヤーと全能力の合計がほぼ同じになり、固有職業の得意な能力は高く、苦手な能力は低い。足りないマスは灰色で「解禁: メラ 魔法Lv30(今 12)」のように出る。盤の上の帯に、その勇者の熟練度の高いもの4つが出る。⏎⏎新しく仲間になる勇者は熟練度0から。前からいる勇者は、取ったマスはそのまま使え、熟練度は持っているマスの条件をちょうど満たす値から始まる。最初からにすると熟練度も0。"},{"id":"h_herojob","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"勇者の固有職業","body":"勇者は1人1つの固有職業で戦う。転職もサブ職業も無く、ダーマで証を渡すことも無い。⏎◆勇者姫(アンルシア): 剣で前に出て、デインと回復で支える。勇者の剣 SSS・剣 SS⏎◆魔勇者(魔勇者アンルシア): 闇の剣と闇の呪文。勇者の剣 SSS・剣 SS・大鎌 S⏎◆天弓の巫女(イルーシャ): 弓で離れて撃ち、回復とイオ。弓 SSS・杖 S⏎◆見習い天使(セラフィ): 後ろで回復と補助、風の呪文。杖 SS・竪琴 S⏎◆炎のムチ使い(ビアンカ): メラとギラ、ムチ。ムチ SSS・杖 S⏎◆水鏡の賢女(フローラ): 氷と爆発の呪文、守りと回復。杖 SSS・竪琴 S⏎◆雷鳴の剣士(テリー): 剣と雷の連続斬り。剣 SSS・勇者の剣 S⏎新しい技(光の雨は待ち45秒・炎のムチは待ち10秒): 勇者姫の盾・ダーククロスブレイク・魔勇者の威圧・光の雨・女神の祝福・天使の羽ばたき・祈りの光・炎のムチ・おてんばの炎・水鏡の守り・清流の祈り・いかずちの構え・さすらいの一閃。⏎前から雇っていた勇者は、固有職業になったときに1回だけ最初から(Lv1・スキルパネルも空)になった。雇った記録・装備・名前・さくせんはそのままで、転生はいちばん多く転生していた職業の回数を残す。勇者に渡していた職業の証(メイン・サブ)は持ち主へ返した。⏎ルイーダの酒場の単独転生は Lv300 で10回まで(1回ごとに能力を受け継ぎ、スキルパネルのSP+30)。⏎勇者は、戦い・天気・時間・場所が変わったときに、ときどきひとこと話す。同じ作品の勇者を2人以上連れていると、5〜10分に1回くらい勇者どうしの掛け合いもある(吹き出しと声は、仲間の声の設定と声の音量に従う)。⏎勇者のくわしい能力は、DQMメニュー「パーティ」の「パーティのステータス」(「勇者パーティ一覧」の右上の『ステータス』からも)で見られる。左でプレイヤーと連れている勇者を選ぶと、右に能力・装備・熟練度・盤・覚えている技が出る(「預けた人も見る」でルイーダに預けた勇者も出る・↑↓で選ぶ・Bで盤を開く)。"},{"id":"h_herobond","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"勇者のランクと絆","body":"勇者にもモンスターと同じランク(I〜SSS)がある。ランクが高いほど、レベルが上がったときの能力の伸びが大きい。⏎◆はじめのランクは、その勇者の作品の世界のランクで決まる(世界のランク2つごとに1段: 1〜2 は F … 11〜12 は A)。⏎◆いっしょに旅をすると「絆」がたまり、満タンになるとランクが1つ上がる(あまりは次へ持ち越す)。⏎◆絆がたまること: 近くで仲間が魔物を倒す・その勇者がとどめをさす・連れて歩く・闘技場や防衛戦で勝つ・その勇者を連れて強い敵(中ボス・魔王)を倒す。⏎◆待機中・気を失っている間・酒場や馬車で休んでいる間・放置している間は、たまらない。1日にたまる量にも上限がある。⏎◆上がれる上限は、「はじめのランク」と「飼い主が行ったことのある世界のいちばん高いランクで決まるランク」の高い方から2つ上まで。行った世界が上がるほど上限も上がり、ランク12の世界まで行けば SS まで上がれる。序盤の勇者が後半まで最強にならないための決まり。⏎◆上限にいる間にたまった絆は捨てずにとっておき、上限が上がったときにまとめて使う。⏎◆旅を終えたあと(クリア後)は SSS まで上がれる。⏎◆ランクと絆のゲージは、パーティのステータスとルイーダの酒場で見られる。"},{"id":"h_difficulty","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"難易度","body":"DQM設定「基本」の「難易度」で、敵の強さを7段から選べる。変えられるのは はじまりの神殿の島(本館のある島)にいるときだけ・闘技場や砦の島では変えられない(ほかの所では灰色)。押すと確かめの画面で段を選び、「はい」で変わる。⏎◆はじめに選べる易しい段はイージーまで。イージーを選んでいるときに1時間のうちに5回死ぬとベリーイージー、ベリーイージーを選んでいるときに1時間のうちに5回死ぬとウルトライージーが解禁される(マルチは みんなの合計で10回)。ノーマルより難しい段で死んでも数えない。まだのところは「？？？」⏎◆ウルトライージー: 敵のHP×0.4・攻撃/魔力×0.4⏎◆ベリーイージー: HP×0.6・攻撃/魔力×0.6⏎◆イージー: HP×0.8・攻撃/魔力×0.8⏎◆ノーマル: いつもどおり⏎◆ハード: HP×1.6・攻撃/魔力×1.25⏎◆ベリーハード: HP×2.2・攻撃/魔力×1.6⏎◆ウルトラハード: HP×3.2・攻撃/魔力×2.1⏎◆守備/魔守と経験値は どの難易度でも同じ⏎◆変えたあとに出てくる敵から効く。もういる敵は、出てきたときの難易度の強さと経験値のまま(あとで変えても変わらない)。マルチでは OP の人(LAN はワールドの持ち主)だけ変えられる。⏎◆冒険の記録のランキングでは、魔王を倒した記録にだけ（普）（難）などの印が付く。印は その魔王を倒したときの難易度(同じ魔王を何度も倒したら いちばん難しい難易度)。ほかの記録には印は付かない。"},{"id":"h_heroes","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"勇者を仲間にする(ルイーダの酒場)","body":"今の勇者7人(アンルシア・魔勇者アンルシア・イルーシャ・セラフィ・ビアンカ・フローラ・テリー)は物語で、新しい勇者83人は町で仲間になる(「新しい勇者83人」の項)。⏎勇者は、ランク10「アストルティア」の物語で出会い、仲間になる(町のイベントと同じしくみ・できごと帳に出る)。⏎◆アンルシア: 偽りのレンダーシアの「メルサンディの麦の里」に、記憶の無い少女ミシュアがいる(頭上に「！」)。話を聞いて麦畑の黒い影を倒し、大地の箱舟の中央駅から真のレンダーシアへ渡って、グランゼドーラ城の門の前へ行くと、勇者姫アンルシアとして目覚めて仲間になる。⏎◆魔勇者アンルシア: アンルシアを仲間にしたあと、偽りのレンダーシアの「グランゼドーラの平原」にいる「アンルシア姫」に話しかける。大魔王の魔界の魔幻宮殿の門の前で魔元帥ゼルドラドと魔勇者アンルシアを倒すと、仲間になる(その場で戦う・強い)。⏎◆物語でもらう大事な品: ランク5「ふたつのリング」の炎のリング(ポートセルミの丘の火口の祭壇で溶岩原人を倒す)と水のリング(滝の洞窟の奥で主を倒す)、ランク10「ゆりかごの少女」のルティアナの弓(天星の大神殿の前で異界滅神ジャゴヌバの影を倒す)は、その場の「秘宝の台座」の上に現れる。台の上に浮かぶ品を右クリックで取る。取れるのはその場面まで物語を進めた人だけで、1人1回(マルチでも1人ずつ取れる・取った人には台が空に見える)。取らずに離れても、あとで取りに来られる(台座は壊せない)。⏎◆ルイーダの酒場: 仲間にした勇者だけ、預けたり呼んだりできる(雇うのは無料・同じ勇者は1人まで)。まだ仲間にしていない勇者は「？」で、作品だけ出る。別れても育成・装備・スキルパネルは残る。Lv300 で単独転生できる(固有職業・10回まで)。⏎◆前から勇者を雇っていた人(雇っている・酒場に預けている・魔勇者のコインボスで解禁していた)は、そのまま仲間のまま。物語はあとからでも遊べる。⏎◆倒れたとき(棺桶): 勇者は倒れると棺桶になる。棺桶はあなたについてくる(離れすぎると、そばへ移る)が、戦わず、呪文・特技・道具の枠も使わず、魔物にねらわれず、ダメージも受けない。時間では起きず、ルイーダの酒場へも戻らない。⏎生きかえらせ方: ザオ系の呪文(ザオは少しのHP・ザオラルは半分・ザオリクは全快・ザオとザオラルは失敗することもある)やせかいじゅの葉を棺桶に使う/教会の神父(連れている棺桶と、馬車の中の棺桶もまとめて・Lv×10G)/回復の石板/ザオ系を覚えている仲間の勇者やペットが、そばの棺桶を起こす。起きると、またついてくる。ルイーダの酒場に預けても生きかえる。⏎◆コインボスはコインで戦う形をやめ、それぞれの世界の専用の物語で戦う(「コインボスの専用イベント」の項)。持っていたコインは主の証へ払い戻される。⏎◆物語の人(ミシュア・偽りのアンルシア姫)は、その話がまだ済んでいない人にだけ見える。ほかの人が先に済ませても、まだの人は会って仲間にできる。⏎勇者はみな、自分のレベルの前後5くらいで加わる。ただし、その勇者のランクで決まった上限より上にはならない(ランク1〜2 Lv23・3 Lv49・4 Lv73・5 Lv82・6 Lv89・7 Lv94・8 Lv106・9 Lv145・10 Lv162・11 Lv200・12 Lv226)。⏎仲間になった勇者は、はじめの装備一式を身につけている(いちばん得意な武器の種類のいちばん弱い品・皮のぼうし・皮のよろい・皮のこて・皮のくつ、片手の武器なら皮の盾も)。空いている枠だけに付き、1人の勇者に1回だけ。前からいる勇者は、次に呼び出したときに付く。⏎◆見た目の切りかえ: 見た目が2つ以上ある勇者(アンルシア・魔勇者アンルシア・セラフィ・ビアンカ・フローラ・テリー・アリーナ・ハッサン・グレイグは「専用モデルの姿」と「勇者ベースの姿」、イルーシャは「専用モデルの姿」「神々しい衣装」「緑の衣装」、ベロニカは「こどもの姿」「大人の姿」、セーニャは「いつもの姿」「短い髪」)は、DQMメニューの「パーティのステータス」でその人を選び、右上の「見た目」の ◀ ▶ で順に切りかえられる(はじめは専用モデルの姿・ルイーダや馬車に預けている勇者も切りかえられる)。変わるのは見た目だけで、能力・技・名前・声は同じ。アリーナとハッサンの専用モデルの姿は素手で、手に持つ装備を描かない(装備の能力はそのまま効く)。"},{"id":"h_lulu_board","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"ルルのスキルパネル","body":"ルルは勇者たちとは別の、同行の仲間。技はルルのスキルパネルで取る(DQMメニュー「パーティのステータス」などから)。SP は倒したランクの魔王の数で増える段ごとにもらえる。全部のマスは取れないので、道を選んで育てる。⏎振り直し: 盤の右下の「ルルのパネルを振り直す」で、はじまりのマスのほかを全部戻して SP を全部返す(1枚 1,000G・払ったゴールドは戻らない)。"},{"id":"h_carriage","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"馬車","body":"物語で馬車を手に入れると、白い馬の引く馬車がうしろについてくる(1人に1台)。並びは「あなた → 勇者 → 馬車 → 勇者」と、馬車の左右に勇者(連れている勇者4人)。⏎◆町・城・ダンジョン・施設・中ボスの拠点・魔王の城には入らない。あなたが中に入ると、馬車は入口の外で待ち、出てくるとまたついてくる。ルーラや旅の扉で移ったときも、着いた所が外ならそばに来る。⏎◆馬車の中: 戦う4人とは別に、勇者が10人まで乗れる。馬車を右クリック(か DQMメニュー「パーティ」の「馬車の中」)で、戦う仲間と馬車の中を入れかえる(馬車のそばで、町などの外のときだけ)。ルイーダのそばなら、酒場で待つ勇者を馬車に乗せたり、酒場へ戻したりできる。⏎◆倒れたとき: 勇者は倒れると棺桶になる(「勇者を仲間にする」の項)。馬車がそばにいて町などの外で、控えに元気な勇者がいれば、棺桶は馬車に運ばれ(棺桶のまま)、控えの勇者が馬車からとびだして交代する。控えがいない・町などの中・馬車が遠いときは、棺桶のままついてくる(町などから出ると、そこで交代する)。馬車の中の棺桶の勇者は、教会の神父で生きかえらせられる(Lv×10G・宿屋では起きない)。⏎◆運転: 「馬車の中」の『運転を代わる』で御者台に乗る。前後で進む・下がる、左右で向きを変える(走ると少し速い)。段差は1段まで上がり、水には入らない。Shift で降りると御者に戻る。町などの範囲の手前まで来ると止まって降ろされる(「馬車は ここで 待っています。」)。運転中に攻撃されても降ろされない(Shift で降りて戦える)。⏎馬車の中の勇者にも、魔物を倒すと連れている勇者の1/10の経験値が入る(気絶している勇者は除く)。⏎◆馬車の表示: DQMメニュー「仲間」→「パーティ」の『馬車の表示』(DQM設定「ペット」の『馬車の表示』も同じ)をOFFにすると、自分の画面で馬車を描かず、右クリックも当たらなくなる(自分の馬車もほかの人の馬車も・自分が運転している馬車は出る)。ついてくる・勇者の入れかえなどはそのまま。⏎DQM設定「ペット・騎乗」の「倒れた勇者の入れかえ」を「しない」にすると、棺桶になった勇者を馬車の勇者と入れかえない(棺桶のままついてくる)。はじめは「する」。"},{"id":"h_newheroes","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"新しい勇者83人(町で仲間にする)","body":"DQ1〜DQ11 の主人公と仲間たち83人が、その作品のランクの「城と城下町」(1 ラダトーム・2 ローレシア・3 アリアハン・4 エンドール・5 ポートセルミ・6 レイドック・7 グランエスタード・8 サザンビーク・9 サンマロウ・10 メギストリスの都・11 サマディー)に立っている(名前の上に名札)。⏎◆主人公と主な仲間(46人)は物語で仲間になる(「主要な勇者の物語」)。ほかの人は、話しかけると、ひとこと話す。条件(ゴールド・そのランクの魔王・中ボス・城と町の物語・ほかの勇者・マスターランク)がそろっていれば「仲間にする」を選べる。払うのはゴールドだけで、ほかの条件は減らない。条件がまだなら、足りないものを教えてくれる。⏎◆DQ3 の職業の18人は、ランク1〜3の町や施設に1人ずつ立ち、短いイベントで仲間になる(「DQ3 の職業の人」)。アリアハンのルイーダの酒場では、まだ会っていない人の噂を教えてくれる。⏎◆キーファは、城と町の物語(王子と秘密の地下室)を終えたあと、物語の人に話しかけると仲間にできる。トルネコは主要な勇者の物語(1人ずつの話か全員参加の話)で仲間になる。カンダタはシャンパーニの塔の中ボスを倒すと、アリアハンの地下水道で仲間にできる。条件の中ボス・魔王・物語・ほかの勇者がそろうまでは、町に立たない(オルテガ・精霊ルビスはランク3の魔王のあと・旅装のアリアハンの勇者はアリアハンの勇者を仲間にしたあと)。ヘンリー・モリー・ダストンは、本家のイベントの物語の人がその人で、物語を終えたあとに話しかけると仲間にできる。アリーナは、ソレッタでクリフトの熱を治したあと(病の神官とパデキア)、ソレッタに立つ。⏎◆仲間になるとそばに来る。そのあとはルイーダの酒場で連れ出したり、酒場で待たせたりできる(今の勇者と同じ)。いっしょに戦えるのは、ペット10匹とは別に勇者4人まで。⏎◆1人1つの固有職業(型は勇者・戦士・荒くれ・騎士・武闘家・僧侶・魔法使い・賢者・魔法剣士・商人・遊び人・盗賊・まもの使い・踊り子・弓の騎士・ムチの魔女)と、本人だけの盤(199マス)を持つ。盤の5つの系統は型の技、1つは本人の得意技・看板の大技・型の極意・特性。強さは今の7人と同じくらい。⏎◆ルイーダの酒場の画面: 顔の格子で全員を見られる。左で名前を探したり、作品・戦い方・状態でしぼりこむ。ホイール・右のスクロールバー・矢印キーで送る。右で連れ出す・別れる・単独転生・スキルパネル。⏎ジャン(DQ7)は、ランク7の魔王を倒したあとでないと雇えない。"},{"id":"h_dq3jobs","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"DQ3 の職業の人(ランク1〜3の町)","body":"DQ3 の職業の18人(戦士・武闘家・僧侶・魔法使い・商人・遊び人・盗賊・賢者・まもの使いの男女)は、ランク1〜3の町・ほこら・施設に1人ずつ立っている。話しかけると短いイベントで仲間になる(1人1回)。⏎【ランク1】戦士(男) ラダトーム城下の堀と橋・戦士(女) 武器屋・武闘家(男) 祠・僧侶(女) ラダトームの教会・魔法使い(男) ラダトーム城の書庫・魔法使い(女) ラダトーム城下の屋敷⏎【ランク2】武闘家(女) ローレシア城下の丸い広場・僧侶(男) ローレシアの教会・商人(男) 港のある町・商人(女) 道具屋・遊び人(男) 小さなメタスラ城・盗賊(男) ローレシア城下の酒場⏎【ランク3】遊び人(女) アリアハン城下のルイーダの酒場・盗賊(女) アリアハンの宿屋・まもの使い(男) ジパングの竹林・まもの使い(女) アリアハン城下の堀・賢者(男女) ダーマ神殿⏎◆仲間にする形: お金を渡す(ランク1 1,000G・2 4,900G・3 9,200G)・品を渡す(鉄鉱石・薬草・花のみつ・白いかいがら・べっこう・かがみの石)・話すだけ(職業Lv・中ボスのあと・何度も話す)・仲間を連れて見せる(数・配合ランク・系統)・呪文の問いに答える(まちがえても何度でも)。足りないときは、何が要るかを教えてくれる。賢者の2人はマスターランク H 以上。⏎◆加わるときのレベルは、自分のレベルの前後5くらい(ランク1〜2の町は Lv23・3の町は Lv49 まで)。新しい勇者83人も同じ(ランク4 Lv91 … ランク11 Lv250)。⏎◆DQ3 の職業の人は、ランク1から仲間にできるぶん、能力の伸びは配合ランク F のペットくらい(主人公や主な仲間より弱め)。⏎◆アリアハンのルイーダの酒場を開くと、まだ会っていない人の噂(どの町にいるか)を1つ教えてくれる。"},{"id":"h_mainheroes","unlockStage":4,"majorCategory":"職業","minorCategory":"勇者","title":"主要な勇者の物語","body":"各作品の主人公と主な仲間(47人)は、ゴールドではなく物語で仲間になる。⏎◆1人ずつの話: 主な仲間は、その作品の城と城下町に物語の人として立っている(頭上に「！」)。話しかけると短い話が始まり、品を渡す・仲間の魔物を見せる・手合わせ・中ボスのあと などで仲間になる。アリーナ・ハッサン・キーファ・ラグアスは、今の城と町の物語を終えると仲間になる(ゴールドはいらない)。クリフトは本家のイベント「病の神官とパデキア」のあとソレッタで、カミュは「悪魔の子の脱出」で牢を抜けたあとに話しかけられる。ムーンブルク王女は、ムーンペタの町の物語「犬にされた王女と ラーの鏡」で仲間になる。ホメロスは、全員参加の話「命の大樹の下で」を終えてグレイグを仲間にしたあと、デルカダールの高地(バイオームの石板・白のそば)に立つホメロスに話しかけると「光と影の誓い」が始まり、魔軍司令の姿の影を倒すと仲間になる(見た目は専用モデル・勇者ベース・魔軍司令の姿から選べる)。⏎◆全員参加の話: ランク2〜11は、その作品の主人公が待っている。主な仲間を2人仲間にするか、そのランクの中ボスを半分倒すと始まり、仲間がそろって親玉と戦う。最後に主人公と、まだ仲間でない主な仲間がまとめて仲間になる(ランク3・4は主人公の男女を選ぶ)。ランク3は DQ3 の職業の人を2人でも始まる。⏎◆ランク1のロトの勇者は1人の話(沼地の洞窟の中ボスのあと)。ランク12は、歴代の主人公を3人仲間にすると「歴代の勇者のつどい」が始まる。⏎◆進み具合は DQMメニュー「基本」の「できごと帳」で見られる。⏎◆称号の効き目: 全員参加の話を終えるともらえる称号を持っていて、その作品の勇者を3人以上いっしょに連れている(戦う枠・気絶していない・近くにいる)と、自分と勇者の全能力が+3%(いくつそろっても+3%は1回だけ)。効くとアクションバーに「★ 称号「○○」の 効き目」と出る。ランク12の称号は、歴代の主人公を4人連れていると効く。今の7人は、アンルシア・魔勇者アンルシア・イルーシャ・セラフィが DQ10、ビアンカ・フローラが DQ5、テリーが DQ6 として数える。⏎ランク1〜4の勇者(ロトの勇者・アリアハンの勇者・天空の勇者と導かれし者たちなど)は、物語を終えても、そのランクの魔王を倒すまでは加わらない(魔王を倒すと、約束どおり仲間になる)。"},{"id":"h_kirakira","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"キラキラ","body":"ランクの世界の地面には、ところどころ白金の星がまたたく「キラキラ」がある(野外・ダンジョンや目玉の建物の中・町や城の中)。右クリックで拾うと、品が1つ出る。⏎◆出るもの: 道具(薬草・毒消し草・花のみつ・キメラのつばさ・せいすい など)34%・ゴールド(その世界の魔物1〜4体ぶん)25%・種(力・守り・素早さ・魔力)4%・ふつうの素材20%・その土地の素材11.7%・いい素材(魔物のレアの落とし物と同じ)5%・装備(その世界のランクの武器屋・防具屋の品)0.3%。町の中のキラキラは道具とゴールドだけ。⏎◆中身は拾った世界のランクで決まる(ランク8〜12の別の世界もその世界のランク)。⏎◆人ごとに拾える。拾うとその人にだけ見えなくなり、ゲームの1日でまた光る。ただし町・城・村の中のキラキラは1人1回きりで、拾うともう光らない。1つの世界で1人が1日に拾えるのは30個まで、全部の世界を合わせて60個まで。⏎◆しばらく動いていないとき(放置)・防衛戦の最中・前に拾った所のすぐそばでは拾えない。⏎◆オーバーワールド・はじまりの神殿・決戦の異空間・メタル迷宮・魔王の塔には無い。小さなメダルのありかも同じ床の光(少し大きく強い)。⏎◆海と川の底: 水の底にも、ときどき泡の昇るキラキラがある(拾う決まりと1日30個は陸と同じ・陸と合わせて数える)。出るものは 貝がら・赤いサンゴ・海の塩・きれいな水 などの道具38%・ゴールド20%・種3.7%・ふつうの素材18%・真珠(その世界の段の「海と水辺」の素材)15%・いい素材5%・装備0.3%。⏎◆沈んだ宝箱: 海の底に、まれに沈んだ船のかけら(板・柵・樽)に囲まれた宝箱がある。開けると、その世界のランクの宝箱の品とゴールドが、開けた人に直接わたる(1人1回ずつ・マルチでは1人ずつ開けられる)。⏎◆真珠貝: 海の底の大きな貝。右クリックで開けると、真珠(ときどき1つ上の段)と貝がら・サンゴが出る。1人ずつ、ゲームの1日でまた開けられる。⏎◆海と川の底には、さんご・海草・光るこけ・沈んだ柱のかけら(海)や、丸石と水草(川)も見られる。魔王の城・中ボスの拠点・ダンジョン・町や城・目玉の建物の中には無い。"},{"id":"h173","unlockStage":4,"majorCategory":"職業","minorCategory":"必殺技","title":"必殺技とは","body":"各職業に2つずつある大技(24SP)。スキルパネルの職業のエリアで取り、魔法・特技ホットバーに入れて使う。守備を無視する。⏎パルプンテの「天変地異」は、魔王・中ボス・コインボスなどボスには効かない。⏎効果は、となりのマスを取って見えるようになれば、スキルパネルでマスを選んで確かめられる。"},{"id":"h102","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"サブ職業とは","body":"メインの職業とは別に、もう1つ職業に就ける仕組み。メインの能力はそのままに、サブ職業ぶんの力が上乗せされる。⏎ダーマ神殿で『サブ○○の証』を渡すと、その職業をサブに選べるようになる。"},{"id":"h103","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"選び方","body":"ダーマ神官を右クリックし、画面上の『サブ』タブに切り替えてから職業を選ぶ。⏎一度証を渡した職業は解禁され、以後は証なしで選び直せる。『サブを外す』でいつでも外せる。⏎メインと同じ職業はサブに選べない。"},{"id":"h104","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"効きめの大きさ","body":"サブ職業は『サブで育てたレベル』と『メインのレベルの半分』の低い方ぶんの力になる。⏎例: メイン魔法使いLv200・サブ遊び人Lv101なら、メインの半分の100が上限なので遊び人Lv100ぶん。サブ武闘家Lv10なら、半分に届いていないのでそのままLv10ぶん。⏎一度も育てていない職業はLv1として数える。サブを強くするには、まずその職業をメインで育てよう。"},{"id":"h105","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"上乗せされるもの","body":"HP・MP・攻撃・守備・魔力・魔法守備の6つすべてに加算される。⏎呪文と特技はスキルパネルで取るので、サブ職業で増えることはない。"},{"id":"h106","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"適正は良い方","body":"武器の適正・盾の適正・呪文の効果時間は、メインとサブで良い方が使われる。⏎例: メインが魔法使い(斧D)でもサブが戦士(斧SSS)なら、斧の適正(与えるダメージの%)は戦士の方が使われる。⏎特技は職業を問わず、スキルパネルで取って対応する武器を持っていれば使える。"},{"id":"h_subtrait","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"サブ職業の特性","body":"サブにしている職業だけ、その職業の『サブ職業の特性』が2つ効く(メインの職業のときは効かない)。⏎特性1はサブLv1・50・100・150の4段で強くなり、特性2はサブLv100から開く。⏎例: 盗賊=宝箱の中身が1つ増えることがある/魔物使い=スカウトアタックの成功率×1.03〜1.15/秘境ハンター=採集の場所で多く採れる/はぐれメタル=メタルが出るまでに倒す数が減る/忍者=倒れるダメージをHP1で耐える(1日1〜3回)。⏎特性2の例: 魔法使い「かたい集中」=呪文の消費MP−10%/勇者「魔王への勇気」=魔王と中ボスに与えるダメージ+5%。⏎中身は、ダーマのサブ職業の画面(職業にマウスを乗せる)・DQMメニューの職業ごとのステータス・特技一覧表で見られる。勇者の仲間には付かない。"},{"id":"h107","unlockStage":4,"majorCategory":"職業","minorCategory":"サブ職業","title":"サブ職業の証","body":"26職業ぶんある。ボスのダンジョン(魔王の城)の金の宝箱と、ダンジョンの名品の宝箱から見つかるほか、ダーマ神官の証ポイント交換・建物リストの記録(転職のきほん→リストで証を受け取る)・防衛戦のメダルの交換所の「職業の証」でも手に入る。⏎宝箱から出るサブの証は世界のランクで決まり、初期職はランク2以上・上級職は4以上・最上級職は6以上で出る。"},{"id":"h164","unlockStage":4,"majorCategory":"職業","minorCategory":"モンスターロード","title":"指揮とは","body":"モンスターロードのエリアのマスで取る力。取ればどの職業でも使える(指揮ゲージは、今のメインかサブがモンスターロードのときだけ画面に出る)。⏎『指揮の構え』を取ると、メインかサブがモンスターロードのときは、本人の攻撃は0ダメージになるかわりに「指揮ゲージ」を貯めてペットを強くする。ゲージは何もしないと少しずつ減る。⏎貯める: 『標的マーク』(敵を殴って印を付ける・新しい標的でゲージ+5・左クリックが10マス先まで届く)、『連携の合図』(ペットが攻撃する直前に合図のキー〈はじめはG〉で連携・ゲージ+10)。⏎作業道具か素手でブロックを狙っている間は、号令や特技より採掘・伐採・整地を優先する。⏎集中攻撃命令(MP5): 狙った敵を視線上128マス先まで指定でき、命じたペットは30秒間 攻撃+20%。"},{"id":"h165","unlockStage":4,"majorCategory":"職業","minorCategory":"モンスターロード","title":"号令","body":"『攻撃の号令』: 左クリックを押している間、ペット全員の攻撃+30%。『守りの号令』: しゃがんで押すと被ダメージ−30%。⏎押している間ゲージが毎秒1減り、MPも毎秒1減る。短く押す・敵に照準しているときは、ふつうの攻撃(標的マーク)になる。"},{"id":"h166","unlockStage":4,"majorCategory":"職業","minorCategory":"モンスターロード","title":"応援と旗","body":"『応援チャージ』: 合図のキーを長押しして離すと応援(ゲージ15)。周囲のペットをHP5〜20%回復し10秒間攻撃+20%。⏎『陣地の旗』: しゃがみ+合図のキーで旗(ゲージ20)。30秒間、旗の周囲8マスのペットは攻撃+20%・被ダメ−20%・毎秒1%回復。⏎標的マークした敵にはペットの与ダメージ+30%で、ペットが優先して狙う。連携は続けて成功すると最大+60%(8秒つながらないと切れる)。"},{"id":"h174","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"鬼神闘士","body":"戦籠手の特技はMPではなくHPを使う。戦籠手は左クリック1.5秒ためでロケットパンチ(7マスで折り返し・両手なら2個・待ち1秒)。⏎鬼神闘士のエリアの『背水の闘志』を取ると、HPが減るほど通常攻撃が強くなる(HP10%以下で+50%・『闘志強化』で最大+100%)。そのかわり受ける回復は半分、守備は−20%になる。"},{"id":"h175","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"吟遊詩人","body":"竪琴を持って右クリックで周りの仲間とペットを回復・強化、左クリックで音波攻撃(どの職業でもできる)。⏎歌は吟遊詩人のエリアのマスで取る。「発動する歌」と「ONにしておく歌」があり、ONの歌は同時に1曲(『二重奏』のマスで2曲)。⏎『狙撃の心得』のマスを取ると、遠くから射つほど威力が上がる(近すぎると下がる)。"},{"id":"h176","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"ゴーストマスター","body":"『討伐死霊化』のマスを取ると、倒した敵を20%で30秒の亡霊ペットにする(ゴーストマスターのレベル〈今のレベルと高い方〉まで育ったペットの能力の40%・同時2体・黒い炎をまとう。ボス・転生・メタルは亡霊にならない)。⏎死霊召喚I〜VIIは、図鑑で討伐済みのモンスターを60秒だけ呼び出す。大鎌で倒すほど魂が溜まり、攻撃力が上がる(最大+30%・マスで+60%まで)。"},{"id":"h177","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"ソウルマスター","body":"倒したモンスターに憑依して、その能力・魔法・固有攻撃を借りる変身の力(『憑依切替』のマス)。憑依できるのは、倒したときの抽選で開いたモンスター。憑依中はHP・MPもモンスターのものになる。⏎憑依中にHPが尽きると死なずに憑依が解けて元の姿へ戻る。解除後1分は次の憑依ができない。憑依中は遠距離武器を使えない。⏎魂の欄は、今のメインかサブがソウルマスターのときだけ画面に出る。"},{"id":"h212","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"魂ポイント","body":"ソウルマスターの憑依中に自分で魔物を倒すと、10%で魂ポイントが1増える。⏎DQMメニューの『魂ポイント割当』で系統に割り当てると、その系統の魔物に憑依したときの能力が上がる(割り当ては取り消せない)。⏎魂ポイントは、まだ割り当てていない分も、系統ごとの割り当ても1000まで。"},{"id":"h178","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"魔導銃士","body":"魔法弾を撃つ銃で戦う中〜遠距離の戦い方。『魔導射撃』のマスを取ると、射撃が攻撃力7割＋魔力3割で計算される(4マス以内は−15%)。1発ごとにMPを使う(量は銃ユニットで決まる)。⏎銃ユニット(ハンドガン・ライフル・ショットガン・マシンガン・マグナム)で撃ち方が変わる。詳しくは「アイテム＞銃」。"},{"id":"h179","unlockStage":4,"majorCategory":"職業","minorCategory":"その他の職業","title":"戦輪士","body":"戦輪を投げ、直前に当たった敵以外のいちばん近い敵へ次々に跳ね返して集団を削る(壁でも跳ね返る)。⏎戦輪を持って左クリック長押しし、光ったら離して投げる。跳ね返るのは2回(『戦輪の跳弾』のマスで増える)で、敵に跳ねるたびに威力が15%ずつ下がる(マスで減りを小さくできる)。"},{"id":"h167","unlockStage":4,"majorCategory":"職業","minorCategory":"秘境ハンター","title":"旅の心得と急襲","body":"『旅の心得』(SP5): 全能力+3%。⏎『急襲』(SP12): 3マス以上落ちながら、自分より下の敵を殴ると落差1マスごとに+7.5%(上限+50%)。捕捉中の敵にはさらに+25%。決めた着地は落下ダメージ無し、周囲3マスの敵を1秒ひるませる。"},{"id":"h168","unlockStage":4,"majorCategory":"職業","minorCategory":"秘境ハンター","title":"罠","body":"罠は秘境ハンターのエリアのマスで取る(落とし穴の罠・スパイクの罠・粘着の罠)。作業台で作る使い捨ての罠(1回で2個)を地面に置く(落とし穴=木材4+ツタ2 / スパイク=鉄鉱石3 / 粘着=スライムゼリー2)。⏎踏んだ敵モンスターに、落とし穴=2秒拘束、スパイク=本人の攻撃力×2の一撃、粘着=6秒間移動-70%。どれもかかった敵を8秒「捕捉」にする(急襲+25%・本人を見失わない)。⏎同時に置けるのは3つ(『罠設置拡張II』で+2・『III』で+3・最大8)。超えると古い罠から消える。"},{"id":"h169","unlockStage":4,"majorCategory":"職業","minorCategory":"秘境ハンター","title":"秘境跳躍","body":"秘境ハンターのエリアの特技(SP12)。真上へ100マス跳び上がり、4秒ほど空中に留まって周りを見渡せる(天井があれば その手前まで)。降りるときの落下ダメージは無し。MP8・待ち5秒。跳んだ直後1秒は無敵。高所から地形や敵の位置を確かめる・急襲の落差を稼ぐのに使う。"},{"id":"h170","unlockStage":4,"majorCategory":"職業","minorCategory":"秘境ハンター","title":"遺跡の痕跡と鑑定","body":"『遺跡の痕跡』のマス(SP24)を取ると、ランク3以上のバイオームの地表にある「遺跡の痕跡」が本人にだけ薄い光で見える(必殺技「大発見」でも表示)。⏎その場所を掘ると「未鑑定の遺物」が出る。道具屋の「鑑定」タブで100G払うと、そのランク帯の宝箱と同じ表から1品になる。他の人には見えず、掘っても出ない。"},{"id":"s_mera","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"メラ","body":"消費MP: 2 / 基本威力: 20 / 範囲: 単体⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_merami","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"メラミ","body":"消費MP: 4 / 基本威力: 40 / 範囲: 単体⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_merazoma","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"メラゾーマ","body":"消費MP: 6 / 基本威力: 60 / 範囲: 単体⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_meragaia","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"メラガイアー","body":"消費MP: 8 / 基本威力: 80 / 範囲: 単体⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_gira","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"ギラ","body":"消費MP: 3 / 基本威力: 15 / 範囲: 直線5マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_begirama","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"ベギラマ","body":"消費MP: 5 / 基本威力: 30 / 範囲: 直線9マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_begiragon","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"ベギラゴン","body":"消費MP: 7 / 基本威力: 45 / 範囲: 直線13マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_giragureido","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(炎)","title":"ギラグレイド","body":"消費MP: 9 / 基本威力: 60 / 範囲: 直線17マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_hyado","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(氷)","title":"ヒャド","body":"消費MP: 2 / 基本威力: 18 / 範囲: 単体⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_hyadaruko","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(氷)","title":"ヒャダルコ","body":"消費MP: 4 / 基本威力: 36 / 範囲: 十字5マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_mahyado","unlockStage":4,"majorCategory":"呪文","minorCategory":"攻撃呪文(氷)","title":"マヒャド","body":"消費MP: 6 / 基本威力: 54 / 範囲: 十字9マス⏎ダメージは「(魔力＋威力−相手の魔法守備÷2)÷2」(殴りと同じ形)。魔力を伸ばすほど強くなる。"},{"id":"s_mahyadode
