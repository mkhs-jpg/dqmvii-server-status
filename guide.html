  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }

  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }

  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }

  <script id="page-data" type="application/json">{"rows":[{"id":"h_terms","unlockStage":1,"majorCategory":"はじめに","minorCategory":"このMODについて","title":"利用規約(かならず読んでね)","body":"このMODは自由に遊べる(1人・マルチ・サーバー・配信や動画もOK)。⏎◆作者の許可なくしないでほしいこと: ほかの場所での再配布・中身を書きかえた版の配布・逆コンパイルなどの解析・絵や声や曲などの素材の抜き出しと流用・AI(生成AI・コード解析のAI・大規模言語モデル)への読み込み(学習・解析・要約・改変の手伝い)。⏎◆ドラゴンクエストの権利は各権利者のもの。このMODは権利者とは関係のない非公式のファンメイド作品。⏎◆声は AivisSpeech と VOICEVOX で作っている(使った声は同梱の VOICE_CREDITS.txt)。⏎くわしくは MOD の jar に入っている DQMVII_利用規約.txt と、紹介サイトの「利用規約」のページで。"},{"id":"h001","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"マイホームの島と部屋","body":"はじまりの神殿の南東の旅の扉から、自分の『マイホームの島』へ行ける(1人1つ・パーティの仲間の島へも遊びに行ける)。⏎島に部屋を作り、設備のブロックを置くと「鍛冶場」や「農作業の小屋」になる。部屋の数え方はビルダーの旗と同じ(かべ2段・ドア・明かり・床4〜150マス)。⏎前のモンスターポート4種は 0.35.61 でやめた。部屋と設備のブロックは、島でだけ動く(ほかの人の島では使えない)。⏎島のまん中(家の前)には、はじめから自分のビルダーの旗が立っている(島の家などの部屋で町の評価ができる)。ほかの場所にもう旗を立てている人には置かない(島へ移すときは、旗をこわして島で立て直す)。"},{"id":"h002","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"マイホームの鍛冶場","body":"炉と金床のある部屋が「鍛冶場」。金床を右クリックすると鍛冶の画面(設計図帳・打つ・打ち直し・おまかせ打ち)。⏎ほかの設備(ふいご・焼き入れの水おけ・砥石の台・宝石細工の台・設計図の机・素材の棚・武器掛け・防具立て・鍛冶神の像)の種類の数で格が上がる: ★1 炉＋金床 / ★2 ＋3種 / ★3 ＋6種 / ★4 ＋9種と魔法の炉。格の数だけ手伝いを付けられる(1〜4匹)。⏎設備の効き目: ふいご 温度の上限+300℃・火力上げ+100℃ / 焼き入れの水おけ ずれの合計−1(★が出やすい) / 砥石の台 打ち直しの集中力+10・費用−20% / 宝石細工の台 ★2以上の武器に10%(★3は20%)で錬金効果を1つ / 設計図の机 右クリックで設計図帳・おまかせ打ちの★1+10% / 素材の棚 作るたび10%で素材1つ返す / 武器掛け・防具立て ぶれ−10% / 鍛冶神の像 会心率+1.5% / 魔法の炉 ランク8〜12の品は温度+200℃ではじまり、ぶれ−10%。⏎★1でも今までの鍛冶でできることは全部できる(設備は「足すと良くなる」だけ)。"},{"id":"h003","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"農作業の小屋","body":"種の棚と水おけのある部屋が「農作業の小屋」。種の棚を右クリックすると農作業の小屋の画面: 左に手伝いのカード(クリックで担当を切りかえ)と部屋の格、まん中に上から見た畑と「耕した土・植えた・実った・空き」の数、右に区画に植える種(筆)と倉庫と今の仕事(「倉庫を開く」で倉庫の画面・「みんな取り出す」で持ち物へ)。一斉収穫・実りを溜める・畑しごとを止める・範囲を見せる・手伝いをえらぶ・農園の管理盤・品種図鑑のボタンもここ。上の農業Lvにマウスを乗せると倍率の理由が出る。代表作業はDQM設定「軽量化」の「農作業の小屋の代表作業」へ移した(メニューが「旧」のときは今までの画面)。⏎手伝いの子が、種の棚のまわり20マス(上下4マス)の耕した土に種をまき、実ったら収穫する。畑を勝手に広げたり、物をどかしたりはしない(畑は自分で耕す・島の東西の畑も使える)。種・肥料・とれた作物は種の棚の中の倉庫にしまう。⏎格: ★1 種の棚＋水おけ / ★2 ＋3種 / ★3 ＋6種 / ★4 ＋9種と星見の祭壇。数えるのは小屋の肥料の樽・まかないの台・品種図鑑の机と、種の棚のまわり16マス(上下16マス・屋根の上も入る・種の棚が2つ以上ならどの棚のまわりでもよい)の農園の台と施設の種類。⏎効き目: 肥料の樽 収穫のとき10%で1つ多く / まかないの台・品種図鑑の机 右クリックで近くの台の農園の管理盤 / 品種図鑑の机 交ざりの芽×1.2 / ★3 交ざりの芽×1.25・★4 ×1.5。"},{"id":"h004","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"ペットの手伝い","body":"炉(鍛冶場)か種の棚(農作業の小屋の画面の「手伝いをえらぶ」)から手伝いの画面を開く。ベルの中の仲間をクリックすると部屋の手伝いに付き、島に出てきて部屋のまわりで働く(戦いの10匹には数えない)。カードの『外す』でベルへ戻る(ベルがいっぱいなら、そばに出る)。⏎付けられる数は部屋の格の数(1〜4匹)。気絶している子と人間の仲間は付けられない。⏎鍛冶Lvは手伝いの鍛冶の力の合計を12倍に数える(上限1500・前のポートの30匹ぶんと同じ。さらに行ったことのある いちばん高いランク×100＋150まで)。農業の力も12倍、建築の机の建築の力は7倍。⏎なぜ倍率があるのか: 部屋の設備(鍛冶場は炉と金床・農作業の小屋は種の棚と水おけ・建築の机)が、手伝いの子の力を引き出すから。ランクの高い装備は鍛冶Lvが数百いるのに、手伝いは1〜4匹(1匹の力1〜50)なので、力をまとめて大きくして前のポート(30匹×50＝1500)と同じ所まで届くようにしている。⏎倍率は部屋の種類だけで決まり、格(★)や設備の数では変わらない。合計を上げるには、力の強い子を付けるか、格を上げて手伝いの数をふやす。⏎ペット1匹の力(ペットの画面の「鍛冶Lv」など)には倍率はかからない。手伝いの画面・金床と種の棚の画面・鍛冶の画面では、合計の横に「＝ 力2 × 倍率12」のような内わけが出て、マウスを乗せると倍率の理由が出る。⏎『くわしい設定』で担当(火入れ・鍛打・仕上げ／種まき・水やり・収穫)や、おまかせ打ち・実り溜めなどの画面を開く(農作業の小屋は種の棚の画面と同じ)。⏎部屋のブロックを壊すと、中の手伝いは持ち主のベルへ戻る(持ち主がいないときは、つぎにログインしたときに戻る)。"},{"id":"h_homedecor","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"島の置き物と魔王のトロフィー","body":"部屋の設備は、形どおりの小さな模型で置かれる(当たり判定も形どおり)。⏎◆島の置き物: 土地の祭壇・ポスト・島の旗・天気見の水晶・温泉の湯ぶね・勲章の飾り台。建材屋で買える飾り(今は右クリックしても何もしない)。⏎◆魔王のトロフィー: ランクの魔王(最後の姿)をはじめて倒すと、そのランクのトロフィーが1つもらえる。前に倒した魔王のぶんも、ログインのときにもらえる。1人1回ずつなので、なくさないように飾ろう。"},{"id":"h_shared_island","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"みんなの島","body":"マルチプレイで、みんなで使える大きな島。マイホームの島の旅の扉(か、うしろの石板)を右クリックした「どの島へ行く？」の画面の『みんなの島』から行ける(サーバーに1つ・はじめてだれかが行くときに作るので、少し待ってからもう一度選ぶ)。⏎みんなの島の旅の扉に乗ると、自分のマイホームの島へ戻る。ルーラ・キメラのつばさには「みんなの島」で自動で登録される。⏎◆共有の決まり: 島の中では、だれでもブロックを置けて壊せる。畑の作物は、取った人のもの(畑はだれも踏み荒らせない)。⏎◆設備はみんなで使う: 金床・種の棚・農作業の小屋・農園の台・施設などは、だれでも開けて使える。こわせるのは置いた人だけ。動きは使う人の鍛冶Lv・農園Lv・段で決まる(ルルの話をまだ聞いていない段は、みんなの島でも使えない)。農園の台と施設は、いちばん最近 管理盤を開いた人(その人がいないときは置いた人)の農園Lvと段で動く。⏎◆中の倉庫はみんなのもの: だれが開いても同じ中身で、とれた作物や掘った鉱石もそこへ入る。手伝いの仲間を外したり呼び出したりできるのは、預けた人だけ。⏎◆設計図もみんなで: みんなの島の金床では、自分の設計図帳と、いまサーバーにいる島の仲間(みんなの島に来たことのある人)の設計図帳を合わせたもので作れる(人の設計図帳そのものは増えない)。1つの金床で打てるのは1人ずつ。ほかの人が打っている間は、終わるまで待つ。⏎◆みんなの町: 北の区画のまん中に「みんなの町の旗」が1本立っている(こわせない)。旗のまわり(はじめは半径24マス・旗の画面でだれでも 24・32・48・64 から選べる)・上下16マスに、ビルダーの旗と同じ決まりで部屋を作ると町の点になり、町のレベル(1〜30)が上がる。点とレベルはみんなで共有で、だれの部屋かは問わない。旗を右クリックで町の評価。隠しレシピは旗を開いた人が見つけたことになり、ヒント(「？？？」のヒント・あと少し・置いたときのつぶやき・ルルのひらめき)もビルダーの旗と同じように出る。みんなの島の中には自分のビルダーの旗は立てられない。⏎◆町が育つ(人ごとに配るごほうびは無い): Lv2 町の中にいると10秒ごとにHP・MPが最大の2%戻る／Lv3 広場の四すみにかがり火台／Lv4 町の倉庫(チェスト・だれでも入れて出せる)／Lv5 町の中で足が少し速くなる／Lv6 小さな噴水・回復3%／Lv7 花のアーチ・町の中でジャンプが少し高くなる／Lv8 鐘楼の鐘・回復4%／Lv9 町の大時計・倉庫が2つに／Lv10 三段の大噴水と王都の紋章旗・回復5%／Lv12 外がわのかがり火台4つ／Lv15 光の玉／Lv20 光の玉・回復6%／Lv25 四すみの外のかがり火台／Lv30 王都の紋章旗がふえる・回復7%。効き目は町の中にいる間だけ。広場の飾りと倉庫はこわせない(部屋をこわして町のレベルが下がっても飾りは残る・効き目は今のレベル)。⏎ルルの手ほどきは、自分のマイホームの島にいるときだけ話す。"},{"id":"h005","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"建築の机","body":"『建築の机』を島に置いて右クリックすると、建築の画面(建物読込と回る立体の見本・施設アイテムの建築・整地)。手伝いは4匹まで、多いほど速い。建築力は手伝いの建築の力の合計×7(上限1500・4匹×50×7＝1400で前のポートとほぼ同じ所まで届く)。マイホームの島でだけ使える。⏎真上に出る『建築資材チェスト』を開き、『向き』ボタンで建てる方角を選ぶ。施設アイテムをスロットへ入れて『建築』を押すと、まず整地し、資材を運んで少しずつ建ててくれる。⏎できあがるまでのおおよその時間は、手順3の帯に「あと 約○分」と出る(建てる前は手伝いの建築力から・建てはじめて少したつと実際の速さから。帯にマウスを乗せると手伝いの数も)。"},{"id":"h185","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"整地モード","body":"GUIの『整地モード:OFF』を押すと専用の設定画面が開く。横幅・奥行き・高さは各1〜50、方角は北・東・南・西から選び、『整地を開始』でONになる。横幅は左右中央、奥行きは選んだ方角へ伸び、床面は建築の机の1ブロック下。建築Lvで範囲は変わらない。⏎建築の予定が無いあいだ、床面より上の指定した高さまでを崩して建築資材チェストへ運び、へこみを丸石で埋める。埋める石材が無いときは知らせてくれる。"},{"id":"h006","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"建てられない場所","body":"宝箱や岩盤など、壊せない大切なブロックがある場所には建てられない。"},{"id":"h007","unlockStage":1,"majorCategory":"はじめに","minorCategory":"マイホームの部屋","title":"次の解放","body":"マイホームの島ができると『炉』『金床』と、木の剣[DQM用]を1本打てる『板材2個』『棒1本』、はじめの設計図がもらえる。⏎部屋と設備のブロックは、建材屋で買えるほか、鍛冶(アイテム/特殊ブロック)でも作れる(宝石細工の台・品種図鑑の机・鍛冶神の像・魔法の炉は、そのランクの魔王を倒すと作れて、建材屋にも並ぶ)。"},{"id":"h008","unlockStage":2,"majorCategory":"はじめに","minorCategory":"鍛冶場","title":"鍛冶場の使い方","body":"金床を右クリックして鍛冶の画面を開く。一覧から作りたい物を選ぶと、素材は手持ち・持っている大きな袋・金床の中の倉庫から自動で集まる。鍛冶の画面の上の「倉庫」で、金床の中の倉庫を見て出し入れできる(自分のマイホームの島に置いた金床だけ)。金床をこわすと、倉庫の中身ごと1つの品になり、置き直すと倉庫へ戻る。⏎金床のまわり8マスにある、自分のマイホームの島の中のチェスト・樽・DQMの宝箱の素材も使える(使う順は 持ち物→袋→金床の倉庫→近くの箱)。⏎一覧の上の『作れる物だけ』『図鑑にない品だけ』で絞りこめる。装備図鑑にまだ記していない武器・防具・盾・アクセには「図鑑 未」の札が付く。"},{"id":"h009","unlockStage":2,"majorCategory":"はじめに","minorCategory":"鍛冶場","title":"鍛冶Lvと仕上がり","body":"鍛冶Lvは、鍛冶場の手伝いの鍛冶の力の合計×12(1匹1〜50・上限1500)。たとえば鍛冶の力2の子を1匹付けると 2×12＝24。⏎12倍なのは、鍛冶場の設備(炉と金床)が手伝いの子の力を引き出すから。ランクの高い装備は鍛冶Lvが数百いるのに手伝いは1〜4匹なので、力をまとめて大きくしている(前のポートの30匹×50＝1500と同じ上限)。倍率は格(★)や設備では変わらない。⏎鍛冶の画面の上の「鍛冶Lv」や手伝いの画面に内わけが出て、マウスを乗せると理由が出る。ペット1匹の鍛冶の力には倍率はかからない。前のモンスターポートは倍率なし(入っている仲間の力をそのまま足す)。⏎鍛冶Lvには、行ったことのある いちばん高いランクで決まる上限がある(ランク×100＋150・ランク1 250・ランク3 450・ランク12 1350)。先のランクの世界へ進むと上がる。⏎レシピごとに必要な鍛冶Lvがあり、足りないと作れない。仕上がり(★)は、自分で打つときにゲージをどれだけ基準値へ寄せたかで決まる(「鍛冶」→「打つ」の項)。"},{"id":"h010","unlockStage":2,"majorCategory":"はじめに","minorCategory":"鍛冶場","title":"鉱石を持ち帰る","body":"火入れ・鍛打・仕上げのどの担当にも就いていない手伝いが、10分ごとに1匹ずつ順番に鉱石を1個持ち帰る(金床の中の倉庫へ・倉庫がいっぱいの間は掘らずに知らせる)。⏎持ち帰る鉱石の段階は、掘るペットの鍛冶の力で決まる。⏎鉱石掘りは、金床の持ち主が島にいて放置中でないあいだ進む。島を離れているあいだ(ほかの世界へ冒険に出ているとき)の分は、持ち主が島に戻ったときにまとめて進む(留守の時間は、ログインしていて放置中でないあいだの時間で数える・何時間でも上限は無い・倉庫がいっぱいになったらそこで止まる・長い留守の分は戻ってから少しずつ進むので、すぐには終わらないこともある)。戻るとチャットと画面の右の枠で「留守のあいだに ○個 しまった」と知らせる。"},{"id":"h011","unlockStage":2,"majorCategory":"はじめに","minorCategory":"鍛冶場","title":"次の解放","body":"何か1つ作ると『種の棚』『水おけ』と『薬草の苗5個』がもらえる。"},{"id":"h012","unlockStage":3,"majorCategory":"はじめに","minorCategory":"農作業の小屋","title":"農作業の小屋の使い方","body":"小屋に種の棚と水おけを置き、種の棚の画面で仲間を付ける。手伝いの子が、種の棚のまわり20マスの耕した土で種まきと収穫をしてくれる。冒険に出ているあいだの分も、島に戻ったときにまとめて進む(「畑はペットに任せる」の項)。"},{"id":"h012b","unlockStage":3,"majorCategory":"はじめに","minorCategory":"農作業の小屋","title":"畑は自分で耕す","body":"前の農業用ポートとちがい、畑を作ったり、上の物をどかしたり、地面を張り替えたりはしない。⏎クワで耕した土(地形タブの土・草ブロックも耕せる)と、島の東西の畑を使う。耕した土は水の近くで湿る。"},{"id":"h013","unlockStage":3,"majorCategory":"はじめに","minorCategory":"農作業の小屋","title":"種と肥料","body":"種は種の棚の中の倉庫に入れておく。種の棚の画面の「倉庫」で倉庫の画面を開き、持ち物の枠をクリックすると1スタックずつ倉庫へ入る(Shift＋クリックで同じ物をまとめて・「種と肥料を入れる」で持ち物の種と肥料をまとめて)。倉庫の枠をクリックすると1スタックずつ持ち物へ、右クリックで半分を移す(持ち物の枠の右クリックは半分を倉庫へ)、「みんな取り出す」で全部を持ち物へ、「作物だけ出す」で種と肥料を残して作物などを全部持ち物へ(農作業の小屋の画面の「作物を取り出す」も同じ)。下の「クリックで動かす数」を「同じ物ぜんぶ」にすると、クリックで同じ物をまとめて動かす(そのときは Shift＋クリックで1スタック)。閉じるのは ESC か「とじる」。⏎とれた作物も倉庫に入る。使える枠は小屋の格で ★1 108・★2 144・★3 180・★4 216(多いときはホイールか右のつまみで送る)。いっぱいになると収穫を止めて知らせる。種の棚をこわすと、倉庫の中身ごと1つの品になる(置き直すと倉庫へ戻る)。倉庫を開けるのは自分のマイホームの島だけ。⏎種の棚の真下にホッパーを置くと、倉庫の中の作物を吸い出せる(種・肥料・水入りバケツは植えるために残る)。金床の真下のホッパーは、金床の倉庫の中身を吸い出す(吸い出した素材も、金床のまわりの自分の島の箱に入れておけば鍛冶に使える)。ホッパーで倉庫へ入れることはできない。⏎超肥料・極肥料も倉庫に入れておくと自動で使う(極肥料が先)。⏎倉庫の画面の「取り出す先」を「大きな袋」にすると、取り出した物が持っている大きな袋へ入る(その品を集める設定の袋が先・入らない分は持ち物へ)。"},{"id":"h014","unlockStage":3,"majorCategory":"はじめに","minorCategory":"農作業の小屋","title":"担当を決める","body":"種の棚の画面の手伝いのカードをクリックして(押すたびに 種まき→水やり→収穫→なし)、担当を決めると、それぞれの効果が乗る。⏎1匹に役は1つ。農園の台に「魔物の力」を出す役の子は、畑しごとの担当にできない(台を右クリックで開く「農園の管理盤」で外せる)。"},{"id":"h015","unlockStage":3,"majorCategory":"はじめに","minorCategory":"農作業の小屋","title":"次の解放","body":"防衛戦のことは、はじまりの神殿の北の「防衛戦の砦」にはじめて入ったときにルルが教えてくれ、くわしくは砦の兵士長が話す(大きな袋は導きの書で職業を選んだときに皮の防具と一緒にもらえる・防衛戦の旗のことは「防衛戦の砦」の項)。⏎ここで導きの書のページが全部読めるようになる。"},{"id":"hl01","unlockStage":1,"majorCategory":"はじめに","minorCategory":"ルルの手ほどき","title":"手ほどきのはじまり","body":"マイホームの島ができて鍛冶場の設備(炉・金床)が手に入ると、案内役のルルが「鍛冶の やりかたを 教えようか？」と声をかける。農作業の小屋の設備が手に入ると(はじめて鍛冶で作ったとき)、畑しごとの手ほどきも始まる。⏎選べるのは「いま聞く」「あとで」「とばす（すぐ使う）」。⏎鍛冶と農業は「段」に分かれていて、ルルの話を聞くか「とばす」を選ぶまで、その段の物は使えない(金床・種の棚・手伝いも)。「あとで」を選ぶと使えないまま(DQMメニューの「できごと帳」→「ルルの手ほどき」→「つづきを聞く」か「この段をとばす」で いつでも使えるようになる)。⏎農業の手ほどきは、鍛冶の声かけと鍛冶の段①(打ち方と★)の章が済むまで待つ。先に農業をしたいときは、できごと帳の「ルルの手ほどき（農業）」→「つづきを聞く」→「農業を先に聞く」(鍛冶は あとで に止まる)。"},{"id":"hl02","unlockStage":1,"majorCategory":"はじめに","minorCategory":"ルルの手ほどき","title":"進め方","body":"ルルの話のあと、HUDのクエストの欄に「◆ルルの手ほどき：いまやること」が出る。そのとおりにやると、ルルがほめてごほうび(ゴールドと材料)をくれて、次の段に進む。話だけの段は、読み終えると次へ進む。⏎足りない物(種・樽・石うすの材料・木の剣の材料・打ち直しの費用など)は、段のはじめにルルがくれる。"},{"id":"hl03","unlockStage":1,"majorCategory":"はじめに","minorCategory":"ルルの手ほどき","title":"できごと帳から","body":"DQMメニューの「できごと帳」の「ルルの手ほどき」から、いまの段の話をもう一度聞く・この段をとばす(ごほうびなし・その段の物はすぐ使える)・あとで(止める)・つづきを聞く、ができる。止めているとき(「あとで」を選んだとき)も「この段をとばす」を選べる。⏎聞いた章(とばした章も)は、「前の話を読みなおす」で何度でも読みなおせる(品物とごほうびは もうもらえない)。⏎次の段がまだ開いていないときは、読みなおしだけできる。"},{"id":"hl04","unlockStage":1,"majorCategory":"はじめに","minorCategory":"ルルの手ほどき","title":"鍛冶の手ほどき","body":"6章15段・段は5つ(鍛冶Lvは自分の金床で いちばん高かった値)。⏎① はじめから: 鍛冶場をひらこう(炉と金床と手伝い・設計図)／はじめて打ってみよう(ゲージと基準値・温度と集中力・木の剣を打つ・★のきまり)。特技は「たたく」「強打」だけ。⏎② 鍛冶Lv40: ハンマーと素材集め(鍛冶ハンマー・ほかの特技・採集の場所・設計図の手に入れ方)。この段から錬金釜のカマエルを置いて、合成と地形ブロック・花の錬金に使える。⏎③ 鍛冶Lv80: 担当と相方の技(火入れ・鍛打・仕上げの担当・相方の技・担当のない子の鉱石掘り)。⏎④ 鍛冶Lv150: 打ち直しとおまかせ打ち。⏎⑤ 鍛冶Lv250: 鍛冶依頼とカマエルの武器・素材の錬金。⏎段が開くとルルが声をかける。終えると称号「みならい鍛冶屋」(飾り)と鍛冶の秘伝書。"},{"id":"hl05","unlockStage":1,"majorCategory":"はじめに","minorCategory":"ルルの手ほどき","title":"農業の手ほどき","body":"5章16段・段は5つ(農園Lvで開く)。⏎① はじめから: 畑をつくろう(種の棚と水おけ・手伝い・倉庫に種・はじめての収穫)。⏎② 農園Lv3: 担当と作物の使い道(畑の担当・好物を投げる・ごはん・えさ台の樽)。⏎③ 農園Lv5: 農園の台(石うす・力を出す役・粉・まかない・料理のバフと出荷箱)。⏎④ 農園Lv8: 農場の施設。⏎⑤ 農園Lv12: 品種改良(交ざりの芽・品種図鑑)。⏎「粉を作ろう」の段の間だけ、自分の石うすはルルが力を貸してくれる(仲間に物質系の子がいなくても動く)。⏎終えると称号「みならい農夫」(飾り)と農業の秘伝書。"},{"id":"h016","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"袋の使い方","body":"手に持って右クリックで開く。540枠の大容量で、中は分類ごとのタブ(装備・魔物・素材など・農作物・釣り・ブロック・バニラ・NEW)に分かれている。⏎持ち物のDQMタブにある『袋スロット』(4枠)に入れておくと、死んでも残り、キーで開ける(袋スロット1はN)。⏎袋の画面の『箱へ移す』で、袋の品をまわり8マスのチェスト・樽・DQMの宝箱や、持っているほかの大きな袋へ移せる。品をクリックで選び(Shift＋クリックでいくつでも)、行き先を選んで『えらんだ品を移す』。『表示中の品ぜんぶ』は、いまの種類と検索に合う品をまとめて移す。入りきらない分は袋に残る。ほかの人の島の箱・討伐の宝箱・守られた場所の箱には移せない。"},{"id":"h017","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"自動回収","body":"自動回収ONの袋を持っていると、拾った物が自動で袋に入っていく。⏎レ点で回収する種類を選べる。種類は、その品がクリエイティブのどのタブに出ているかで決まる(素材・武器・防具・地形・建築など)。種のタブの品は、植える物(苗・種)が『種』、収穫した作物・草花・農園の品が『農作物』。⏎並べ替えの『ID順』は、クリエイティブのタブの並び(タブの順 → タブの中の順)と同じ。"},{"id":"h018","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"見た目と整理","body":"見た目は16種類から選べる。並べ替え(ID・名前・個数・カテゴリ・新しい順)で中身を一発整理できる。⏎袋の画面の見た目も、画面の『見た目』で「王家の紋章」(左に分類・升目・右に説明)と「本家のふくろ」(種類のコマンドと一覧・説明の窓)を切りかえられる(はじめは王家の紋章・メニューが「新」のとき)。"},{"id":"h019","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"袋の注意","body":"袋はオフハンドに装備できない(紛失防止)。中身は袋ごとに世界へ保存される。"},{"id":"h183","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"自動回収を止める","body":"『大きな袋の自動回収 止める/再開』のキー(はじめは割り当てなし・キー設定で決める)で、持っている袋ぜんぶの自動回収をまとめて止める・再開する。⏎ブロックを置き間違えて壊すときなど、袋に吸われたくないときに。袋ごとのON/OFF設定はそのまま残る。"},{"id":"h130","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"コロシアムとは","body":"はじまりの神殿の『闘技場』の旅の扉から闘技場の島へ行き、舞台の南の司会に話しかけて、挑むランク戦を選ぶ。⏎ペットだけで戦う勝ち抜き戦で、勝つと賞金がもらえ、マスターランクが上がる。司会が実況して、客席の観客が応援する。"},{"id":"h131","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"出場するペット","body":"挑戦する人のまわり16マス以内にいる、追従中か攻撃中の自分のペットのうち、そのランク戦のランク以下の魔物が出場する(Dランク戦ならランクD以下・10匹まで)。DQM設定「闘技場に出せるペット」を「どのランクでも」にすると、ランクに関係なく出られる。勇者は出られない。⏎出られない仲間は、相手を攻撃しない。⏎気絶しているペットと、部屋で手伝いをしているペットは出場しない。⏎試合が始まると、出場しない勇者とペットは挑戦者がわの客席のすみ(舞台の外)へ移って待ち、試合のあいだは ついてこない・戦わない。試合が終わる(勝ち・負け・時間切れ)と、また ついてくる。"},{"id":"h132","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"試合のルール","body":"相手はそのランクの魔物10体で、3連戦(3戦目は強い子)。相手のレベルはランク戦ごとに決まっていて(Iランク戦は Lv8・9・10、Hランク戦は Lv13・14・15 〜 SSSランク戦は Lv230・243・256)、強さは同じレベルまで育ったペット(装備なし)の0.85倍。仲間に装備をつけるとずっと楽になる。⏎仲間は挑戦した人のがわに横一列に並び、3秒後に相手10体が反対がわに並んで試合開始。連戦の間に手当ては無い。試合は出場したペットだけで戦う。プレイヤーは手出しできない(挑戦者も客席の人も、攻撃・呪文・特技・道具・回復・補助・乗ることはできない。星降りの大会と対人戦も同じ)。入場するときに仲間に掛かっていた強化(バイキルト・スカラなど)は外れる。⏎相手を全部倒せば勝ち。戦えるペットがいなくなると負け。5分たっても決着しなければ引き分けで終わる。⏎試合の始まり・勝ち負けは画面に大きく出て、試合中は画面の上に味方と相手の残りの数が出る。"},{"id":"h133","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"ランク戦とマスターランク","body":"『Iランク戦』から『SSSランク戦』まで12段階(魔物の配合ランクと同じ I・H・G・F・E・D・C・B・A・S・SS・SSS)。⏎勝ち抜くとマスターランクが1つ上がり、次のランク戦が解放される(Iランク戦に勝つとH)。勝ち抜いたランク戦にはもう挑めない。⏎マスターランクまでの魔物にだけスカウトアタックできる。⏎参加費と賞金は3戦ぶん(Iランク戦は参加費190G・賞金950G 〜 SSSランク戦は参加費122,000G・賞金372,000G)。参加費は負けても戻らない。⏎SSSランク戦まで全部勝ち抜くと、大地の竜玉と闘技場を制し者の首飾りがもらえる。⏎今のマスターランクは画面の左上に出る(GUI位置調整で動かせる・大きさを変えられる・消せる)。"},{"id":"h134","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"倒れても大丈夫","body":"勝っても負けても、その試合に出場したペットは全員その場で復活する(引き分けのときは復活しない)。⏎出場していないペットは復活しないので、気絶したままなら神父かザオ系で起こそう。⏎コロシアム中に気絶したペットはペット収納ベルへ自動収納されず、会場に倒れたまま残る。"},{"id":"h135","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"もらえないもの","body":"相手を倒しても経験値・ゴールド・ドロップ・仲間化は無い。⏎報酬は勝ったときの賞金だけ。"},{"id":"h192","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"はじまりの神殿","body":"はじめてワールドに入ると、空に浮かぶ「はじまりの神殿」に立つ。ここが冒険の起点で、魔物は出ず、いつも晴れた昼。⏎神殿の壁ぞいに旅の扉が14ある(オーバーワールド・ランク1〜12の世界・闘技場)。ランク1とオーバーワールドと闘技場の扉はいつでも開いている。ほかの扉は、はじめは閉じている(乗ると「旅の扉は閉ざされている…。」と出る)。冒険を進めると開いていく。⏎ベッドで復活の場所を決めていなければ、死んだときは神殿で生き返る。⏎神殿の壁の外には北の防衛戦の砦・東の博物館・西の建材屋・北東のモンスターじいさんの牧場・北西のメダル王の城への旅の扉があり(島への扉はオープニングが終わると開く)。主の証の交換所の人は、メダル王の城の1階の大広間にいる。⏎島の着く所の東と西には、となりの島への旅の扉もある(博物館・牧場・防衛戦の砦・メダル王の城・建材屋の順に一列につながる)。⏎◆回復の石板(淡い緑の石板): 神殿の南の入口を出たすぐわき・闘技場の北の入口のわき・防衛戦の砦の門の外にある。右クリックすると、すぐHPとMPが満タンになる(32マス以内の自分のペットと勇者も、気絶から起きて満タン)。待ち時間はなく、復活の場所は変わらない。闘技場の試合中と防衛戦の最中は使えない。⏎◆神殿と島には人がいる。噴水のそばの案内の神官は旅の扉の行き先を、防衛戦の砦の祭壇のそばの兵士長は防衛戦のやり方を教えてくれる。はじめて神殿や島に入ると、ルルがそこでできることを話す(できごと帳の「ルルの話（読みなおし）」で読みなおせる)。⏎◆神殿の島から空へ落ちても、死なずに神殿の着く所へ戻される(持ち物はそのまま・落ちた自分のペットと勇者も飼い主のそばへ戻る)。⏎噴水の西の「パーティ募集の受付」に話しかけると、ひとこと(30字まで)の募集の札を出したり、ほかの人の札を見て「参加する」でその人のパーティに入れる(札は1人1枚・30分かログアウトで消える・ひとりで遊んでいるときは自分の札だけ)。札を出すと、ほかの人みんなのチャットと画面に募集の知らせが出て、チャットの［参加する］からも入れる(知らせは1人1分に1回まで・画面の知らせは GUI位置調整の「パーティ募集の知らせ」で場所・大きさ・表示を変えられる)。"},{"id":"h193","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"旅の扉の使い方","body":"旅の扉に乗ると、行き先の世界へ移る(乗っている間は画面がゆらゆらする)。⏎扉や、扉のうしろの石板・銀を右クリックすると、行き先が画面に出る。扉の色は行き先のランクで決まっている。⏎ペットは飼い主について一緒に来る。⏎オーバーワールドのスポーンのそば・各ランクの世界の着く所などに、神殿へ戻る扉がある。"},{"id":"h194","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"ランクの世界","body":"ランク1〜12の世界がある(ランク1はアレフガルド)。⏎ほかの世界の名前は、その前のランクの魔王を倒すと分かる(はじまりの神殿のその旅の扉が開くのと同じとき)。⏎いくつかの世界には、旅の扉や穴から行ける別の世界もある。⏎ランクが高い世界ほど、強い魔物・良い鉱石・良い宝が出る。⏎オーバーワールドは普通のマイクラで、DQMの魔物・鉱石・施設は出ない。"},{"id":"h195","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"旅の扉のほこらと石板","body":"ランクの世界に旅の扉で着くと、その世界の「旅の扉のほこら」の中に出る。⏎ほこらには帰りの旅の扉(ある世界だけ)と、神父・配合の神官・道具屋・武器屋・防具屋、DQMベッド(右クリックで復活の場所にして全回復)、依頼掲示板(毎日の依頼・その世界のランクで出る)がある。武器屋・防具屋はその世界のランクの品を売るので、町にお店の無い世界でも装備をそろえられる。まわりには魔物が湧かない。⏎バイオームごとにある「バイオームの石板・白」に触れるとバイオームリストに、施設の石板(銅)・ダンジョンの石板(黒)に触れると建物リストに記す。リストはDQMメニューの一覧表で見られる。石板に触れた場所は、ルーラ・キメラの「自動登録」にも入る。"},{"id":"h_castletown","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"城と城下町","body":"ランク1〜12の世界には、その作品の主要な城と城下町が1つずつある(ラダトーム・ローレシア・アリアハン・エンドール・ポートセルミ・レイドック・グランエスタード・サザンビーク・サンマロウ・メギストリス・サマディー・タイジュ)。近くへ行くと建つ。⏎王様・兵士・大臣などの人がいて、話しかけるとひとこと。武器屋・防具屋・道具屋・教会(神父)はいつものお店。⏎宿屋の主人に話しかけると、ただで泊まれる(もう一度話しかけると泊まる・しゃがんで話しかけるとやめる)。HP・MPと近くの仲間が全回復し、1人で遊んでいるときは朝になる(マルチでは回復だけ)。⏎酒場のマスターに話しかけると、うわさ話を聞ける(うわさの掲示板と同じ・1日1枚)。⏎町の中の建物ブロック(石板・金)に触れると建物リストに記す。入口に近づくと、ルーラ・キメラの自動登録に入る。⏎城下町には小さなメダルが5枚ずつ隠されている。⏎城と城下町・町・村・お店の施設の中には、野生の魔物が湧かない。外から入ってこようとする魔物は押し戻され、中にいた魔物は消える(物語の敵は出る・町の中にダンジョンがあれば、そこは今までどおり湧く)。⏎これから建つ町・城下町・村は、床の下16マスまでの洞窟を土と石で埋めて建つ。町の中の物語の敵が地面の下の洞窟に出ることも無い。"},{"id":"h_hints","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"建物の見つけ方","body":"建物や魔王の城が見つからないときは、噂を集めよう。まだ建物リストに記していない施設の石板・銅とダンジョンの石板・黒は、光の粒を出している(記すと消える)。噂は名前を教えず、建物の種類(城・塔・洞窟など)と、方角・道のり・あたりのバイオームだけを教える。⏎【石板の噂】バイオームの石板・建物の石板に触れると、その世界でまだ建物リストに無い、いちばん近い建物の噂が巻物で出る(同じ石板からは1回だけ)。⏎【うわさの掲示板】旅の扉のほこらにある掲示板は、1日に1枚、新しい貼り紙をくれる。「確かな話」のほかに、方角や道のりが少しずれていることのある「あやしい話」も混ざる。その世界の魔王を倒したあとは、貼り紙を取ると、まだ見つけていない建物のうわさを まとめて(確かな話で)もらえる。⏎【ほこらの測量図】旅の扉のほこらにある台を右クリックすると、その世界の方眼の地図が開く。歩いた所は色つき(ルーラの地図と同じ記録)、見つけた建物は金の印、噂で聞いた建物は一覧に方角と道のりが出る。噂の建物のあたりは地図に赤(確かな話)と橙(あやしい話)の点線の丸で出る(ルーラ・キメラの地図とミニマップにも)。丸のまん中に建物があるとは限らず、丸の中のどこかにある。DQM設定「表示」の「噂の丸」で消せる。⏎【ペットが気づく】噂で聞いたまだの建物から500マスほどに近づくと、連れているペットがときどきその方を向いて「あっちに何かあるみたい！」と教えてくれる。⏎【空の目印】噂で聞いたまだの建物から500マスほどに近づくと、建物の上に目印が出る。町・村は白い煙、城は黒紫の煙、塔は上空を回る鳥(夜はコウモリ)、神殿・祠は青白い光、迷宮・洞窟は緑の光(光は夜によく見える)。DQM設定「表示」の「空の目印」で消せる。⏎【魔王の気配】そのランクのダンジョンの石板・黒をすべて記して魔王の祭壇が目覚めると、祭壇のある世界にいる間、画面の上の方角の帯に赤黒い「魔」の印が出る(近いほど速く脈打つ・倒すと消える)。⏎【周辺情報】聞いた噂は、DQMメニュー「基本」の「周辺情報」でいつでも見返せる(今いる所からの方角と道のり・あたりのバイオーム・確かな話かあやしい話か。行を押すと噂の文をもう一度読める。見つけた建物には「見つけた」と名前が付く)。⏎噂で聞いた印は人ごと。見つけたかどうか(建物リスト)はワールドのみんなで同じ。⏎まだだれも記していないバイオームの石板・白も、近いもの3つまでを、地図とミニマップにぼかした丸で出す(噂の丸と同じ設定で出し入れ・丸のどこかに石板がある)。"},{"id":"h_guidepost","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"道しるべ","body":"何をすればいいか迷ったら、画面のクエストの欄のいちばん上を見よう。★の付いた金の字の1行が「道しるべ」で、いまやるとよいことを1つだけ教えてくれる(オープニング・仲間・闘技場のランク戦・町の物語・魔王への道・うわさ・マイホームの島・ルルの手ほどき・星降りの大会など)。⏎案内が変わると、その行が3秒光る。できごと帳で「画面に出す」の印を付けた話があれば、その話を道しるべにする。⏎いまの案内を出したくないときは、できごと帳の左上の「この案内をとばす」。その案内は、次の段へ進むまで出なくなる。⏎DQM設定の「画面・HUD」の「道しるべ」で、出す／序盤だけ(ランク1の魔王を倒すまで)／出さない を選べる。⏎星降りの大会で優勝したあとは、図鑑・実績・小さなメダル・まだの物語のヒントを1分ごとに入れかえて出す。"},{"id":"h_town_events","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"町のイベントと町の人のおねがい","body":"ランクの世界の町には、困っている人がいる。頭上に「！」が出ている人に話しかけると、話が始まる。⏎◆町の物語: 主な町には、決まった物語がある(ラダトームの教会・港のある町・ジパングの竹林・ウォール街・エスタードの漁村・トラペッタの旅の扉のほこら・鐘の鳴る城・ナギムナーの浜の村・タイジュの草原など。ランク10には勇者が仲間になる物語が2つ)。⏎◆城と城下町の物語: ランク1〜12の城と城下町には、それぞれ1本ずつ物語がある(ラダトーム「ローラ姫と ひかりのロケット」〈沼地の洞窟からローラ姫を助け出したあと〉・ローレシア「牢の旅人と井戸の底」・アリアハン「旅立ちの酒場」・エンドール「武術大会の仮面の闘士」・ポートセルミ「灯台の大ねこ」・レイドック「練兵場の兵士の試験」・グランエスタード「王子と秘密の地下室」・サザンビーク「バザーと鏡の儀式」・サンマロウ「お屋敷の人形の娘」・メギストリス「占いの館と大噴水」・サマディー「替え玉の騎手」・タイジュ「根のアーチの迷子のタマゴ」)。その城と町に入れば、いつでも始められる。物語の人は、城と町が建ってから現れる。話を聞き、目的の場所へ行き、魔物を倒し、人を助ける。とちゅうの選択で結末が変わる話もある。済むと、町に人が増えたり、毎朝 鐘が鳴ったりと、町が変わる(町の変化はワールドのみんなで同じ)。ごほうびは物語の大きさで3段(どの物語も同じ決まり・結末が2つある話もどちらも同じ): 小さな話=その世界の魔物30体ぶんのゴールドと経験値・素材2・鉱石・スキルポイント+2／ふつうの話=魔物60体ぶんのゴールドと経験値・設計図1・福引券1・素材2・鉱石・スキルポイント+4／大きな話(戦いの多い話・コインボスの物語・勇者の全員参加の話)=魔物120体ぶんのゴールドと魔物100体ぶんの経験値・設計図2・福引券2・主の証2・ペットのごはん(超)1・スキルポイント+8と、その話らしい目玉の品1つ(名品の装備・タマゴ・だいじなもの・主の証5 など)。スキルポイントは防衛戦のメダルのSPとは別の枠で上限なし。それと称号(飾り・名乗れる)。⏎◆町の人のおねがい: ふつうの町の人も、5人に1人くらいが「おねがい」を持っている。親分たいじ・群れの退治・取り戻す・探しもの・手紙と頼みごと・仲間を見せる、の6つ。1人1回、同時に5つまで。ごほうびはその世界の魔物15体ぶんのゴールドと経験値・素材2・鉱石と、型ごとの品(くわしくは「クエスト」の「報告と報酬」)。⏎◆物語の人(物語の台本で出る人)は、名札の名前が金色で、名前の左に本の印「▤」が付く(「！ ▤ 鍵屋の主人」のように並ぶ)。ふつうの町の人の名前は白。⏎◆目的の相手には頭上に「？」が出る。会話は画面の下の窓に出て、クリックかEnterで進む(選択肢は↑↓で選ぶ・ESCで答えずに閉じると、もう一度話しかけたとき同じ所から)。近くにいる仲間のプレイヤーは、魔物を倒すところを一緒に進められる。"},{"id":"h_furniture_search","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"タンスや壺を調べる","body":"町・城・村・旅の扉のほこら・はじまりの神殿に最初から置かれているタンス・本棚・棚・壺・樽・木箱・袋・かごは、右クリックで調べられる(Shiftは押さない)。1人1回ずつで、壊れない。⏎中身はさまざま: 鍛冶の設計図(その世界のランクの品・まだ記していない品が出やすい)・やくそうなどの道具・少しのゴールド・まれに素材。からっぽのこともある。⏎まだ調べていない家具からは、ときどき小さな光の粒が出る(当たりかどうかは分からない)。光の粒はDQM設定「軽量化」の「飾りの光と模型」に従う。⏎調べ終わった家具は、今までどおり座ったりできる。自分で置いた家具・建築の机で建てた建物・ダンジョンや魔王の城・中ボスの拠点の中の家具は調べられない。⏎1つの世界のタンスと壺から出る設計図が20枚を超えると、そのあとは出にくくなる。"},{"id":"h_event_log1","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"できごと帳と目的の案内","body":"DQMメニューの「できごと帳」に、町の物語とおねがいの記録が残る。まだうわさを聞いていない話は「？？？」、受けられる話は「！」、進行中・済が分かる。あらすじ・たどった道・結末・称号も見られる。⏎◆目的の案内: 今の目的は HUD のクエストの欄に出る。方角の帯には目的の向きに金の「！」と「目的まで 約○マス」、ルーラの地図とほこらの測量図には金の「！」の印が出る。いくつも受けているときは、できごと帳で「この話を案内する」を押すと、その話を案内する。⏎◆やり直す: 不具合などで進めなくなったときは、できごと帳で進行中の話(おねがいも)を選んで「やり直す」を押すと、その話をはじめる前に戻せる(章のある話は今の章のはじめから・その話のだいじなものは古い品になって使えなくなる・済んだ話はやり直せない・やり直しはどの話でも合わせて1日1回まで(寝ても進まないゲームの日で数える))。⏎◆画面に出す: クエストの欄に出る話が多いときは、できごと帳で進行中の話(おねがい・ルルの手ほどきも)を選んで「画面に出す」を押すと「◎」の印が付く。印が1つでもあれば、クエストの欄には印の付いた話だけが出る(済んだ話の印は消える)。右上の「メインの目標」で、いちばん上の目標を出すかも選べる。クエストの欄に出す件数は GUI位置調整で「クエスト一覧」を選んで 1〜10件から選ぶ(はじめは5件)。"},{"id":"h196","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"世界と旅の扉","title":"世界の作り直し","body":"今は使えない(旅の扉の Shift＋右クリックは、ふつうの右クリックと同じく行き先を知らせるだけ)。⏎前に予約した世界も、今は作り直さずにそのまま残る。"},{"id":"h020","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"HP(体力)","body":"0になると倒れてしまう。回復はやくそう・ホイミ系・DQMベッド・レベルアップなどで。装備やアクセサリで最大HPも伸びる。"},{"id":"h021","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"MP(魔力の源)","body":"呪文や特技を使うのに必要。DQMベッド・まほうのせいすいなどのMP回復の品で回復し、少しずつ自然にも戻る。装備・アクセサリで最大MPが増える。"},{"id":"h022","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"攻撃力","body":"通常攻撃・特技の威力に直結する。武器と職業レベルで伸ばせる。"},{"id":"h023","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"守備力","body":"受ける物理ダメージは「(相手の攻撃力−自分の守備力÷2)÷2」(±10%)。守備が高くても、相手の攻撃力の5%は必ず通る。守備を固めるとダメージが目に見えて減る。⏎落下・炎・窒息などは守備では減らない。"},{"id":"h024","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"魔力","body":"攻撃の呪文の攻撃力になる(ダメージ＝(魔力＋威力−魔法守備÷2)÷2。アクセサリーや賢者などで威力が上がる)。回復の呪文は相手の最大HPの割合で回復し、魔力が高いほど割合が上がる(魔力500で最大)。魔法使い系の生命線。"},{"id":"h025","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"魔法守備","body":"受ける魔法ダメージを減らす。魔法を使う敵にはこちらを固めよう。"},{"id":"h_statcap","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"能力と%の上限","body":"能力には上限がある。プレイヤー・勇者(人間の仲間)・ペットで同じ。⏎最大HPは19,999、最大MP・攻撃・魔力・守備・魔法守備は9,999まで(装備やバフをすべて足したあとの値)。⏎旅を終える(エンディングを見る)と、能力の上限が+10,000になる(最大HP 29,999・ほかの能力 19,999)。仲間の勇者とペットも、飼い主が旅を終えていれば同じ上限になる。%の上限は変わらない。⏎会心率は50%まで、会心のダメージの上乗せは+100%まで(スキルパネルのマスを全部取っても+100%で止まる)。⏎与えるダメージの上乗せ(装備の特効・セット効果・武器の熟練度・しるし・サブ職業の特性・指揮・ペットの特性など)は、合わせて+100%まで。会心・溜め・ためる・剣のコンボ・2回攻撃・修羅の4回攻撃・ヘッドショットは、1回の当たりに2つまで重なる。⏎回復量の上乗せと、属性の威力の上乗せは、それぞれ+60%まで。⏎みかわしは50%まで(必殺技アクロバットスターの間だけ75%まで)。⏎盾・セット効果・極意などで受けるダメージを減らせるのは、合わせて75%まで(パラディンガードなど必殺技の守り・ペットの特技の守りは別)。⏎移動速度の上乗せは+100%まで(プレイヤー)。⏎速くなると視野が広がって見づらいときは、マイクラの「設定 → 見やすさ → 視野の効果」を下げるか、DQM設定「画面・HUD」の「速さで視野を広げない」をONにする(DQMの装備・スキルで速くなった分だけ視野を広げない)。⏎魔王(祭壇の魔王と封印の番人)のふつうの殴りは、受けた人の最大HPの3割まで。"},{"id":"h026","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"レベルと経験値","body":"モンスターを倒すとDQM経験値が入り、レベルが上がる。レベルアップでステータスが伸び、設定によってはHP・MPが全回復する。⏎◆職業の素の能力(メインとサブの職業のLvの能力)には、Lvが上がるほど大きな倍率が掛かる(Lv100ごろから上がりはじめ、Lv300で攻撃×3.9・魔力×4.9・最大HP/守備/魔守×2.8・最大MPは掛からない)。装備・スキルパネル・バフの分には掛からない。"},{"id":"h027","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"ゴールド","body":"冒険の血液。討伐・出荷・鍛冶・売却などで稼ぎ、装備や素材に使う。"},{"id":"h_bestequip","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"最強装備(インベントリ)","body":"インベントリの上の『最強装備』を押すと、持ち物・持っている大きな袋・近くのDQM大きい宝箱の中から、今より強い品に着替える(ペットの最強装備と同じ在庫・ホットバーはDQM設定に従う)。⏎『標準』タブでは防具(頭・体・脚・足)と盾、『DQM』タブではアクセサリーを替える。武器は替えない。⏎強さは装備の説明と同じ足し算の値(品質・強化込み)で比べ、今より強いときだけ替える。外した品は持ち物(いっぱいなら袋・足もと)へ戻る。⏎呪いの装備は着ない・着ている呪いの装備は外さない。DQMでない防具(エリトラなど)と、盾の枠の盾でない品はそのまま。⏎アクセサリーは同じ品を2つ着けず、特殊効果だけの品は自動では着けない。特殊効果つきで着けている品も外さない。⏎『標準』タブの『最強装備』の右の『セット』を押すと、防具のセット効果のあるセットの一覧が出る(持っている部品の数・効き目・着ている物は「装備中」)。行を押すと、そのセットの防具と盾を同じ在庫からまとめて着る(同じ部品が何個もあれば強い方)。最強装備は守備の高さだけで選ぶので、セット効果を使いたいときはこちら。"},{"id":"h028","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"ダメージの仕組み","body":"物理は「(攻撃力−守備力÷2)÷2」に±10%の振れ(守備が高くても攻撃力の5%は必ず通る)。攻撃力は「自分の攻撃力＋武器・防具・アクセの攻撃」に、職業と武器種の適正(SSS+30%〜E−40%)や補助呪文・種などのバフを%で足して掛けたもの(バフの合計は+200%まで)。⏎会心の一撃(はじめは1%)は、守備を引いたあとのダメージ×1.5(会心のダメージの上乗せは+100%まで)。武器の「会心率+◯%」も会心率に足す(会心率は50%まで)。盾を構えている間は受けるダメージが半分。⏎物理の特技の「◯倍」は、守備を引いたあとのダメージに掛ける。「守備力の半分を無視して」と書いた特技は、守備を半分にして引く(必殺技とペットの「守備を無視」はすべて無視する)。強い特技には4〜6秒の待ち時間がある。⏎攻撃の呪文は「(魔力＋威力−魔法守備÷2)÷2」で、殴りと同じ形(魔法守備が高くても5%は必ず通る)。回復の呪文は相手の最大HPの割合で回復する(ホイミ10〜30% など・魔力500で最大)。⏎魔物は一撃を受けたあと0.5秒ほど、それより弱い一撃が消える(無敵時間)。プレイヤーの攻撃(殴り・溜め・呪文・飛び道具)は、ペットや勇者の当たりで始まった無敵時間には止められず満額入り、プレイヤーの当たりもペットや勇者の邪魔をしない。プレイヤー自身の殴りは同じ相手に0.5秒に1回まで(多段の特技・必殺技・銃・戦輪などはこれまでどおり全部当たる)。"},{"id":"h_resist","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"属性と状態異常の効きやすさ","body":"魔物には種族ごとに、呪文・特技・息の属性(メラ・ギラ/ヒャド/イオ/バギ/デイン/ドルマ/属性なし)の効き方と、状態異常(眠り・混乱・幻惑・封印・ルカニ・ヘナトス・ボミエ・マホトラ・毒・麻痺・休み・即死・魅了)のかかりやすさがある。⏎属性は7つの段: 弱点(ダメージ×1.5)・ふつう・軽減(×0.75)・半減(×0.5)・激減(×0.25)・無効(0)・吸収(HPが回復する)。メタル系には呪文が効かない。⏎状態異常は6つの段: 弱点(必ずかかり、時間が1.25倍)・ふつう(必ず)・軽減(75%)・半減(50%)・激減(25%)・無効(かからない)。ザキ系の即死も、5回に1回にこの割合が掛かる。⏎魔王・中ボス・コインボス・転生など、ボスとして出てきた魔物は、眠り・混乱・麻痺・休み・毒・即死にとても強く、即死と魅了はまず効かない。ボスにはルカニ・ヘナトスなどの弱体や、弱点の属性を狙おう。装備の即死(アサシンダガーなど)とどくばりの急所も、ボスとして出た魔物・主(物語の親玉も)・天候のめずらしい魔物には効かず、ほかの魔物にも種族の即死の効きやすさが掛かる。⏎同じ系統の魔物は似た効き方をする(スライム系はイオ・デインに強い、ゾンビ系はメラに弱い、悪魔系はデインに弱い、など)。⏎魔物から受ける状態異常は、その魔物の魔力で5〜30秒(魔力が高いほど長い)。"},{"id":"h029","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"ためる","body":"特技「ためる」で力を溜めると、次の一撃が大きく伸びる(1回で+0.25倍・10秒ごとに重ねて最大3倍・30秒で消える)。強敵への初撃に。"},{"id":"h030","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"補助呪文のすすめ","body":"マホトーンで呪文封じ、ヘナトスで攻撃力ダウン。強敵ほど補助が効く。⏎魔物によって状態異常のかかりやすさが違う(ボスは眠りや混乱がほとんど効かないが、ルカニ・ヘナトスはふつうに効くことが多い)。"},{"id":"h031","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"仲間と戦う","body":"ペットの指示・フォーメーション・補助呪文を組み合わせるのが勝ち筋。1人で抱え込まない。"},{"id":"h032","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"逃げるが勝ち","body":"勝てない相手からは離れよう。負けても鍛え直してまた挑めばいい。"},{"id":"h201","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"パリィとステップ","body":"パリィ: 盾を構えた直後(約0.25秒)に正面から受けた攻撃を、まるごと消す(呪文も)。⏎ステップ: 移動キーをすばやく2回押すと、その向きへ約3マス動く(地上にいるとき)。DQM設定で専用キーの方式にもできる。⏎どちらもDQM設定「操作・画面」でON/OFFできる(はじめはON)。"},{"id":"h033","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"死んでしまったら","body":"ベッドなどで決めた場所で生き返る(決めていなければ、はじまりの神殿)。⏎連れていたペット(どの世界にいても・待機中も)は、自動収納ONのペット収納ベルへ戻る(空きが無い分はその場に残る)。⏎ペット収納ベルは、持ち物のどこにあっても死んで落とすことはない。必殺技・守護天使・神の涙の待ち時間と、地形ブロックと花の錬金の1日の回数は、死んでも元に戻らない。"},{"id":"h034","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"死んだときに残す物","body":"DQM設定「死亡時ドロップ」で、死んだときに残す物を選べる(全部落とす〜全部残す・はじめは「装備・1列残す」)。⏎残した物は復活時に返却される。万一返却されずに終了しても、次のログインで自動返却される。"},{"id":"h035","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"アクセサリーと袋","body":"DQMアクセサリー欄の装備は、装備を残す設定なら死んでも引き継ぐ(装備を落とす設定なら、その場に落ちる)。⏎袋スロットの大きな袋はいつも残る。"},{"id":"h036","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"宝箱の色","body":"宝箱は赤→黒→青→緑→紫→金の順に豪華になる。中身はその世界のランクで決まり、素材と鉱石はその世界の落とし物・鉱石と同じものが出る(紫・金はレアの素材が出やすい)。お金の袋もランクに合わせた額になる。⏎ダンジョンの紫・金の宝箱には、お店の装備(★1か★2)が入ることがある。ランク4からは1段上のランクの品(ランク1〜3はその世界のランクの品)。施設アイテムは宝箱からは出ない。鍵は宝箱からは出ない(鍵の扉と鍵は「鍵と鍵の扉」の項)。⏎ダンジョン限定武器は、その世界のランクの強さの1本(金80%・紫50%・緑10%)。⏎本家の防具の「宝箱の品」は、金70%・紫40%で、その世界のランク以下の1つ(まだ持っていない品が先)。⏎古いダンジョンの金の宝箱は、入口から遠い3つだけ。"},{"id":"h_keys","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"鍵と鍵の扉","body":"鍵の扉は、盗賊の鍵の扉・魔法の鍵の扉・最後の鍵の扉の3つ。鍵を手に持って扉を右クリックすると開く。上の鍵は下の扉も開けられる。⏎鍵は宝箱からは出ない。盗賊の鍵はアレフガルド、魔法の鍵はランク4、最後の鍵はランク8の物語でもらう(だいじなもの・何度開けても減らない・死んでもなくならない)。なくしたときは、くれた人に話しかけるともう一度もらえる。⏎鍵がまだ手に入らないランクの世界の建物には、その鍵の扉は無い(ランク1〜3は盗賊の鍵の扉だけ・ランク4〜7は魔法の鍵の扉まで)。⏎前に宝箱で手に入れた鍵は「古びた〇〇の鍵」で、同じ段の扉を3回開けると1本なくなる。"},{"id":"h037","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"夜の過ごし方","body":"夜は魔物が元気になる時間。夜だけ、まれに同じ種類の大群が出る。自信がないうちは明かりのそばで過ごそう(明かりのある所には魔物が湧かない)。⏎DQMベッドを使うと時間が1つ進み(朝→昼→夕方→夜)、HP・MPが全回復して、リスポーン地点にもなる。寝ても、毎日の依頼・釣りのお題・鍛冶と農業の依頼・物語のあとの1日1回の効き目などの「1日」は進まない(遊んでいる時間で20分ごとに1日)。⏎ただし、ダンジョンの中・魔王の城・決戦の異空間・メタル迷宮と、近く(32マス)に魔王・転生・コインボス・ボスがいるときは使えない。⏎自分で置いたDQMベッドは、置いてから5分たたないと休めない(建物に建っているベッドはいつでも休める)。一緒に回復するのは32マス以内の自分のペットと勇者。"},{"id":"h_cutall","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"木こり(まとめて切る)","body":"DQMのオノを持ってしゃがんだまま原木を壊すと、つながった同じ原木をまとめて切る(1回で最大128個)。⏎落とし物はふつうに切ったときと同じ。葉は残る。⏎自然の葉に触れていない原木のかたまり(家など)は切らない。町の中・魔王の城などの守られた場所の原木も切らない。⏎まとめて切った原木などの落とし物は、ばらばらに落とさず、切った人の足もとに1か所にまとめて落とす(葉は切らない)。"},{"id":"h038","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"騎乗と騎乗ゲージ","body":"乗り物になれる仲間(地上・海・空)には、証が無くても いつでも乗れる。素手でしゃがみ右クリック(またはライドキー)で乗る。⏎乗って進んでいる間は「騎乗ゲージ」が1秒ごとに減る(地上 −1・水の中や水の上 −3・空を飛んでいる −5)。止まっている間は減らない。乗っている仲間のなつき度が高いほど減りが少なくなる(MAX で2割へる)。降りている間は1秒ごとに+2 戻る。⏎0 になると、その場で手がはなれて降りる。空ではゆっくり落ちて落下の痛みはなく、水の上ではそのまま泳ぐ。少なすぎるときは乗れないので、降りて休もう。⏎騎乗ゲージの最大は はじめ20(上限400)。町の物語・勇者の物語・コインボスのイベント・コインボスや中ボスや魔王・魔王の塔の層をはじめて倒すと ふえる(前に済ませた分も入る)。⏎「地上の証」(カジノの景品)・「海の証」(魚交換所で魚ポイント1200・釣りの大物のお題をはじめて達成したときにも1つ)・「空の証」(ランク10の世界へ行ったことがあれば、主の証の交換所で防衛戦のメダル30枚)は、右クリックで使うと最大が+10(種類ごとに1人1回)。前にペットへ与えた証は、そのペットに乗ったときに記される。⏎果てなき迷宮の中では乗れない(乗ったまま入ると降りる)。⏎ゲージは乗っている間と戻っている間だけ画面に出る(GUI位置調整の「騎乗ゲージ」で動かせる)。"},{"id":"h039","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"土地とモンスター","body":"ランクの世界では、バイオームごとに出会うモンスターが決まっている。ランクの高い世界ほど、強いモンスターと良い鉱石・宝が出る。遠出は最高の投資。⏎体の大きな魔物は、低いランクの世界には出ない(見た目の高さか幅が3.5マスより大きいとランク3から・5マスより大きいとランク5から・8マスより大きいとランク7から)。かわりに同じくらいの強さの小さな魔物が出る。"},{"id":"h040","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"メタル系はチャンス","body":"メタル系のモンスターは倒せばたっぷり経験値をくれる(その世界のふつうの魔物の30体ぶんくらい)。見つけたら総攻撃だ。⏎呪文が効かず、ふつうの攻撃もなかなか当たらない。会心の一撃なら一撃で倒せる。"},{"id":"h041","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"ペットのクリック判定","body":"ペットのクリック判定は ON→自動→OFF で切り替えられる(はじめは「自動」=ペットの向こうの使えるブロックを優先)。⏎DQMメニューの「ペット操作」→「ペットクリック判定」か、キー設定で決めたキーで切り替える。Shift+そのキーでペット判別の表示も切り替え(OFF→名前表示→発光表示→印A〜H→全非表示)。⏎印A〜H は光らない印で、32マス以内の自分の仲間に付く: A 足元に緑の輪・B 頭の上にハート・C 頭の上に仲間の紋章・D 頭の上に▼(仲間は緑・野生の魔物は赤)・E 名札に♥と緑の字・F 緑の影・G 足元に小さなHPバー・H まわりを回る光の粒。DQM設定「表示」の「ペット判別」とDQMメニュー「ペット判別」でも切り替えられる。"},{"id":"h042","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"特技はShift+左クリック","body":"選択中の特技はShift+左クリックで発動する(長押しは不要・離したときに出る)。⏎モンスターロードの指揮の特技は、Shiftなしの左クリック。"},{"id":"h043","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"回復ターゲットのHP表示","body":"回復・補助の呪文を選んでいるときや回復アイテムを持っているとき、ターゲットを合わせると相手の残りHPが数字で見える。"},{"id":"h044","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"魔法・特技ホットバー","body":"魔法・特技ホットバーは職業ごと、さらに杖を持っているときと持っていないときで別々に記憶される。転職しても並びが戻る。⏎枠は30(画面には12行まで出し、ホイールで送る)。"},{"id":"h184","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"ホットバーの段","body":"ホットバーは最大4段まで使える。出す段はGUI位置調整で段ごとに決める(はじめは1段目だけ)。ふつうのホイールで段の端まで行くと、次の段へ移る。段送りの専用キーもある(はじめは割り当てなし)。⏎2段目以降の品を選ぶと、そのあいだだけ1段目へ移して手に持つ。GUI位置調整で段ごとに置き場所と縦横の並びを変えられる。"},{"id":"h202","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"画面の見た目と文字","body":"DQM設定「表示」で、画面の見た目を選べる。⏎『メニュー』新／旧(はじめは新)・『HUD表示』新／旧(はじめは新)・『HUDの見た目』8種(王家の紋章・ファミコンの黒窓・冒険の羊皮紙 など・はじめは王家の紋章)・『文字』なめらか／ドット(はじめはなめらか)。⏎『マイクラのゲージ』新しいHUDで、マイクラの経験値・満腹・空気を「マイクラ」の枠に出す(はじめは案C 満腹と空気を半分ずつ・枠ははじめステータスの欄のすぐ下)。出さない／案A ゲージ3本／案B 肉とあわのアイコン／案C 満腹と空気を半分ずつ／案D 丸いゲージ／案E 文字だけ／案F 10マスの段／表示しない(どこにも出さず、マイクラの段も消す) から選べる。出すときはマイクラの満腹・経験値・空気の表示は隠れる。空気は水の中にいるときだけ出る。枠は GUI位置調整の「マイクラのゲージ」で動かす・大きさ・表示を変えられ、表示しないにするとマイクラの表示が戻る。⏎画面の表示の場所は、DQMメニューの「HUD」→「GUI位置調整」でドラッグして動かせる(「全て初期位置」で戻せる)。物語の名前の帯・人のひとことの吹き出し・中央の知らせ(旅の扉・石板・スカウトの結果)・施設名の表示・闘技場の大きな字と残りの数・魔王を倒したあとの一言・防衛戦のお題・メタル迷宮の残り時間・レベルアップの知らせなど、画面に出る DQM の表示はどれもここで場所・大きさ・表示・不透明度を変えられる。⏎『配置1〜5』で、今の配置を5つまで名前を付けてしまっておき、「呼び出す」で切りかえられる(操作設定の「DQM GUIの配置を次へ」にキーを割り当てると、しまった配置を順に呼び出せる・はじめはキーなし)。『エクスポート』で今の配置をコードにしてコピーし、『インポート』でコピーしたコードを「今の配置」か「配置1〜5」に取りこめる(今の配置に入れたときは『元に戻す』で戻せる)。『自慢の配置を送る』で、F2 で撮った写真と配置のコードを Discord の「GUI自慢」へ送れる(1日5回まで・送ったコードはだれでも取りこめる)。⏎◆戦いの記録の欄: 呪文と特技(必殺技・息も・ペットと勇者の特技も)で、だれが・何で・だれに・いくつのダメージを与えたかが出る。範囲や多段の特技は1回の技を1行にまとめて「〇〇ほか2体に △△で合計120のダメージ！」のように出る。特技の行は DQM設定「ログ」の「ログ: 特技のダメージ」で出す／出さないを選べる(はじめは出す)。⏎重いときは DQM設定「軽量化」で、家具と飾りの模型の表示距離・かがり火の煙・天候の粒・飾りの光と模型・魔物の粒を減らせる。いちばん上の『見た目の段』を押すと、5段(とても軽い〜最高の見た目)からまとめて選べる(「はじめの見た目の重さ」の項)。"},{"id":"h_minimap","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"ミニマップ","body":"画面の端にいつも小さな地図(ミニマップ)が出る。はじめは右上・まん中の矢印が自分。⏎印: 緑の点=自分のペット・青の点=勇者・白の点=ほかの人・赤の点=魔物(大きい点はボスなど大きな魔物)・金の「！」=物語の目的(地図の外ならふちに出る)・町の人の役割のアイコン(武器屋・防具屋・道具屋・神父・配合の神官・宿屋・ダーマ神官・酒場・鍛冶屋・カジノなど)・黄色い「！」「？」=話のある人(話し終えた物語の人は灰色)・見つけた建物は種類の絵・一度近くで見た店などはキメラの地図と測量図にもアイコンで出る・「N」=北。⏎クエストの魔物(今進めている物語・小話・腕くらべの敵と、受けている討伐の相手)は金の点に脈打つ輪と「！」で出る(親玉は大きい)。地図の外にいるときは近い3体を地図のふちに金の◆で出す。ルーラ・キメラの地図とほこらの測量図にも、読み込まれている所なら出る。方角の帯には64マス以内なら赤い縁の金の◆で出る。DQM設定「表示」の「クエストの魔物を目立たせる」で消せる。⏎建物は◆の印で出る。名前が出るのは、建物リストに記した建物・入って施設名の表示が出た建物・旅の扉のほこらだけ。噂で聞いた建物は赤(確かな話)・橙(あやしい話)の点線の丸と「？」(建物は丸の中のどこか・DQM設定「表示」の「噂の丸」で消せる)、まだの建物は名前の無い◆だけ。広く見ている(1ドット8マス以上)ときは名前を出さない。⏎見た目はDQMメニューの「GUI位置調整」で、一覧の「ミニマップ」を選ぶと出るボタンで切りかえる: 形(丸・四角・横長)/絵柄(HUDに合わせる・王家の紋章・ファミコンのドット・冒険の羊皮紙・ミニマル・和の漆・カジノ・からくり真鍮・マンガ・Shiftを押しながらで前へ)/向き(北が上・自分の向きに回る)/下の帯(なし・場所と座標と天候)/縮尺/地図の大きさ。⏎縮尺(1ドット0.125マス〜32マス・倍々)は、遊んでいる間は Ctrl を押しながらホイールで変わる(押すキーはマイクラの操作設定の「DQM ミニマップの拡大縮小」で別のキーに変えられ、変えると Ctrl ではもう変わらない・ダッシュと同じ Ctrl が困るときはほかのキーに・押している間はホットバーが動かない)。GUI位置調整の画面では、ミニマップの枠の上でホイールを回しても変わる。変えると地図の右下に「×2」などが少し出る。⏎地図の大きさ(48〜320ドット・16ずつ)は「大きさ −/＋」のボタンか、GUI位置調整の画面で地図の右下の角(緑のつまみ)をドラッグして変える。大きくしても縮尺は変わらず、映る範囲が広がる。全体の拡大(倍率)・位置・表示・不透明度はほかの画面の表示と同じ。⏎広く見ると読み込まれていない所が入る。そこは前に見た地形の色で出し、一度も見ていない所は暗くなる。洞窟の中や天井のある世界では、自分の高さのまわりの床と壁を描く。軽量化の見た目の段が「とても軽い」なら、地図の作り直しをおそくする。⏎同じ世界にいるパーティの仲間は、ミニマップ・ルーラとキメラのつばさの地図・ほこらの測量図に、色つきの枠の顔と名前で出る(DQM設定「地図に仲間を出す」で切りかえ)。"},{"id":"h_fullmap","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"地図を画面いっぱいに開く","body":"M キーで、ルーラ・キメラのつばさと同じ地図を画面いっぱいに開ける(見るだけ・ここから飛ぶことはできない)。ドラッグで動かし、ホイールで拡大縮小、ピンも立てられる。もう一度 M か Esc で閉じる。キーはマイクラの操作設定の「DQM 地図を画面いっぱいに開く(見るだけ)」で変えられる。"},{"id":"h_litefirst","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"はじめの見た目の重さ","body":"はじめてワールドに入ると、オープニングの前に「見た目の重さ」を選ぶ画面が出る(パソコンごとに1回)。⏎5段から選ぶ: とても軽い・軽い・ふつう(おすすめ)・きれい・最高の見た目。札を選ぶと、右にその段で変わる所(森の葉・地面の境目・ブロックの絵の細かさ・家具と飾りの表示距離・煙や天候の粒・光の飾り・キラキラ など)と、目安のパソコンが出る。⏎↑↓で選び、Enter か『これにする』で決める。迷ったら「ふつう」。Esc で閉じると「ふつう」になる。⏎前から遊んでいる人には6つ目の札「今の設定のまま」もある(Esc で閉じたときもこちら)。⏎あとからでも DQM設定「軽量化」の『見た目の段』で選び直せる。項目を1つでも自分で変えると「じぶんで決めた」になる。⏎まだ重いときは、Minecraft の「設定 → ビデオ設定」の描画距離を下げると、さらに軽くなる。"},{"id":"h_title","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"タイトル画面と設定の画面","body":"DQM のタイトル画面は、空と大地の絵(雲が流れ、滝や光の粒がきらめく)の下の帯に、羊皮紙のボタン4つ(ぼうけんにでる・なかまとあそぶ・せってい・やめる)と金のメダル(Realms・フレンド・言語・見やすさ・Mods・名前はマウスを乗せると出る)が並ぶ。左下に Minecraft・NeoForge・MOD の版が出る。⏎マイクラの設定・ワールドの一覧・ポーズなどの画面も、ボタンとスライダーが羊皮紙と金の見た目になり、字がなめらかになる(並びと中身はマイクラのまま・ほかの MOD の設定の画面も)。⏎タイトル画面では、MOD のオリジナル曲「旅立ちの朝」が流れる。⏎マイクラの見た目に戻したいときは、DQM設定「表示」の『タイトルと設定の画面』を「マイクラのまま」にする(次に画面を開いたときから・タイトルの曲もマイクラの曲になる)。⏎タイトルの動く飾りの量は『見た目の段』で変わる(とても軽いでは動かない)。⏎ゲームを立ち上げてはじめにタイトル画面を出す前に、流れ星が作者の署名を書く短いオープニング(約8秒)が流れる。はじめの1回は最後まで流れ、2回目からはクリック・Esc・Enter で飛ばせる(『タイトルと設定の画面』が「マイクラのまま」なら流れない)。"},{"id":"h_bgm","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"曲(BGM)と外部BGM","body":"ランク1〜12の世界のフィールドでは、ランクごとのオリジナル曲が流れる(1 アレフガルドの野をゆく・2 三人の旅のちかい・3 大いなる世界地図・4 町をあとに・5 時をこえる家族のうた・6 夢とうつつの丘・7 島めぐりの潮風・8 馬車のゆく大陸・9 天使の見る青空・10 五つの種族の大地・11 過ぎ去りし日の野辺・12 タイジュの陽だまり)。夕方から夜は同じ曲が小さめに流れる。タイトル画面の曲は「旅立ちの朝」。⏎◆曲の音量: どの曲もマイクラの「設定 → 音量」の『音楽』で変わる。曲をまとめて止めたいときは、『音楽』を0にすればよい(効果音や声は止まらない)。⏎◆外部BGM: 自分の曲(ogg)を、マイクラのフォルダーの config/dqmvii/bgm/ に置くと、その場面ではそちらが流れる(DQM設定「音・ボイス」の『外部BGMを使用』がON のとき・はじめはON・場面ごとにも ON/OFF できる)。名前は場面ごとに決まっている(例: field1.ogg フィールド朝〜昼・field_night1.ogg 夕方〜夜・dungeon1.ogg ダンジョン・town1.ogg 町・battle1.ogg 戦闘・maou1.ogg 魔王・title.ogg タイトル画面 など・同じ場面は数字を変えて何曲も置ける)。⏎◆ランクごとの曲: config/dqmvii/bgm/rank1/〜rank12/ に同じ名前で置くと、そのランクの世界ではそちらが先に流れる(ランクのフォルダー → 共通の config/dqmvii/bgm/ → MOD の曲 の順)。⏎◆特別な場所: 一部の場所では、その場所だけの曲が流れる(そこでは外部BGMは使わない)。⏎置いた曲は、ゲームを起動したときに読みこまれる。⏎効果音の差しかえ: config/dqmvii/se/ に、MOD の効果音の名前と同じ名前の ogg(例 level_up.ogg)を置くと、その音に差しかわる。番号違い(level_up_2.ogg・level_up_3.ogg…)も置くと、鳴るたびにその中からでたらめに1つ選ぶ。名前の一覧は同じフォルダーの「効果音の名前.txt」。置いたら再起動。⏎配合の神官の16マス以内では、配合の曲「星をつなぐ祈り」が鳴る(外部BGMは config/dqmvii/bgm/breeding1.ogg 〜)。"},{"id":"h_voice_kinds","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"声の種類ごとの音量","body":"DQM設定「ボイス」で、声の種類ごとに音量を0〜100%で決められる: ペット／勇者・仲間／ルル／町の人・物語／魔王・中ボス。⏎全体の『ボイス音量』に掛け合わせて鳴る。0%(OFF)にした種類の声は鳴らない。"},{"id":"h_party","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"パーティ(マルチ)","body":"Zキーの「パーティー一覧」で、ほかの人とパーティを組める(経験値・ゴールドの分配とLv差の制限は組ごとに切りかえ)。⏎だれが編成を変えられるかは DQM設定「基本」の『パーティの編成』で決まる(変えられるのはOP・シングルとLANの持ち主だけ): 自分のことだけ(はじめ)=自分の出入りと自分のいる組の分配・Lv差だけ・ほかの人は「誘う」と相手のチャットか画面に誘いが出て、受けたら入る(2分で消える)・ほかの人を外せるのは同じ組の人だけ／OPだけ／使わない(今の組は解散・募集も出せない)／だれでも。⏎変えられない所は画面で暗く出て、押すと理由が出る。"},{"id":"h_other_pets","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"ほかの人のペットの見せ方","body":"マルチで、ほかの人のペットや勇者の見せ方を DQM設定「ペット」の『ほかの人のペット』で 見せる／うすく／見せない から選べる。⏎うすく は体を半透明で描き、名札を出さない。見せない は描かない。変わるのは自分の画面だけで、ぶつかり方や動きはそのまま。"},{"id":"h_feedback","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"要望と不具合の報告・評価","body":"DQMメニューの上にある「要望を送る」「不具合を報告する」「評価する」から、作者の Discord のサーバー(要望・不具合報告のチャンネル)へ直接送れる。題名(40字まで)と本文(5〜1500字)を書いて「送る」を押す。不具合のときは分類(クラッシュ・画面・ペット・戦い・建物・その他)も選ぶ。⏎◆いっしょに自動で送られるもの: MOD の版・Minecraft と NeoForge の版・冒険者番号(パソコンごとのでたらめな番号・冒険の記録と同じ・名前は送らない)・いる世界とバイオーム(ランク)と座標。不具合報告ではさらに、ほかの MOD の数と、ログに残った最後の例外の1行(あれば)。送る前に画面の下に全部出るので、確かめてから送れる(画面が狭いときは1行に畳まれ、クリックで中身が見える)。⏎◆不具合報告には、F2 でとった写真を1枚添えられる。「写真を添える（なし）」を押して、いちばん新しい写真から ◀ ▶ で選び「これを添える」。添えた写真は「外す」でやめられる。写真は投稿の中に出る(大きな写真は横1920まで縮めて送る)。選べるのはこのゲームで F2 でとった写真だけ(ほかの画像や、この版より前の写真は選べない)。⏎◆送れるのは このパソコンで1分に1回・1日10回まで(要望と不具合を合わせて)。送れなかったときは回数に数えず、30秒たつともう一度送れる。不具合報告は、最新版で遊んでいるときだけ送れる。⏎◆「評価する」: この MOD がおもしろいかを ★1〜10 で選んで送る(版ごとに1回)。ひとこと(200字まで)は書きたい人だけ。いっしょに送るのは 版・プレイ時間・メインとサブの職業と Lv・冒険者番号だけ。ひとことは作者の Discord だけに届き、紹介サイトのランキングのページには みんなの平均の★と★ごとの数だけが載る。デバッグモード中とクリエイティブでは送れない。⏎◆落ちた記録の報告: ゲームが落ちたら、次に起動したとき(タイトル画面かワールドに入ったとき)に「前回ゲームが落ちたようです。落ちた記録を開発者へ送りますか？」と聞かれる。「送る」を押したときだけ、要約(題・例外・スタックの上から40行・MOD と Minecraft と NeoForge と Java の版・ほかの MOD の数・冒険者番号)を不具合のチャンネルへ送る。パソコンのユーザー名とパスは伏せる。1つの記録は1回だけ聞く。「今後は聞かない」を選んでも、DQM設定「基本」の「落ちた記録の報告」で戻せる。⏎◆旅の写真: DQMメニュー「基本」の「旅の写真を送る」で、F2 でとった写真(いちばん新しいものから ◀ ▶ で選ぶ)を、ひとこと(100字まで・なくてもよい)をつけて作者の Discord の「旅の写真」へ送れる。名前はランキングの名前に従う。1日5枚・1分に1枚まで。選べるのはこのゲームで F2 でとった写真(と、らくがき入りで残した写真)だけ(ほかの画像や、この版より前の写真は選べない)。大きな写真は横1920まで縮めて送る。見本の右の道具で らくがきもできる(ペン〈太さ5段・10色〉・消しゴム・スタンプ8つ・文字〈16字〉・Ctrl+Z で戻す・Ctrl+Y でやり直す)。らくがきは送る写真に焼きこまれ、元の写真は変わらない。チェックを入れると、らくがき入りの写真を「_rakugaki」を付けて screenshots に残せる。「四角」「丸」はドラッグで囲む枠を描く(Shift で正方形・真円・太さと色はペンと同じ)。スタンプと文字は、置く前にホイールで回し(15度ずつ)・Shift+ホイールで大きさを変えられ、置いたあともクリックで選ぶと、ドラッグで動かす・角の四角で大きさ・スタンプは左右と下の金の四角で横だけ・縦だけをのばす・上の丸で回す・Delete で消すができる(矢印は回すと向きが変わる)。"},{"id":"h_telemetry","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"冒険の記録(開発への協力)","body":"開発のための情報集めとして、ワールドを出るとき(ゲームを終えるとき)に、その人の冒険の記録を作者の Discord(記録のチャンネル)へ送れる。中身は遊んでいる間に2分ごとに新しくし、出るときにいちばん新しいものを送る。3分より短い出入りでは送らない。ゲームの窓を閉じたときは、送り終わるまで最大3秒待ってから終わる(間に合わなかった記録は、次にゲームを起動したときに送る)。はじめてワールドに入ってしばらくしてから1回だけ「送る(ワールドを出るときに送る・0〜7時・8〜16時・17〜23時の時間帯ごとに1回まで)」「毎回聞く(ワールドに入ってしばらくしたら、この冒険を終えるときに送るか聞く)」「送らない(もう聞かない)」を聞かれる(Esc で閉じると、次に入ったときにまた聞かれる)。⏎◆送るもの: パソコンごとのでたらめな番号(冒険者 #下4けた)・メインとサブの職業と Lv・はじめに選んだ職業・最初の仲間3匹(種族・配合ランク)・マスターランク・行ったいちばん高いランク・倒した魔王と中ボスの数・星降りの大会の優勝・プレイ時間・各ランクの世界に初めて入ったときのプレイ時間・連れている仲間の上位(種族・配合ランク・Lv)と数・自分と連れている仲間と勇者の今の能力(Lv・HP・MP・攻撃・守備・魔力・魔法守備・バランスの調整に使う)・武器と魔法の熟練度の上位・よく使う武器・死んだ回数と死んだ理由の上位(魔物の種族や「落下」など)・スキルパネルの取ったマスの数・実績の数・見た目の段・ほかの MOD の数・MOD の版・集めた数(図鑑の倒した種族と仲間にした種族・建物リストとバイオームリストの数・小さなメダル・持っているゴールド・鍛冶場の鍛冶Lv・配合の回数・スカウトで仲間にした数・博物館に飾った数・闘技場で勝ちぬいたランク戦・設計図帳・倒した魔物の数)・物語と勇者(終えた物語の数・仲間にした勇者の数・いちばん長く連れている勇者・実績ポイント)・やりこみの記録(一撃の最大ダメージ・いちばん強い仲間〈配合ランクと Lv〉・★3の鍛冶の数・メタル系を倒した数・熟練度が99の数)・あそびの記録(釣ったいちばん大きい魚・カジノのコイン・防衛戦の勝ちの数と勝った最高の旗・ビルダーの旗の町の点とレベル・農園Lv)・各ランクの魔王をはじめて倒したときのプレイ時間(このしくみより前に倒した魔王は送らない)。⏎◆ランキングの名前: DQM設定「基本」の「ランキングの名前」で 出さない(はじめ)／ニックネーム／Minecraftの名前 を選べる(聞く画面でも選べる)。出さないなら「冒険者 #下4けた」で載る。ニックネームは「ニックネーム」の行を押して入れる(1〜12文字・記号の一部と URL は使えない)。ランキングにふさわしくない名前（下ネタ・悪口・なりすましなど）は使えません。前に入れた名前や Minecraft の名前がそれに当たるときは「冒険者 #下4けた」で載る。このニックネームは、Discord の週間ランキングに載ります（ほかの人にも見えます）。Minecraft の名前を選ぶと、Minecraft の名前がランキングに載ります。⏎◆送らないもの: UUID・ワールド名・座標。名前は、ランキングの名前を選んだときだけ送る。ほかのプレイヤーに倒されたときも名前は入れず「ほかのプレイヤー」にする。⏎◆送らないとき: デバッグモード中・クリエイティブ・オープニングの途中。送るのはワールドを出るときなので、画面の知らせは出ない。⏎◆止め方: DQM設定「基本」の「冒険の記録」を押すと 送る→毎回聞く→送らない と切りかわる(このパソコンだけの設定・config/dqmvii/telemetry.properties)。⏎集めた記録は、作者が毎日・毎週・毎月「みんなの冒険のようす」とランキング(人気の職業・人気の勇者・最強の冒険者・大富豪・歩く図鑑・渾身の一撃・釣り名人・町づくりの名人・魔王までの速さなど)にまとめる。⏎◆冒険の速報: 冒険の記録が「送る」で、DQM設定「基本」の「冒険の速報」が「送る」(はじめ)なら、魔王をはじめて倒した・星降りの大会ではじめて優勝した・プラチナの実績を取った・めずらしい魔物(超レア・上のほうのメタル・転生・主・キラキラ)をスカウトで仲間にした、をその場で作者の Discord へ送る(例「冒険者 #1234 が ランク3の魔王を 倒した！」)。添えるのは職業と Lv・プレイ時間・ランクだけ。同じ出来事は1回だけ(魔王の再戦などは送らない)。1分に3回・1日30回まで。デバッグモード中・クリエイティブ・オープニングの途中は送らない。⏎クリア後のランキング(2026-10-22): 旅を終えた人は、DQMメニューの「ランキング」から「クリア後のランキング」を選ぶと、サイトのいちばん下の「クリア後」の欄(はじめは折りたたみ)を見られる。ほかの開き方では欄の中身はすべて「？？？」になる。"},{"id":"h_monster_dex","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"モンスター図鑑","body":"DQMメニューの図鑑の「モンスター図鑑」では、倒したり仲間にしたりした魔物のページが読める。まだ出会っていない魔物は「？？？」。⏎左の外がわの「場所」のボタンで、世界とバイオームを選んで、その場所に自然に湧く魔物だけにしぼれる。選べるのは、歩いて見つけたかバイオームの石板に触れたバイオームだけ。⏎「すべての場所」を選ぶと、しぼるのをやめる。"},{"id":"h_creative","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"クリエイティブのタブ","body":"クリエイティブの DQM のタブには、自分がサバイバルで一度でも手に入れた品だけが出る(検索にも出ない)。拾う・作る・買う・宝箱から取る・ごほうびでもらう、のどれでも記される。記録は人ごとで、死んでも消えない。⏎「DQM建築」のタブの品はふだんは出ない。マイクラのタブはそのまま。⏎クリエイティブやスペクテイターでいる間に持った品は記されない。⏎JEI(Just Enough Items)・REI(Roughly Enough Items)を入れているときは、その一覧と検索からも、手に入れたことのない DQM の品を外す(建築タブの品も・手に入れたらもどる・デバッグモード中は全部出る)。⏎コマンドの入力の候補・JEI と REI のレシピの画面・マイクラのレシピ本の材料の絵・鍛冶の一覧と素材と鉱石の一覧表でも、手に入れていない品は出ない(鍛冶と一覧表では「？？？」)。⏎ランクの魔王を倒すと、そのランクまでの世界や建物で使われている地形ブロックが全部クリエイティブで使えるようになる(魔王の城など壊せない所のブロックも。DQM鉱石は手に入れたときだけ)。⏎ずる対策で、マイクラのコマンドのうち次のものは使えない(デバッグモードの間だけ使える): ボスとして出ている魔物への /damage、DQM の魔物・ペット・勇者・町の人・プレイヤー・DQM のブロック(宝箱など)への /data modify・merge・remove と /execute store … entity・block、プレイヤーと DQM の生き物への /attribute の変更(set・reset・modifier add・remove)と /effect give。/data get・/attribute の get・/effect clear は使える。チャット・サーバーの画面・コマンドブロック・データパックの関数のどれからでも同じ。"},{"id":"op_shed_paint","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"農作業の小屋の区画を塗る","body":"農作業の小屋の画面のまん中の見取り図で、区画ごとに植える種を決められる。⏎右の列の「区画に植える種」から筆(種)を1つえらび、見取り図を左ドラッグで塗る・右ドラッグで消す。塗っていない所は、今までどおり倉庫の種を交代で植える。「塗りを全部消す」は2回押すと消える。⏎見取り図の上でマウスホイールを回すと1〜8倍に拡大・縮小(マウスの下のマスが動かない)。拡大しているときは、中ボタン(ホイール)を押したままドラッグで見る所を動かす。"},{"id":"op_bag_row","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"大きな袋の「袋」ボタン","body":"大きな袋の画面の「もちもの」の各行(ホットバーの行も)のいちばん左に、小さな「袋」ボタンがある。⏎押すと、その行の品を1枠ずつ Shift＋クリックと同じ形で袋へしまう(入らない品はそのまま残る)。マウスを乗せると「この行の品を 袋に しまう」と出る。"},{"id":"op_map_pin","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"地図のピン","body":"ルーラ・キメラのつばさの地図と、地図を画面いっぱいに開くキー(はじめは M キー)の地図で、ピンを立てられる。⏎地図を右クリックでその場所にピンを立てる・ピンを左クリックで編集(名前・10色・消す)。世界ごとに10本まで(同じ色は1本・同じ色を選ぶと入れかえ)。⏎ピンはミニマップ・ほこらの測量図・方角の帯にも出る。見えている範囲の外のピンは、その向きの地図のはしに小さく出る。ピンは目印だけで、ルーラでは飛べない。"},{"id":"op_minimap_zoom","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"ミニマップの拡大・縮小と大きさ","body":"ミニマップの拡大・縮小は、ミニマップの拡大縮小のキー(はじめは 左Ctrl キー)を押しながらマウスホイール。1ドット0.125〜32マスまで変えられる。キーはマイクラの「キー設定」で変えられる。⏎ミニマップの形(丸・四角・横長)・絵柄・向き・下の帯・地図の大きさは、GUI位置調整の「ミニマップ」で選ぶ。地図の大きさは、ミニマップの枠の右下のつまみをドラッグして変える。"},{"id":"op_gui_place","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"GUI位置調整の重なりとお気に入り","body":"GUI位置調整の画面で、枠をドラッグで動かす。選んだ枠は矢印キーで画面の1ピクセルずつ・Shift＋矢印キーで10ピクセルずつ動かせる。⏎重なり: 枠を選んで PageUp で前面へ・PageDown で背面へ(最背面・背面・ふつう・前面・最前面)。ボスのHPバーや防衛戦の帯も選べる。⏎お気に入り: 一覧の各行の右の ☆ を押すと ★(お気に入り)。一覧の上の「★だけ出す」で お気に入りの枠を まとめて調整の画面に出し、「★をしまう」で まとめてしまう。⏎H キーで下のボタンをしまう・出す(枠が見やすくなる)。"},{"id":"op_photo_doodle","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"旅の写真のらくがき","body":"DQMメニューの「旅の写真」で写真を選ぶと、送る前にらくがきができる。⏎道具: ペン・消しゴム・スタンプ・文字・四角・丸。色は10色、ペンの太さは5段。四角と丸はドラッグで大きさを決める(Shift を押しながらで正方形・真円)。⏎スタンプと文字: 置く前にホイールで回す(15度ずつ)・Shift＋ホイールで大きさ。置いたあとは選んで動かす・角の四角で大きさ・辺のまん中の四角で横だけ／縦だけのばす・上の丸で回す・Delete キーで消す。⏎Ctrl＋Z で元に戻す・Ctrl＋Y でやり直す。"},{"id":"op_carriage","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"操作の手引き","title":"馬車の運転と入れかえ","body":"馬車を右クリック(または DQMメニュー「パーティ」の「馬車の中」)で「馬車の中」の画面が開く。⏎入れかえ: 戦う仲間と馬車の中の勇者を、えらんで下のボタンで動かす。勇者をダブルクリックすると、すぐ入れかえる。町や城の中からでも、入口に待たせた馬車(256マスまで)と入れかえられる。⏎運転: 画面の「運転を代わる」で御者台に乗る。移動キー(はじめは W・A・S・D)の前後で進む・下がる、左右で向きを変える。しゃがむキー(はじめは Shift)で降りると、御者が手綱をとる。町などの範囲の手前では止まって降りる。"},{"id":"h045","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"スカウトアタック","body":"魔物を仲間にするには、ペット指令の「スカウトアタック」(呪文・特技スロットの一番上に入っている)を選び、視線の先の魔物に向けてShift+左クリック。⏎戦っている仲間のモンスター(追従・攻撃・迎撃の子が近い順に最大10匹・待機と勇者は加わらない)が1回ずつスカウトアタックをする(ダメージは与えない)。⏎1匹ごとに成功率が上がる。その子の一撃のダメージが相手の最大HPに近いほど大きく上がり、相手の残りHPが少ないほど上がる(満タンで1倍〜ほぼ0で2倍)。2匹目からは1匹ごとに効きが少しずつ減る。1割くらいで「会心のスカウトアタック」になり、上がり方が2.5倍。⏎配合ランクが高い相手ほど上がりにくい。⏎配合ランク S 以上の魔物は、そのままではほとんど仲間にならない(S・SS・SSS の順にさらに上がりにくい)。⏎メタルと転生は成功率が1/10(さらにメタルには、ふつうの攻撃が5回に1回しか当たらない)。⏎成功すると、すぐ仲間になってついてくる。連れている仲間(追従・攻撃・迎撃)がもういっぱいなら、空きのあるペット収納ベルへ入る。ベルが無い・どれもいっぱいなら、その場で待っている。倒していないので経験値・ゴールド・ドロップは出ない。⏎失敗すると、半分は「様子を見ている」(もう一度スカウトできる)、半分は「怒ってしまった」(その魔物にはもうスカウトできない・頭の上に怒りの印)。⏎ボス・中ボス(中ボスの拠点の主や島の主・仲間にするのは配合だけ)・防衛戦・コロシアム・格闘場の魔物はスカウトできない。3分動いていない(放置中)ときもできない。スカウトの最中は、次のスカウトアタックは始められない(終わればすぐ使える)。1回ごとに最大HPの5%を使う(HPが5%以下だと使えない)。⏎同じ種族をスカウトで仲間にするたびに、その種族の成功率は0.6倍ずつ下がる(1回で0.6倍・2回で0.36倍・3回で約0.22倍…いちばん下は0.05倍)。数えるのはスカウトで仲間にした回数だけ(配合・タマゴは数えない・人ごと・キラキラと主も同じ種族)。その種族のペットを配合の親に使ったり逃がしたりすると、回数が1つ戻る(0より下にはならない・転生は相手の親だけ)。仲間にしたことのある種族は、照準の名札に「仲間にした回数」が出る。⏎スカウトアタックできるのは、マスターランクまでの魔物だけ(はじめは I。コロシアムのランク戦を勝ち抜くと上がる)。メタル系と転生の魔物は、マスターランクS からスカウトアタックできる(タマゴや配合で手に入れるのは今までどおり)。倒しても仲間にはならない。⏎成功率が100%に届いたら、まだ打っていない仲間を待たずにすぐ判定になる。⏎スカウトアタック(とスカウトアタック(スカイダウン))を出す Shift+左クリックでは、自分の殴りは当たらない(殴りで倒してしまわない)。判定が出るまでも、自分の殴りは当たらない。⏎「様子を見ている」になったときは、そのあと10秒、自分の仲間(ペットと勇者)はその魔物を攻撃しない(もう一度スカウトアタックすると解ける)。⏎戦える自分のモンスターの仲間が1匹もいない(周りの指令できる子も、持ち物のベルの中の気絶していない子もいない)ときは、自分でスカウトアタックする。始めてから10秒のうちに、ふつうの攻撃(Shift なし)を1回当てよう。成功率の上がり方は仲間の1匹目と同じで、ほかの決まりも同じ。"},{"id":"h210","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"空を飛ぶ魔物のスカウト","body":"空を飛ぶ魔物には、特技『スカウトアタック(スカイダウン)』(スキルパネルの弓のエリア・SP5・MP6・待ち15秒・どの武器でも)を使う。⏎光の矢で撃ち落として5秒気絶させ、そのまま近くの仲間がスカウトアタックする。⏎飛ばない魔物には使えない。スカウトアタックの決まりに合わないときは撃たず、MPも減らない。"},{"id":"h046","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"連れ歩ける数","body":"一緒に連れ歩ける(追従・攻撃・迎撃にできる)のは10匹まで(DQM設定「戦わせられるペット」で1〜10匹に下げられる)。超えたぶんは指令のとき待機になる。⏎待機も含めて世界に出せるのは50匹で、あふれた仲間は『ペット収納ベル』が預かってくれる。勇者(人間の仲間)は別に4人まで。"},{"id":"h047","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"ペット収納ベル","body":"ペットを見てしゃがみ+右クリックで収納(気絶中の子も)。ペットを見ないでしゃがみ+右クリックすると、周り20マスのペットをまとめて収納。ベルを使えばいつでも呼び出せる。⏎ベルは100匹入る(200〜500匹入るベルもある)。⏎ベルを使うと開く画面(メニューが「新」のとき): 左に系統の札、まん中に仲間の並び、右に選んだ仲間の回る模型と能力・作業・呪文と装備・ガンビットの札、下に呼ぶボタン。まん中の並びは「カード」(4列・縁の色が配合ランク)と「一覧」(1行1匹)を切りかえられる(はじめはカード)。メニューが「旧」なら前の画面のまま。⏎ベルから出した待機の子は、はじめは「ついてくる」になる。DQM設定「ペット」の「ベルから出した待機の子」を「待機のまま」にすると、待機の子は待機のまま出てくる(追従・迎撃・攻撃の子は今までどおり・マルチでは出した人の設定)。⏎ホットバー(持ち物の1〜9番)に置いたペット収納ベルの中の子にも、魔物を倒すと連れている仲間の1/10の経験値が入る(ベルの中の全員・魔王の間でも入る・気絶している子は除く・袋の中のベルは入らない)。"},{"id":"h048","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"ペットへの指示","body":"待機・追従・攻撃・迎撃のモードを切り替えられる(迎撃=ついて歩きながら、近くの敵と飼い主を狙う敵を叩く)。作業中は待機、探索は追従が基本。"},{"id":"h049","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"グループさくせん","body":"全ペットまとめて作戦を変えられる(9種)。「ガンガンいこうぜ」「いのちをだいじに」で立ち回りが変わる。"},{"id":"h050","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"性格","body":"仲間には性格があり(40種・7つの型)、戦い方や退き際に個性が出る。⏎性格の型の得意な能力は、育ったときに+10%(攻撃型=攻撃・防御型=守備・支援型=MP・魔法型=魔力・護衛型=HP・慎重型=魔守。バランス型は全部+2%)。"},{"id":"h051","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"フォーメーションとは","body":"フォーメーションを組むと、飼い主とそのペットの両方にバフがかかる。⏎F3〜F10は、アイテム「フォーメーション3〜10」を右クリックして覚える。効き目は選んでいる番号で決まり、ペットの人数には関係ない。"},{"id":"h052","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"F3〜F6のフォーメーション","body":"F3: 守備+20% / F4: 攻撃+20% / F5: 魔力+20% / F6: 魔法守備+20%。⏎ほかのバフと足し算(合計+200%まで)。"},{"id":"h053","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"F7〜F10のフォーメーション","body":"F7: 攻撃・魔力+10% / F8: 魔力・守備+10% / F9: 守備・魔法守備+10% / F10: 攻撃・守備+10%。ボス戦の前に選んでおこう。"},{"id":"h054","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"種族シナジー","title":"種族シナジーとは","body":"同じ種族の仲間を並べると1体あたり+2%のボーナス(2〜10体で+2〜18%)。ｽﾗｲﾑ=ぷるぷる連携(受ける回復量↑・ここだけ1体あたり+4%で+4〜36%) / 魔獣=群れの本能(攻撃↑) / 自然=大地の恵み(最大HP↑) / 物質=硬質連結(守備↑) / 悪魔=魔界の波動(魔力↑) / ｿﾞﾝﾋﾞ=不死の渇き(攻撃が当たるたびに自分の攻撃力の一部だけHP回復)。ﾄﾞﾗｺﾞﾝ・特殊・ﾒﾀﾙにシナジーはない。⏎数えるのは飼い主のまわりの、気絶していない自分のペット(待機や手伝いの子も入る)。フィギュアを飾ると+1。"},{"id":"h055","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ペットのレベル","body":"一緒に戦えば経験値が入りレベルアップ(倒した人のまわり64マスの、気絶も待機もしていないペットに、同じ量がまるごと入る)。⏎能力は配合ランクで決まった目標(Lv300)へ向かって伸びる。ランクが高いほど強く育つ(SSSのLv300はHP8000・攻撃3600ほど、Iはその2割)。⏎性格の得意な能力は+10%、個体ごとに±5%の差がある。"},{"id":"h056","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"スキルとSP","body":"ペットはスキルを3つ持つ。はじめは種族の固有スキル(種族の名前)と、系統に合ったスキル2つ(火の心・剣の技・攻撃力アップ1 など)。魔王系は固有スキルのかわりに「〇〇の覇気」(250SP)、転生系は「〇〇の秘伝」(200SP)を持つ。⏎レベルが上がるごとに SP(スキルポイント)をもらえる(1レベル約1.5・Lv300 でちょうど450)。DQMメニューの「ペット編集」→「ペットのスキル」でペットを選び、3つのスキルに好きに振る(出しているペットなら、遠くにいても振れる)。『次へ』で、次に覚えるものまでのSPをまとめて足せる。⏎決まった SP に届くと、呪文・特技・能力アップ(攻撃+3% など)を覚える。1つのスキルは150SPで全部覚える(上位と合体のスキルは250SP)。ふつうの子は Lv300(450SP)で3つとも埋まる。上位・合体・覇気(250SP)を持つ子は、配合で受け継いだSPがあれば埋まる。持てるSPは750まで。⏎振り直しはできない。呪文と特技はスキルでだけ覚える(レベルで覚える呪文・抽選・特技の書はやめた)。⏎特性: 種族ごとに6つあり、レベル(Lv1・Lv60・Lv120)とプラス値(+25・+50・+100)で1つずつ開く。会心出やすい・自動HP回復・〇〇のコツ(属性の威力+25%)・〇〇キラー・くじけぬ心・メタルボディ など40種。親からは受け継がない。スキルの画面の下で見られる。⏎メタル系のペットは特性「メタルボディ」を持ち、受けるダメージが1/3になり、呪文は効かない(本家どおり)。そのかわり最大HPはほかの種族の平均の1/3で、特技・呪文の消費MPが2倍。守備力は同じランクでいちばん高い種族の1.4倍。⏎仲間のペットが呪文・特技を使うと、そのペットの声で技の名前を叫ぶ(性格の声・魔王系の種族はその魔王の声・同じペットは4秒に1回まで)。DQM設定「音・ボイス」の「ペットの技の掛け声」で切れ、「掛け声の音量」はボイス音量に掛かる。"},{"id":"h057","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ペット装備","body":"ペットにも武器・盾・兜・鎧・腕・靴と、オブジェ3つを持たせられる(DQMメニューの『ペット一括命令・装備編集』・装備をしゃがみ右クリックでも付けられる)。⏎建築・農業・鍛冶の作業Lvは、ペットのレベルが5上がるごとに少しずつ上がる(得意な作業は上がりやすい・最大50)。⏎魔物ごとに持てる武器・防具の種類が決まっている(『持てる装備の種類』)。"},{"id":"n003","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"持てる装備の種類","body":"魔物ごとに、持てる武器の種類(3〜4種)と防具の種類(1〜2種)、盾を持てるかが決まっている。体の形(人型・獣・鳥など)と系統で決まり、魔王・ボスもその魔王らしい種類だけ持てる。⏎防具は4種類: 重い鎧(金属の鎧・かぶと)・軽い防具(皮・武闘着・ブーツなど)・魔法の衣(ローブ・帽子・マント)・おしゃれ着(ドレス・水着など)。品の説明の「武器種」「種類」で分かる。盾は手のある魔物など(人型・大きな人型・物体)だけ。⏎持てる種類はDQMメニューの『ペットの詳細』に出る。装備編集の画面では、マウスを乗せた子が持てない品と、掴んだ品を持てない枠が灰色になる。持てない品を付けようとすると「○○は △△を 持てないようだ」。⏎前から付けていた持てない装備は、効かずに赤く出て、飼い主が近くにいるときに外して持ち物へ返す(いっぱいなら足もとに落とす)。⏎勇者(人間の仲間)は今までどおり全部持てる。種類の決まりが無い武器は誰でも持てる。"},{"id":"h_compitems","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"道具の枠","body":"ペットと勇者には、武器や防具とは別に『道具の枠』が3つある。回復の道具(やくそう・まほうのせいすい・エルフののみぐすり・花のみつなど、HPかMPを戻す品)と、種と実を持たせると、戦いの中で自分で使う。⏎◆使うとき: HPが5割を切ったときはHPの道具、MPを使う呪文・特技を持っていてMPが3割を切ったときはMPの道具を1つ使う。種は戦っているとき、いやしの実はHPが減ったとき、魔法の実はMPが減ったときに使う(同じ種類の効き目が残っている間は使わない)。続けては使わない: HPの回復は30秒・MPの回復は1分・種と実は5分に1回まで。気絶している間とコロシアムの試合中は使わない。魔王やボスとの戦いでも使う。⏎◆1つの枠に同じ道具を10個まで(3枠で30個まで)。使うたびに1つずつ減り、使ったときは『〇〇は △△を使った！』と知らせる。回復の量は、その子の最大HP・MPの割合＋固定値で、プレイヤーがペットに使うときと同じ(アクセサリなどの上乗せは無し)。⏎◆持たせ方: DQMメニューの『ペット一括命令・装備編集』(勇者は仲間の装備の画面)の上の『道具の枠』。右で道具を選んで左の枠を押すと1つ、Shiftを押しながらだと入るだけ入れる。枠を右クリックで全部取り出す。持ち物・袋・近くのチェストの道具を使える。⏎◆道具はベル・ルイーダ・預かり所にしまっても残る。配合で親が消えるときと、ベルの中の子を手放すときは持ち主へ返す。"},{"id":"n_petstatus","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ペットのステータス","body":"DQMメニュー「ペット編集」の『ペットのステータス』で、仲間のペットのくわしい能力を見られる(遠くにいる子も)。左右の矢印・ホイール・←→キーでペットを選び、上の札か PageUp/PageDown・Tab でページを切りかえる。⏎◆1ページ目(カード): 上にペットのカード(ランクの色の縁・Lv・HPとMP)が並び、下に選んだ子のつよさ(素の値と、装備やスキルで足した分)・建築/農業/鍛冶・装備6枠と★・付けられる武器と防具・オブジェ3つと効き目の合計・スキル3つと振ったSP・特性6つ・覚えている呪文と特技・なつき度。⏎◆2ページ目(くわしく): 大きな配合ランクとLv・HPとMP、能力の六角形(青い線が素の値・金色が装備などを足した値)、耐性(呪文の属性と状態異常を 弱点・ふつう・軽減・半減・激減・無効・吸収 の7段で)、特性とスキル。⏎「ベルの子も見る」で、持っているペット収納ベルの中の子も暗いカードで出す(素の値と足した分は、呼び出すと見られる)。勇者はDQMメニュー「パーティ」の『パーティのステータス』で見る。"},{"id":"n001","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"オブジェを付ける","body":"魔物のオブジェは、ペットの『オブジェの枠』(3つ)に付けると能力が上がる。オブジェごとに能力が3つ(最大HP・攻撃・会心率・みかわし・受けるダメージ・属性の威力と耐性・系統キラー・自動回復・経験値など)あり、その魔物らしい効き目になっている。強い魔物のオブジェほど効き目が大きい。⏎同じオブジェは1匹に1つまで。同じ効き目を重ねたときは上限がある(例: 能力は各+15%まで・会心率+6%まで・みかわし+8%まで・受けるダメージ−8%まで)。全体の上限(会心率50%・みかわし50%・軽減の合計75%など)も今までどおり効く。⏎付け外しは『ペット一括命令・装備編集』の画面(右の『オブジェ』の列から選んで、左の下の段の枠を押す)か、オブジェを持ってペットをしゃがみ右クリック(空いている枠へ)。素手でしゃがみ右クリックすると、ホットバーの7〜9番を選んでいるときはオブジェ1〜3を外す。⏎付けている間は置いて飾れない(外せば今までどおり飾れる・博物館にも渡せる)。勇者(人間の仲間)には付けられない。⏎効き目はオブジェの説明と、DQMメニュー『ペットの詳細』で見られる。"},{"id":"n002","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"なつき度","body":"ペットには『なつき度』がある。連れて戦うと少しずつ増え、MAX になると、その種族のオブジェを1個くれる(1匹につき1回・持ち物がいっぱいなら足もとに落とす)。オブジェは魔物が落とさないので、これがオブジェの手に入れ方になる(フィギュアは今までどおり魔物が落とす)。⏎増え方: 近く(32マス)で自分か仲間がランクの世界の魔物を倒す +1、そのペットがとどめを刺す +2(さらに)、連れて歩いて5分ごとに +1、作物のごはん1個 +5〜+15(品質で・1日に3個まで・能力の上限のあとでも食べる)、闘技場と防衛戦で勝つ +20。⏎MAX は配合ランクで変わる(I 450 〜 SSS 2270・目安は I 約2時間 〜 SSS 約10時間)。1日(ゲームの中の1日)に増えるのは300まで。減らない。⏎待機の子・気絶している子・ベルの中の子・部屋の手伝いの子は増えない。3分動かないでいると増えない。神殿・闘技場・メタル迷宮・防衛戦の敵を倒しても増えない。配合の子は0から(受け継がない)。⏎なつき度はペット収納ベルの画面で見られる(選んだ子の明細にハートとゲージ・MAX は金色。王家の紋章の見た目ではカードにも小さなハートが付き、MAX は金のハート)。"},{"id":"fl03","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"花の贈り物","body":"花を持って、しゃがみ(Shift)ながらペットを右クリックすると、花を贈れる(ふつうの右クリックは花を使う・魔物を狙えば投げる)。なつき度が、その系統の好きな花(DQ の花)で+4、Minecraft の好きな花で+3、聖なる花で+3(どの系統も好き)、ほかの花で+1 増える。1匹1日2本まで(ごはんとは別)。⏎好きな花: スライム系 ホイミの花・ハート形の花・ルラフェンのそら色の花/ドラゴン系 竜の牙草・ロザリーヒルのばら・サマディーのさぼてんの花/自然系 妖精の花・アリアハンの野の花・サラボナのチューリップ/魔獣系 ソレッタのひまわり・レーベのきいろい花・砂漠の大輪花/物質系 星降り草・氷結晶の植物・雲から生える花/悪魔系 魔界の黒バラ・悪魔の茨・エルヘブンのむらさき玉花/ゾンビ系 月光草・雪原の白花・ミントスのすずらん/メタル系 精霊の花・魔力の花・幸運の四つ葉草。"},{"id":"fl04","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"花のにおいでスカウト","body":"野生の魔物を狙って花を右クリックすると、花を投げる(16マスまで)。その系統の好きな花なら、魔物が足もとでにおいをかいで、60秒の間スカウトアタックの成功率が1.15倍(聖なる花はどの系統も1.08倍)。肉・好物と重ねて効く。花どうしは高い方だけ。好きでない花には見向きしない(花は残る)。"},{"id":"h058","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"経験の聖典・性格の書","body":"性格の書はカジノの景品(1000コイン)で、ペットの性格をランダムに変える。経験の聖典はペットのレベルを1つ上げる(カジノの景品からは外した)。どちらもペットに右クリックで使う。"},{"id":"h059","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"配合のきほん","body":"配合の杖を使うと、Lv10以上の2匹の仲間(20マス以内)から新しい仲間が生まれる。子はLv1から(レア枠はもっと高いレベル)。親の能力は受け継がないが、スキル・SP・作業Lv・プラス値を受け継ぐ。⏎子のスキルは、両親のスキル・生まれる子の固有スキル・上位のスキル(★)から3つまで選ぶ(本家どおり)。片方の親が上限まで振るか、両親の合計が上限に届いたスキルは、上位のスキル〈火の心→火の極意 など〉も選べる。選ばなかった枠は子の固有スキル→系統のスキルで埋まる。⏎合体: 上位のスキル2つ(〇〇の極意・〇〇アップ2)を、親がどちらも上限まで振っていると(1匹が両方でも、2匹で片方ずつでも)、合体スキル(★★・21種・250SP)も選べる(火の極意＋氷の極意→氷炎の極意、回復の極意＋補助の極意→賢者の極意 など)。組み合わせは、スキルの画面や配合の画面でスキル名にカーソルを当てると出る。⏎子は両親のもらったSPの合計の半分を受け継ぐ(300まで・配合の秘伝書があれば+10)。引き継いだスキルには、両親が振っていたSPの合計の半分が振られたまま生まれる(残りは振っていないSP)。配合の画面の「受け継ぐスキル」の下に、選んだスキルで子がどのスキルに何SP振られて生まれるかと、受け継ぐSPの合計が出る。⏎配合の神官なら、収納ベル内の2匹をペットLv不問で選べる。神官の祈りは、遊んでいる時間で1時間に1度うけられる(配合・転生が成ったときから1時間・ゲームを止めている間は進まない)。"},{"id":"h060","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"配合ランク","body":"配合ランクは I・H・G・F・E・D・C・B・A・S・SS・SSS の12段。ランクが高いほど強く育つ。⏎子のランクは両親の平均(半端は8割で切り捨て)。5%でランクが1つ上がる(2つ上がることは無い)。⏎まれ(10%)にレア枠になり、両親ともLv150以上なら転生が、Lv240以上で結果がSS以上ならランク11の魔王(ウルノーガ)を倒したあと魔王が生まれる。⏎スカウトアタックはマスターランクまでの魔物にしかできないが、配合はマスターランクに関係なくできる。⏎★特殊配合: 決まった組み合わせでは、両親ともに決まったLv以上なら決まった子が必ず生まれる(どの組み合わせかは、配合の画面で両親を選ぶと分かる)。Lvが足りなければふつうの配合。⏎◆S以上の魔物は特殊配合でしか生まれない: ふつうの配合で生まれる子は Aランクまで(両親の平均が S 以上でも A・5%のランク+1 も A が上限)。S・SS・SSS の魔物がほしいときは、特殊配合の組み合わせをさがそう。⏎◆S以上のタマゴ: 福引・主のタマゴ・ごほうびなど、配合のほかで手に入れた S 以上の魔物のタマゴは、マスターランクがその魔物の配合ランクに届くまでかえらない(タマゴはなくならない・届いたら使える)。"},{"id":"h_breedmemory","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"配合の記憶","body":"配合で生まれる子は、両親の育ちを『配合の記憶』として受け継ぎ、そのぶん能力が上がる。⏎1つの記憶は、両親の素の能力の育ちの10%(HP・MP・攻撃・魔力・守備・魔守ごと)。Lv300 まで育てた親からなら +10%、若い親からなら少しだけ。性格や個体差の分もそのまま写る。⏎子は、両親の記憶から選んだ4つまでと、その配合の新しい記憶1つを持つ(1匹5つまで・5つそろうと最大 約+50%)。両親の記憶が5つ以上あるときは、配合の画面で残す4つを選ぶ(はじめは大きい順)。⏎記憶の%は、装備やスキルを足す前の素の能力にかかる(能力の上限はそのまま)。どの配合(神官・杖・特殊配合・ボス配合・転生)でも同じに付く。⏎持っている記憶は『ペットのステータス』の「3/3 記憶」のページで、1つずつと合計、上がっている数を見られる。前からいる子は記憶0から。"},{"id":"h_breedhint","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"特殊配合のヒント(図鑑)","body":"ある種族のペットのなつき度を MAX にすると、モンスター図鑑のその種族のページに「特殊配合のヒント」が出る(人ごと・一度 MAX にすれば消えない)。⏎ヒントは、その種族が親になる特殊配合の相手と生まれる子の名前の頭の1字と字数(例「ス○○○○」)と、両親に要る Lv のめやす(高い・かなり高い・とても高い)だけ。⏎前から MAX の子も、ログインしたとき(持ち物のペット収納ベルの中)か、連れて歩いているときに記される。"},{"id":"h061","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"転生","body":"転生の杖でLv10以上の2匹の仲間を使い、親Aの種族と見た目のまま生まれ変わらせることができる(Lv1から・名前を受け継ぐ)。配合の神官でもできる。"},{"id":"h062","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"血統と＋1","body":"「＋数字」は配合・転生を重ねた世代数で、名前の横に出る。子は両親のうち大きい数字に「両親の合計Lv÷40」を足した数になる(最低＋1)。たとえば両親がLv100どうしなら＋5、Lv300どうしなら＋15。育ててから配合するほど数字が伸びる。⏎＋数字で能力は上がらない(特性の +25・+50・+100 が開く)。上限は＋1000で、両親とも＋1000だと配合できない。⏎生まれた子は親の血統も引き継ぐ。家系図は DQMメニューの「ペット編集」→「ペットの家系図」で見られる。"},{"id":"h186","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"転生モンスターの印","body":"仲間にした転生モンスターは、頭上の名前の横に「[転生]」、ベルの収納一覧とパーティ一覧では「転」と出る。⏎図鑑の「転生のみ」ボタンで、転生モンスターだけを並べられる(まだ会っていないものは出ない)。"},{"id":"h063","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"レシピと鍛冶Lv","body":"鍛冶の画面には、必要な鍛冶Lvの順にレシピが並ぶ(100ごとに見出し・土地のランクでは隠さない)。⏎アイテム(道具・建材・ブロックなど)は、はじめから全部並ぶ。武器・防具(盾も)・アクセサリーは、その品の『設計図』を設計図帳に記したものだけ並ぶ(はじめは1つも無い)。⏎素材がそろい、鍛冶Lvが足りていれば作れる。鍛冶Lvが足りないレシピは灰色。⏎名前で探す欄があり、アイテムとおまかせ打ちは一度に作る数を1〜64で選べる(Shiftを押すと10ずつ)。装備を自分で打つときは1回で1個。"},{"id":"hs_smith","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"鍛冶の段","body":"鍛冶は5つの段に分かれていて、自分の金床で いちばん高かった鍛冶Lvで開き、ルルの話を聞くか「とばす」を選ぶと使える(「あとで」を選ぶと使えないまま・DQMメニューの「できごと帳」→「ルルの手ほどき（鍛冶）」→「つづきを聞く」か「この段をとばす」)。⏎① はじめから: 金床で打つ・設計図・★。特技は「たたく」「強打」だけ。⏎② 鍛冶Lv40: 鍛冶ハンマー・ほかの特技(てかげん打ちなど)・採集の場所・錬金釜のカマエル(置く・作る・合成と地形ブロック・花の錬金)。⏎③ 鍛冶Lv80: 鍛冶の担当(火入れ・鍛打・仕上げ)と相方の技・担当のない子の鉱石掘り。⏎④ 鍛冶Lv150: 打ち直し・おまかせ打ち。⏎⑤ 鍛冶Lv250: 鍛冶依頼・カマエルの武器の錬金と素材の錬金。⏎まだ開いていない段のボタンは灰色になり「鍛冶Lv80から」のように わけが書かれ、作り方も止まる。使おうとすると、わけがチャットにも出る。鍛冶Lvは手伝いの子の鍛冶の力 × 鍛冶場の倍率12 なので、手伝いをふやしたり、仲間のレベルを上げると上がる。"},{"id":"h_blueprint","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"設計図","body":"武器・防具(盾も)・アクセサリーは、1品ごとの『○○の設計図』を手に入れて、右クリックで設計図帳に記すと鍛冶で作れるようになる(記した設計図はなくなる)。⏎もう記してある設計図は使っても減らない。お店で売れる(その品の値段の1/10)。⏎手に入れ方: ダンジョンの紫の宝箱(15%)・金の宝箱(40%)、武器屋・防具屋にときどき並ぶ(10%・値段はその品の2倍・閉じると消える)、町の物語を終えたとき(ランク+1を3枚)、町の人のおねがいを終えたとき(30%)、コロシアムのランク戦を勝ち抜いたとき、ランクの世界の魔物の落とし物(1/1000)、町や城のタンス・壺などを調べたとき(20%)。⏎まだ記していない設計図が出やすい。記した設計図はDQMメニュー『図鑑』の『設計図帳』で見られる。⏎設計図も鍛冶も、行ったことのあるいちばん高いランク+1 までの強さの品だけ。それより強い品は設計図が出ず、記してあっても「ランクNの世界に行くと作れるようになります」と出て、そのランクへ行くと作れる(みんなの島の仲間の設計図でも同じ)。⏎設計図の説明と、設計図帳で記した品にマウスを乗せると、作るのに要る素材と数(と鍛冶Lv)が出る。⏎まだ記していない設計図を狙う方法(2026-10-22): メダル王の城の主の証の交換所の札「設計図」で、もう記した設計図(重なり)3枚を同じ分類のまだの1枚と交換できる。装備図鑑の節目に収集家の老人がくれる設計図は、まだのもの。福引の紫の玉(5%)はまだの設計図。ビルダーの町がレベル3になると、町長が1日1枚まだの設計図を高めの値段でゆずってくれる(しゃがんで話しかけると買う)。どれも、行ったいちばん高いランク+1 より強い品は出ない。"},{"id":"h064","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"素材集め","body":"素材は手持ち・持っている大きな袋・金床の中の倉庫から自動で集まる。足りない素材はメッセージで教えてくれる。⏎系統・土地の鍛冶の素材(〇〇ゼリー・〇〇のクローバーなど)は、同じ系列の上の段の素材でも代わりに使える(1つ上の段は同じ数・2段以上上は1個で2個ぶん)。"},{"id":"h_smith_mats","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"鍛冶の素材(系統・土地・ボス)","body":"装備のレシピには、魔物の落とし物と鉱石のほかに「鍛冶の素材」を使う。どれも4段(段1=ランク1〜3・段2=4〜6・段3=7〜9・段4=10〜12の世界)。⏎【系統の素材】スライム系=ゼリー・ドラゴン系=ツメ・自然系=枝・魔獣系=キバ・物質系=歯車・ゾンビ系=骨片・悪魔系=ツノ・特殊系=羽根。その系統の魔物だけが、ふつうの落とし物の枠でときどき落とす。⏎【土地の素材】草原と森=クローバー・砂漠=砂・雪と氷=氷片・火山=火種・海と水辺=真珠・空と闇=星くず。その土地にある採集の場所(光る草むら・きらめく岩・凍った岩・溶岩のふき出し・貝の砂地・光る石)を右クリックすると1〜3個採れる(人ごとにゲームの1日で戻る)。その土地で倒した魔物もときどき落とす。⏎【ボスの素材】中ボスの魔石(ランクごと)は各武器種のそのランクでいちばん上の品(看板の品)に、魔王の素材は最上位の品に使う。メタル系を倒すとメタルのかけら、転生を倒すと転生の輝石、ゴメちゃん・ホアカリを倒すと女神のひかりが手に入ることがある。⏎【イメージボーナス】系統の素材を使って作った武器はその系統の魔物に与えるダメージ+5%、土地の素材を使った武器はその土地で与えるダメージ+5%。防具・盾はそれぞれ受けるダメージ−2%(合わせて−10%まで)。セット防具は全部位が同じ系列の素材を使う。"},{"id":"h065","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"一度作れば店に並ぶ","body":"設計図で覚えて、自分で作ったことのある武器は武器屋に、防具と盾は防具屋にも並ぶ(お店の「ランクの品」6〜8品のあと)。アクセサリーとアイテムは並ばない。"},{"id":"h066","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"打つ","title":"打つのきほん(DQ10式)","body":"武器・防具(盾も)・アクセサリーは「打つ」で作る(「アイテム」の分類は打たずにすぐできる)。『打つ』を押すと素材を使って打ちはじめる(やめても素材は戻らない)。装備は1回打つと1個。⏎品の種類で決まる2〜6本のゲージ(焼けた鉄の棒)を、選んで(クリック・1〜6キー)特技で打つ。どのゲージも0からのびる。⏎金の線が基準値、そのまわり±4の緑がゾーン。全部のゲージを基準値に寄せたら『仕上げる』。ずれの合計で ★なし〜★3 が決まる。⏎集中力が足りなくなる・温度が0℃になると、そのときのゲージで仕上がる。打っている間は画面を閉じられない(16マスより離れて30秒・10分の放置でも仕上がる)。"},{"id":"h067","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"打つ","title":"温度と会心","body":"武器・防具・盾は温度1000℃から。打つたびに50℃下がり(熱風おろしは150℃)、熱いほど1回ののびが大きい(たたくは 1000℃で12〜18・2000℃で18〜27・50℃で7〜10)。アクセサリーは温度なし。⏎会心が出ると、のびが2倍。基準値を越えるときは基準値ぴったりで止まる。会心率は 3%＋鍛冶Lvで最大+3%＋ハンマー(ねらい打ち系はさらに+25%、上級者打ちは+35%)。⏎鍛冶Lvがレシピの鍛冶Lvより上なほど、のびのぶれが小さくなる(500上で7割せまい)。"},{"id":"h068","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"打つ","title":"特技と集中力","body":"特技は集中力を使う。はじめは「たたく(×1)・強打(×2)」。鍛冶Lvで覚える: てかげん打ち(20)・上下打ち(40)・火力上げ(60・温度+300℃)・4連打ち(90)・ねらい打ち(120)・3倍打ち(150)・みだれ打ち(180)・冷やしこみ(220・温度−300℃)・超4連打ち(260)・ななめ打ち(300)・上級者打ち(340)・熱風おろし(380)・上下ねらい打ち(430)・弱ねらい打ち(480)・左右打ち(540)。⏎特技にマウスを乗せると、選んだゲージにのびの見込みがうすく出る。キーは Q〜P・A〜J(覚える順)。⏎集中力 = 80＋鍛冶Lv×0.2(600まで)＋ハンマー。鍛冶Lv500 からは、集中力が10以下になると、まれに30回復する。"},{"id":"h069","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"打つ","title":"相方の技(ふいご・見切り・手直し)","body":"その工程の担当ペットがいるとき、打っている間に1回ずつ使える(集中力を使わない・右の相方の欄をクリック)。⏎ふいご(火入れ)=温度を200℃上げる(熟練Lvごとに+20℃・最大+400℃) / 見切り(鍛打)=次の1打ののびがぶれない(熟練Lv5で2打) / 手直し(仕上げ)=前の1打を取り消す(ゲージと温度が戻る・熟練Lv10で集中力も戻る)。"},{"id":"h070","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"★","title":"★のきまり","body":"ずれの合計(ゲージごとに 基準値との差。±4の中はそのまま・外は最低9)で決まる。ゲージ4本なら ★3 0〜4・★2 5〜10・★1 11〜17・★なし 18〜29、それより多いと失敗作(本数が多いほど幅が広い)。ゲージが上限(基準値×1.5＋10)を越えると、その場で失敗作。⏎★1 +10%・★2 +20%・★3 +30%・失敗作 −20%(武器=攻撃力・杖=魔力・防具と盾=守備)。名前は「ホーリーランス★3」「○○(失敗作)」。⏎前の品質の 良質・名品・伝説・粗悪 は、そのまま ★1・★2・★3・失敗作 になった(強さは同じ)。神器・究極神器は前の宝箱の品だけ。⏎アクセサリーは割合ではなく、能力のどれか1つに数が足される。⏎★は装備の数字を少し上げる仕上げ。強さの中心は職業のレベル・スキルパネル・仲間で、装備はそれを補うもの。ランクが上がるほど、魔物の強さに比べて★の差は小さくなる。"},{"id":"h071","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"★","title":"鍛冶ハンマー","body":"鍛冶で作る道具(アイテム→その他)。持ち物にあると、一番よい1本が効く(耐久なし)。⏎銅(Lv1・集中力+0)・鉄(60・+10・会心+0.5%)・銀(150・+15・+1%)・プラチナ(250・+25・+1.5%)・超(350・+35・+2%)・奇跡(450・+50・+2.5%)・光(550・+45・+3.5%)。2段目からは1つ下のハンマーも素材に使う。⏎ほかに効く品: スミスの腕輪(集中力+10)・シドのゴーグル(会心率+1.5%)・鍛冶神の金槌(失敗作になるとき1度だけ★なしで仕上がる)・サブ職業の特性「ルーンの手」(打ち直しのとき集中力+15)。⏎ハンマーは持ち物だけでなく、持っている大きな袋と、その金床の倉庫の中にあっても効く(いちばんよい1本)。"},{"id":"h072","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"打ち直し","title":"打ち直し","body":"手に持った装備(鍛冶で作れる武器・防具・盾・アクセサリー)を、はじめからもう一度打つ。『打ち直し(手に持った装備)』を押すと、打つ画面になる。⏎費用は1回ごとに レシピの1つ目の素材×3 と 売値×20G(始めるときに払う)。⏎仕上がりが前より良い★なら変わり、同じか下なら前のまま(品は失わない)。★3以上の品・お店で買った品は打ち直せない。⏎前の打ち直しの +1〜+9 は効き目もそのまま残る(これからは増えない)。"},{"id":"h074","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"工程担当","body":"火入れ/鍛打/仕上げの担当を決めると、それぞれ補助効果が出る(担当の欄をクリックで切り替え)。⏎火入れ=素材を1個返す(★1以上のとき・アイテムはいつでも) / 鍛打=完成品+1(★2以上のとき) / 仕上げ=失敗作を★なしに救う。打っている間は「相方の技」も使える。⏎発動率は10%＋熟練Lv×4%(得意な系統なら+15%・最大75%)。得意: ドラゴン・悪魔・自然系=火入れ / 物質・魔獣・ゾンビ系=鍛打 / スライム系など=仕上げ。⏎『おまかせ打ち』: ペットに打たせると、打たずにまとめて作れる。できるのは ★なしか★1 だけ(★1は 30%＋3人の熟練Lvの合計×2/3%・最大50%)。"},{"id":"h075","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"熟練Lv","body":"担当している工程で1個作るたびに熟練が上がる(最大Lv10)。熟練が上がると補助効果の発生率が伸び、相方の技(ふいご・見切り・手直し)もよく効く。"},{"id":"h076","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"鍛冶の秘伝書","body":"鍛冶依頼を納品すると10%でもらえる。⏎使うと、8マス以内の金床(鍛冶場)の担当の熟練が1レベル上がる(しゃがみ右クリックで工程を 火入れ→鍛打→仕上げ と切り替え)。"},{"id":"h077","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"依頼","title":"鍛冶依頼","body":"武器屋にしゃがみ右クリックで依頼を受けられる。ゲームの1日(遊んでいる時間で20分・寝ても進まない)ごとに3件、作ったことのあるレシピから出る。⏎品物を手に持って、もう一度しゃがみ右クリックで納品(品質は問わない)。⏎報酬は鍛冶用の値(お店の売値とは別)の2倍×個数。まれに鍛冶の秘伝書。"},{"id":"h211","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"錬金釜","title":"カマエルの錬金釜","body":"専用のブロック「錬金釜のカマエル」を置いて右クリックすると開く。カマエルは鍛冶の「その他」で作る(配合の杖1・転生の杖1・中身が空の無限の袋1)。⏎武器: 武器を3本入れると(ランクはそろえなくてよい・3本の攻撃力の平均に近いランクが基準。攻撃力は★や打ち直しを数えない素の値で、杖は魔力で数え、武器は武器と・杖は杖と比べる。武器と杖をまぜたときは、杖をそのランクのふつうの武器の強さとして数える。基準は入れた3本のいちばん高いランクを超えない)、15%で1つ上のランク・50%で同じランク・35%で1つ下のランクの武器が1本できる(お店で買った武器入りは上にならず、できた武器もお店で買った品と同じ扱いで錬金効果も付かない。もろはのつるぎ・みなごろしの剣はできない)。⏎素材: 同じ素材を8個入れると、15%で1つ上のランクの素材1個・50%で同じランクの別の素材2個・35%で1つ下のランクの素材2個ができる(ランク1は下が無いので同じランク)。⏎素材はランク12の品を入れられない(武器はランクを問わず入れられる)。転生装備や専用の品は入れられない。『候補を確認』でできる物の一覧が見られる。できた物は新品(品質と打ち直しは引き継がない)。⏎合成: 系統・土地の鍛冶の素材は、同じ素材を5個入れると、次の段の素材1個に必ず合成できる(いちばん上の段は除く)。⏎まとめて錬金: 素材は左の枠に1スタックまで入れられ、「回数」の－＋と「最大」で回数を決めると、8個ずつ(合成は5個ずつ)1回ずつ抽選してまとめて作る。使うのは 回数×8個(合成は×5)だけで、残りは枠に残る。できた物は同じ物をまとめて右の枠へ、入りきらない分は持ち物へ(いっぱいなら足もとへ)。⏎袋から入れる: 『袋から入れる』で持っている大きな袋の中身から、錬金に使える品を選んで入れられる(素材は左の枠に1スタックまで・武器は空いた枠に1本)。入れた品は、閉じると持ち物へ戻る。⏎【画面】メニューが「新」のときは、左にコマンド、まん中に魔法陣の回る釜と「上・同じ・下」の確率の帯、右にできる物の候補(持ち物と袋の中身も見える)、下にカマエルのひとことと回数が出る。錬金すると釜が光る。⏎『候補を確認』の一覧は、装備図鑑に載った武器と、拾ったり作ったりしたことのある素材だけ名前が出る。まだの品は灰色の「？」と「？？？」。⏎段: カマエルは鍛冶の段②(鍛冶Lv40)から置けて、合成と地形ブロック・花の錬金に使える。武器の錬金と素材の錬金は段⑤(鍛冶Lv250)から。⏎1日の回数: 武器の錬金と素材の錬金は、人ごとに現実の1日(パソコンの日付が変わり、そのうえゲームの中で1日〈20分〉遊ぶと戻る)で5回ずつまで。素材のまとめて錬金は1回の抽選で1回と数え、残りの回数より多くは選べない。合成と、地形ブロック・花の錬金は数えない。画面に「今日の錬金 武器 n/5・素材 n/5」が出る。"},{"id":"fl05","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"錬金釜","title":"地形ブロックの錬金","body":"錬金釜(素材)の左の枠に、同じ自然の地形ブロック(草ブロック・土・砂・雪や氷・原木・葉)を8個入れると25%、花・草・落ち葉を8個入れると50%で、その地形(草原と森・砂漠・雪と氷・火山・海と水辺・空と闇)の土地の素材が1個できる。外れても8個は使う。⏎素材の段は、錬金した人が今いる世界のランクの段(ランク1〜3は段1 … 10〜12は段4)。1人1日(ゲームの中の1日)3個まで。⏎壁・床・屋根・木材・飾り・はしご・魔王の城のブロックと、名前に地形の無い石は入れられない。ほしい地形の素材を選べるのが使い道。"},{"id":"h078","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"畑はペットに任せる","body":"種まき・収穫は農作業の小屋の手伝いがやってくれる(畑は自分で耕す)。種は種の棚の中の倉庫へ(種の棚の画面の「倉庫」)。⏎島にいるあいだの畑しごとは、種の棚の持ち主が島にいて、放置中(3分移動していない)でないときに目の前で進む。⏎島を離れているあいだ(ほかの世界へ冒険に出ているとき)の分は、持ち主が島に戻ったときにまとめて進む(留守の時間は、ログインしていて放置中でないあいだの時間で数える・何時間でも上限は無い・倉庫がいっぱいになったらそこで止まる・長い留守の分は戻ってから少しずつ進むので、すぐには終わらないこともある)。戻るとチャットと画面の右の枠で「留守のあいだに ○個 しまった」と知らせる。作物が育つ・手伝いの子が収穫して倉庫へしまう・空いた耕した土に倉庫の種をまく、をくり返す(品種改良の交ざりの芽は、島にいるときだけ出る)。⏎種が何種類かあると、1マスずつ交互に植える。⏎植える種を場所で決めたいときは、種の棚の画面(メニューが「新」)の右の列で種(筆)をえらび、まん中の畑の見取り図を左ドラッグで塗る(右クリック・右ドラッグで消す・「塗りを全部消す」は2回押し)。塗った所にはその種だけを植え、倉庫にその種が無いときは空けておく。塗っていない所は今までどおり倉庫の種を交代で植える(留守のあいだの分も同じ)。⏎地形タブの土・草ブロック(DQ)も、ペットやクワで「耕した土」になる(粗い土にあたるものはクワではまず土に・泥・粘土・苔・ポドゾルは耕せない)。耕した土は水の近くで湿り、跳ねたり何もしないで乾くと土に戻る。"},{"id":"hs_farm","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"農業の段","body":"農業は5つの段に分かれていて、農園Lvで開き、ルルの話を聞くか「とばす」を選ぶと使える(「あとで」を選ぶと使えないまま・DQMメニューの「できごと帳」→「ルルの手ほどき（農業）」→「つづきを聞く」か「この段をとばす」。鍛冶の手ほどきの途中でも「農業を先に聞く」を選べる)。⏎① はじめから: 種まきと収穫(種の棚・水おけ・手伝い・倉庫)。⏎② 農園Lv3: 畑の担当・好物を投げる・仲間のごはん・えさ台。⏎③ 農園Lv5: 農園の台(石うすなど)・魔物の力・げんきとまかない・出荷箱・農園の管理盤。⏎④ 農園Lv8: 農場の施設(かかし・水車・風車・温室など)。⏎⑤ 農園Lv12: 品種改良(交ざりの芽)・品種図鑑・品種図鑑の机。⏎まだ開いていない段の台と施設は置けず、画面のボタンは灰色になり「農園Lv3から」のように わけが書かれる。使おうとすると、わけがチャットにも出る。段が開くと「農業の新しいことが できるように なった！」と知らせが出る。⏎農園Lvは、仲間が1株とるごとに4・ごはん1つで3 入るので、はじめは畑しごとだけで上がる(畑30マスほどで Lv3 は だいたい1時間・Lv5 は3〜4時間)。"},{"id":"h079","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"種の品質は3段階","body":"無印→超→極。上の品質ほど、好物(スカウトのしやすさ)とごはん(ペットの能力の上がり方)の効き目が大きい。"},{"id":"h080","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"肥料","body":"肥料=作物に使うと1段育つ / 超肥料=収穫の大成功率+12% / 極肥料=超の作物が実るとき5%で極になる。⏎どれも鍛冶で作れる(極肥料=超肥料4個＋せかいじゅの葉1)。"},{"id":"hf01","unlockStage":4,"majorCategory":"農業","minorCategory":"好物とごはん","title":"好物でスカウト","body":"力の種・守りの種などの作物は、魔物の好物。右クリックで魔物へ投げると、肉と同じように約30秒かけて食べる。⏎食べた魔物へのスカウトアタックの成功率が、好物の系統なら 無印1.5倍 / 超2倍 / 極3倍、ほかの系統なら1.25倍になる(食べている間は上乗せが半分)。⏎肉とは重ならず、高い方だけが効く。前に食べた物より倍率の低い物は食べない。"},{"id":"hf02","unlockStage":4,"majorCategory":"農業","minorCategory":"好物とごはん","title":"系統ごとの好物","body":"スライム系=いやしの実 / ドラゴン系=炎の実 / 自然系=素早さの種 / 魔獣系=力の種 / 物質系=守りの種 / 悪魔系=魔力の種 / ゾンビ系=魔法の実 / メタル系=黄金の実。品種改良でとれる剛力の種は魔獣系・物質系、叡智の種は悪魔系・ゾンビ系。"},{"id":"hf03","unlockStage":4,"majorCategory":"農業","minorCategory":"好物とごはん","title":"えさ台","body":"種の棚のそば(横5マス・上下2マス)に樽を置いて好物を入れると、ランクの世界の夜に、畑のバイオームに住む、その系統のふつうの魔物が畑へ寄ってくる。⏎5分に1体・同時に1体まで。好物を食べ終えた状態で来るのでスカウトしやすい。近くに30秒以上止まっていない人がいるときだけ来る。"},{"id":"hf04","unlockStage":4,"majorCategory":"農業","minorCategory":"好物とごはん","title":"ペットのごはん","body":"作物や農園の料理を持って、しゃがみ(Shift)ながらペットを右クリックすると食べさせられ、その能力がずっと上がる(1匹ごとに各能力5%まで・1匹1日3個まで・上限ならもう食べない)。⏎生の作物は 無印+0.05% / 超+0.10% / 極+0.20%。農園で加工した料理は 段3 +0.25% / 段4 +0.50% / 段5 全能力+0.30%。⏎力=攻撃 / 守り=守備 / 魔力=魔力 / いやし=最大HP / 魔法=最大MP / 炎=魔守 / 素早さ=歩く・乗る速さ / 黄金=6つの能力。⏎しゃがんで右クリックすると、そのペットのごはんの記録を見られる。配合の子には受け継がない。人間の仲間は食べない。"},{"id":"h081","unlockStage":4,"majorCategory":"農業","minorCategory":"収穫のコツ","title":"大成功","body":"収穫時に確率で大成功。無印作物は実が超品質になり、超以上は収穫量+1。収穫担当の農業Lvと自然系の収穫担当と超肥料で確率アップ。収穫担当がその作物を好物にする系統なら、さらに+8%(最大45%)。⏎大成功・大当たりは、手伝いのペットか一斉収穫で採ったときだけ。自分で収穫したときは付かない。"},{"id":"h082","unlockStage":4,"majorCategory":"農業","minorCategory":"収穫のコツ","title":"大当たり","body":"大成功時、さらに低確率で1段上の品質の苗を掘り当てる(無印→超、超→極まで)。上位の苗の主な入手ルート。上位の苗は鍛冶でも作れる。"},{"id":"h084","unlockStage":4,"majorCategory":"農業","minorCategory":"一斉収穫フィーバー","title":"フィーバーのやり方","body":"種の棚の画面の『一斉収穫』は、実った株が1つ以上あると押せる。目押しで成功すると収穫2倍、芯なら実の品質もアップ(1回で最大10株)。"},{"id":"h085","unlockStage":4,"majorCategory":"農業","minorCategory":"一斉収穫フィーバー","title":"実りを溜める","body":"「実りを溜める」をONにすると収穫担当が収穫を止めて実を溜めてくれる。フィーバー前の仕込みに。一斉収穫すると自動でOFFに戻る。"},{"id":"h086","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"交配種","body":"剛力の種と叡智の種は、品種改良の第2世代の品種になった(となりで採れる交配はやめた)。力の種と守りの種、魔力の種と魔法の実を1マスあけて並べて実らせると、間に交ざりの芽が出ることがある。好物は2つの系統に効き、ごはんでは2つの能力が上がる。"},{"id":"h087","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"出荷依頼","body":"道具屋にしゃがみ右クリックで出荷依頼。育てた作物がお金に変わる。報酬でまれに農業の秘伝書。"},{"id":"h088","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"農業の秘伝書","body":"使うと種の棚(農作業の小屋)の担当工程(種まき/水やり/収穫)の熟練が1レベル上がる。しゃがみ右クリックで対象工程を切り替え。"},{"id":"hp01","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"魔物の力","body":"畑でとれた種や実は、農園の台で加工すると強い品になる(粉→生地→料理→ごちそう)。⏎台は「魔物の力」で動く。農作業の小屋の手伝いのうち「力を出す」役の子(5匹まで)が、系統の力を出す: ドラゴン系=熱 / スライム系=水 / 物質系=動力 / 自然系=成長 / 悪魔系=闇 / ゾンビ系=発酵 / 魔獣系=野生 / メタル系=輝き(特殊系は輝きを半分)。⏎1分に出る量 = 基礎(配合ランク I 8〜SSS 56) × (0.5 ＋ Lv÷200) × (1 ＋ 農業Lv×1% ＋ 力に合う技×10%〈3つまで〉)。"},{"id":"hp02","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"げんきとまかない","body":"力を出す子には「げんき」(100)がある。働くと1分に1へり、0になると60まで小屋で休む(1分に2もどる)。⏎農園の管理盤の「まかない」で、持っている農園の品(段1 +10 / 段2 +25 / 段3 +50 / 段4以上 +100)を食べさせると、げんきがもどる。"},{"id":"hp03","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"台と農園の管理盤","body":"台は9つ: 石うす(動力)・清めの水おけ(水)・農園のかまど(熱)・しぼり機(動力)・発酵だる(発酵)・漬けつぼ(発酵と水)・ごちそう鍋(熱と水)・まじないの鍋(闇)・輝きの仕上げ台(輝き)。ほかに力のかめ(種の棚から8マス・蓄えが種類ごとに+500・4つまで)・力の柱(台から8マス・柱どうし16マスで力を届ける)・出荷箱。⏎作り方: ごちそう鍋・まじないの鍋・輝きの仕上げ台は鍛冶(アイテム)、ほかは作業台。台は種の棚から24マス以内(上下12マス)か、力の柱のそばに置く。⏎台を右クリックすると「農園の管理盤」: 8つの力・手伝いのペット・届いている台の一覧と、選んだ台のレシピ(◀ ▶)・材料を入れる・できた物を取る。ホッパーでも出し入れできる。"},{"id":"hp04","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"農園Lv","body":"「農園Lv」(人ごと・1〜30)の経験は、仲間が1株とるごとに4(留守のあいだの収穫も)・仲間にごはんを1つ食べさせると3・台で何かを作るたびに 段1 2・段2 5・段3 12・段4 30・段5 80・品種を1つ見つけると50。⏎農園Lvで農業の段が開く(② Lv3・③ Lv5・④ Lv8・⑤ Lv12・「農業の段」)。台は段③(農園Lv5)から、そのうえで覚えた農園Lvから動く: 漬けつぼ Lv6 / ごちそう鍋 Lv8 / まじないの鍋 Lv12 / 輝きの仕上げ台 Lv16(ほかの台は段③が開けば動く)。レシピにも覚えるLvがある。"},{"id":"hp05","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"料理のバフ","body":"段3以上の料理は、自分で右クリックして食べると料理のバフ(1つだけ・新しく食べると入れかわる): 段3 +4%・10分 / 段4 +7%・15分 / 段5 全能力+10%・20分。⏎力=攻撃 / 守り=守備 / 魔力=魔力 / 素早さ=歩く速さ / いやし=10秒ごとに最大HPの1〜2%回復 / 魔法=10秒ごとにMP回復 / 炎=炎で受けるダメージを減らす / 黄金=攻撃・守備・魔力。決戦の異空間と闘技場の試合中は食べられない。"},{"id":"hp06","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"好物だんごと魔物のごちそう","body":"まじないの鍋で作る「〇〇系の好物だんご」(8系統)は、投げるとスカウトアタックの成功率がその系統なら2.5倍・ほかの系統1.5倍。輝きの仕上げ台の「魔物のごちそう」はどの系統にも3倍(いちばん上は今までと同じ3倍・肉と高い方だけ)。"},{"id":"hp07","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"出荷と交換","body":"出荷箱に農園の品を入れて管理盤の「出荷する」を押すとお金になる(段1 15G・段2 60G・段3 300G・段4 1,200G・段5 12,000G)。ゲームの1日に「行ったことのある いちばん高いランクの世界の魔物1体のゴールド × 30」まで。"},{"id":"hp08","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"放置したとき","body":"力を出すペットと台は、持ち主が同じ世界にいて、放置中(3分移動していない)でないときだけ動く。放置中・ログアウト中は止まり、げんきだけがもどる。"},{"id":"hp09","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の台と魔物の力","title":"鍛冶の素材","body":"農園では鍛冶の素材も作れる: 植物の繊維(しぼりかすから)・丈夫な麻ひも・魔法の染料・聖なる油。鍛冶の「アイテム」で、やわらかウール・まだらクモ糸・にじいろの布きれ・けんじゃの石に作りかえられる。⏎しぼりかすは発酵だるで肥料にもなる(超肥料・極肥料も作れる)。"},{"id":"hv01","unlockStage":4,"majorCategory":"農業","minorCategory":"品種改良","title":"交ざりの芽","body":"2つの品種が実ったら、東西か南北に1マスあけて並べておく。間の何も植えていない耕した土に、ときどき新しい品種の「交ざりの芽」が出る(種の棚のまわり・10秒ごとに見る)。⏎芽が育つと新しい品種の作物と種がとれる。品種は第2〜第5世代の21と、黄金襲来で取る真・極黄金の実の22。⏎種の棚の持ち主が同じ世界にいて、放置中でないときだけ芽が出る。⏎品種改良の段が開いていると、手伝いのペットは、両どなりに別々の作物があって芽が出る形のマスには種を植えずにあけておく(同じ作物どうしにはさまれたマスには植える)。"},{"id":"hv02","unlockStage":4,"majorCategory":"農業","minorCategory":"品種改良","title":"育つ条件","body":"上の世代ほど、芽が出る条件がある: ランクの世界・晴れ・昼・夜・砂漠や乾いた土地・雪の土地・浜や海のそば・高さ150以上か空の世界・魔界や闇の世界・溶岩のそば、天候では 雷雨・朝の霧・赤い月の夜・花吹雪・オーロラ・雨上がりの虹・流れ星。⏎温室のまわり4マスでは、天候・場所・昼夜(赤い月・虹・流れ星・魔界や闇の世界も)の条件をみたしたことになる。⏎ランクの条件(ランク3以上など)は、畑のある世界のランクか、畑の持ち主が行ったことのある世界のいちばん高いランクで見る(マイホームの島でも、行ったことのあるランクまでの品種ができる)。"},{"id":"hv03","unlockStage":4,"majorCategory":"農業","minorCategory":"品種改良","title":"品種図鑑","body":"農園の管理盤の「品種図鑑」で、世代ごとの系統樹を見られる。見つけた品種は名前・親・条件・使い道、まだの品種は「？？？」(親を見つけていれば親の名前だけ出る)。⏎芽が出たとき・実った品種を取ったとき・管理盤を開いたときに持っている種と作物で記す(1つ記すと農園Lvの経験+50)。"},{"id":"hv04","unlockStage":4,"majorCategory":"農業","minorCategory":"品種改良","title":"品種の使い道","body":"新しい品種の作物は台の材料になる: 疾風のドリンクが3つ・特やくそうの近道・せいすい2倍・黄金の実のいらない黄金のパン・海でなくても海の塩3倍など。⏎嵐の雷鍋・赤月のショコラ・氷晶のシャーベット・砂漠の火のスープ(2つの能力のごはん)、天空のワイン、花吹雪のだんご(どの系統にもスカウト2倍)、オーロラのデザート・竜のフルコース・虹のフルコース・星のフルコース(段5)。"},{"id":"hf10","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の施設","title":"施設のいろいろ","body":"施設は農業の段④(農園Lv8)から。そのうえで覚えた農園Lvから動く: かかし(まわり12マスで魔物が畑を踏まない)・貯蔵庫(まわり8マスの台のできた物を集める)・水車(Lv10・となりに水・動力+8/分)・風車(Lv10・動力+6/分・高さ100以上で+9)・井戸(Lv12・水+6/分)・ミツバチの巣(Lv14・まわり4マスの花で花のみつ)・えさ場(Lv14)・苗床(Lv15・まわり8マスの芽の率×1.5)・魔物の小屋(Lv16・たまご・羊毛・革・羽根)・温室(Lv18)・肥料塔(Lv20・入れた肥料をまわり8マスにまく)・力の変換炉(Lv22・力2つを別の力1つに・管理盤で「かえる前」「かえた後」の力を8つのボタンから選び、「量」を 止める／1秒に1／2秒に1／5秒に1 から選ぶ。量は かえた後を1つ作るのにかかる秒数で、前の力を毎回2つ使う。同じ力どうしは選べない)・星見の祭壇(Lv24・夜、天候の品種の芽の率×2)。⏎水車・風車・井戸のペットなしの力は、種の棚1つで 動力・水 それぞれ1分に 30〜90 まで(農園Lv1 で30・Lv30 で90。農園の管理盤の「ペットなし」の行にマウスを乗せると、いまの上限が出る)。ペットが出す力は上限の外。どれも作業台で作り、台と同じく管理盤に出る。"},{"id":"hf11","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の施設","title":"えさ場","body":"今のえさ台(種の棚のそばの樽)は今までどおり。えさ場は種の棚から16マスまで置けて、好物を入れておくと夜に魔物が寄ってくる(野生の力を30使う・5分に1体)。かかしのとなりなら4分に1体。"},{"id":"hf12","unlockStage":4,"majorCategory":"農業","minorCategory":"農園の施設","title":"となりあわせ","body":"上下左右のとなりに置くと効く: 水車と石うす・しぼり機(動力−20%)・かまどとごちそう鍋(熱−15%)・発酵だると漬けつぼ(時間−15%)・井戸と清めの水おけ(水−30%・井戸か水車のとなりの水おけは、きれいな水に水バケツが要らない)・温室と肥料塔(温室の成長がもっと速い)・苗床と温室(芽の率×1.2)・ミツバチの巣と温室(みつ+1)・魔物の小屋と肥料塔(5分に肥料1つ)・まじないの鍋と星見の祭壇(夜は闇−25%)・輝きの仕上げ台と力のかめ(輝き−15%)・えさ場とかかし(4分に1体)。"},{"id":"h089","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"ホーム","body":"最初の拠点はマイホームの島。施設アイテム「ホーム」は鍛冶(Lv1・板材9)で作り、島の建築の机で建てられる。⏎建てたら、ベッドやチェストを置いて暮らしを整えよう。"},{"id":"h090","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"施設を増やす","body":"施設アイテムを持って建築の机(マイホームの島)を右クリックするか、建築の机の建築スロットに入れて『建築』を押すと、ペットが建ててくれる。⏎武器屋・防具屋・道具屋・教会の道具屋・カジノ・・増えるほど便利に。施設アイテムは宝箱やカジノの景品で手に入る。"},{"id":"h091","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"第二の拠点","body":"お気に入りの土地を見つけたら、拠点をもう1つ構えるのもいい。"},{"id":"h190","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"各地の施設とダンジョン","body":"ランクの世界には、町・お店・ダンジョンなどが決まった場所に建っている(本家にあるものは、その作品のランクの世界の名前の合うバイオームに)。誰かが近く(112マス)へ行くと建つ。⏎施設は入口のそばの「施設の石板」(銅)、ダンジョンはいちばん奥の金の宝箱のそばの「ダンジョンの石板」(黒)に触れると、建物リストに載る。⏎建物リストは、全体の3%を記すたびにサブ職業の証を1つ受け取れる(確率ではなく、記した数で決まる・職業→転職のきほん→リストで証を受け取る)。"},{"id":"h191","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"転生・メタル・超レアの出会い方","body":"ランクの世界では、転生・メタル・超レアは自然には湧かない。⏎転生: 夜(昼夜の無い世界ではいつでも)にバイオームの石板・白に触れると、石板のそばに転生が1体現れる。そのランクの転生で、どのバイオームで呼んでも同じ強さ(中ボスの3割ほどのHP・中ボスの7割ほどの攻撃。赤い月の夜は1.2倍)。⏎呼んだ転生はボスのように戦う: HPが半分を切ると力をあらわにし、その種族の呪文・特技・息を使う。強い転生ほど2回行動もする。予告の円・詠唱(攻撃を当てて止められる)・痛恨の一撃・自動回復を使うものもいる。ふつうの殴りと技の一撃は、受けた人の最大HPの3割まで。⏎倒すと経験値はその世界のふつうの魔物の20体ぶんくらい。スカウトアタックはマスターランクSから・成功率1/10のまま。⏎一度呼んだ石板は3時間(遊んでいる時間)休む(きせきのゆびわ・きせきのネックレスを身につけていれば1時間30分)。ほかの石板ならすぐ呼べる。魔王の塔では出ない。⏎メタル: ランクの世界で魔物を150〜300体倒すたびに、「キラキラした気配」がしてメタルが1匹近くに来る。種類と経験値はその世界のランクで決まる(メタル迷宮と同じランクの表)(ふつうの魔物の30体ぶんくらい)。ランク10〜12の世界では1割で、ゴッデス･オレオールを落とすメタルセラフィムかメタルゴッデスが来る。3分動かずに倒したぶんは数えない。⏎超レア: 雨上がりの昼には空に虹(5分)、3晩に1回ほど夜に流れ星(3分)が出る。ランク10以上の世界では、そのあいだ10回に1回くらい、近くにゴメちゃんかホアカリが現れる(「ふしぎな気配がした」・強さはそのバイオームのSS・経験値はその世界のふつうの魔物の30体ぶんくらい)。"},{"id":"h_tensei_equip","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"転生装備","body":"転生の魔物が落とす「転生装備」(80品)は、能力は同じランクの店の品より控えめなかわりに、その品だけの効き目を持つ。⏎例: デスマスクは HP3割以下で倒れる一撃を1回こらえる(10分に1回)・デス・キャロットは掘った鉄・金・銅の原石が延べ棒で出る・伐採マシンの鎌は上の原木もまとめて切る(木こり)・トロルバッコスの大棍棒は掘ったブロックが直接持ち物に入る・高濃度マ素結晶は攻撃の呪文を3回当てると次の呪文が消費MP0・ゴッデス･オレオールは当てたメタルが10秒逃げない・神の涙は倒れたペットを1日1回起こす。⏎効き目は品の説明の【】の欄に書いてある。武器は手に持っているとき、防具と盾は身につけているとき、アクセはアクセサリー枠に置いているときに効く。受けるダメージを減らす効き目は、ほかの軽減と合わせて75%まで。魔王・コインボス・中ボス・闘技場の相手には効かないか半分のものがある。倒す・拾う・畑・ペットの回復などの効き目は、3分動かずにいると止まる。"},{"id":"h_dungeon_affix","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"ダンジョンの力(拾った武具の特殊効果)","body":"ダンジョンの宝箱(金・紫・緑)と名品の宝箱から出た武器・杖・防具・盾には、まれに「ダンジョンの力」が1つだけ付いている。付く率は 金の宝箱12%・紫8%・緑4%(小だけ)・名品25%。⏎◆強さは小・中・大の3段。名前の後ろに【会心+1%】のように出て、説明のいちばん上に「◆ダンジョンの力(大)」と出る。色は 小=水色・中=緑・大=金。大はランク4から。⏎◆効果は56個: 攻め(一撃の重み・会心・先手の一撃・追い打ち・吸血・魔力吸い など)、○○キラー(系統へ)・魔王への気迫、○○の力・○○の刃・○○よけ(属性)、○○の牙・○○よけ(状態異常)・長い呪縛、守り(物理の守り・命の器・身かわし・不屈・とげの守り・やすらぎ など)、盾だけの盾の心得・見切りの盾・返しの構え、呪文と特技(呪文の冴え・癒しの手・節約の心得・速い詠唱・技の間合い)、便利(旅の足・学びの心・金の匂い・宝の鼻・掘り手・鉱脈の勘・長い息・腹もち・乗り手の心得・なかまの絆・まもの使い・熟練の心得)。⏎◆同じ効果を何品にも付けても、全身で「大2つぶん」まで。どれも会心率50%・与ダメージ×2・軽減75% などの上限の中で効く。⏎◆攻めと守りの力は、ペットと勇者が装備しても効く。便利の力はプレイヤーだけ(速い詠唱と技の間合いは勇者にも効く)。⏎◆鍛冶の★とは別。打ち直しても残り、錬金釜に入れると消える。あとから付け直すことはできない。売ると 小+
