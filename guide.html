hift)ながらペットへ右クリックで食べさせると攻撃がずっと上がる。無印+0.05% / 超+0.10% / 極+0.20%(1匹ごとに5%まで・1日3個まで・農園で加工した料理はもっと上がる)。"},{"id":"x002","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"守りの種","body":"物質系の好物で、ペットのごはん(守備)。⏎好物の倍率とごはんの量は力の種と同じ。"},{"id":"x003","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"魔力の種","body":"悪魔系の好物で、ペットのごはん(魔力)。⏎好物の倍率とごはんの量は力の種と同じ。"},{"id":"x004","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"素早さの種","body":"自然系の好物で、ペットのごはん(素早さ＝歩く速さと乗ったときの速さ)。⏎好物の倍率とごはんの量は力の種と同じ。"},{"id":"x005","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"黄金の実","body":"メタル系の好物で、ペットのごはん(最大HP・最大MP・攻撃・魔力・守備・魔守をまとめて)。⏎好物: メタル系なら 無印1.5倍 / 超2倍 / 極3倍 / 真・極3倍、ほかの系統なら1.25倍。⏎ごはん: 6つの能力が 無印+0.02% / 超+0.05% / 極+0.10% / 真・極+0.20%ずつ上がる(1匹ごとに各5%まで)。"},{"id":"x006","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"炎の実","body":"ドラゴン系の好物で、ペットのごはん(魔守)。⏎好物の倍率とごはんの量は力の種と同じ。⏎しゃがんで右クリックで自分で食べると、それからずっと燃えなくなる(1回だけ)。"},{"id":"x007","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"いやしの実","body":"スライム系の好物で、ペットのごはん(最大HP)。⏎好物の倍率とごはんの量は力の種と同じ。"},{"id":"x008","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"魔法の実","body":"ゾンビ系の好物で、ペットのごはん(最大MP)。⏎好物の倍率とごはんの量は力の種と同じ。"},{"id":"x009","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"薬草","body":"使うとHP回復。回復量は使った相手の最大HPの割合＋固定値: 薬草 10%+20 / 上やくそう 12%+35 / 超薬草 15%+50 / 特やくそう 18%+60 / いやしそう 22%+80 / 極薬草 30%+150 / 霊薬草 40%+250 / 聖薬草 52%+400 / 神薬草 65%+500。霊薬草より上は鍛冶で下の薬草から作る(霊＝極×3、聖＝霊×3、神＝聖×5)。"},{"id":"i_recovery","unlockStage":4,"majorCategory":"アイテム","minorCategory":"道具","title":"回復の品の回復量","body":"HP・MPを戻す品は、使った相手(自分・ペット・勇者・ほかの人)の最大HP・MPの割合＋小さな固定値だけ戻す。せかいじゅのしずく・エルフののみぐすりは満タン。⏎◆MPの品: ネコ砂 4%+8 / 花のみつ 8%+20 / ヘビのぬけがら 10%+25 / まりょくの土 12%+30 / 巨大ヒゲトカゲ 14%+35 / ほしのカケラ 12%+40 / 月のめぐみ 15%+60 / あやしい小ビン 18%+80 / まほうのせいすい 24%+120 / 賢者の聖水 30%+160 / てんしのソーマ 40%+250。⏎◆毒消し: 毒消し草は毒を消すだけ。超毒消し草 8%+15 / 上どくけしそう 10%+20 / 特どくけしそう 15%+40 / 極毒消し草 18%+50 / 万能薬 10%+20(悪い効果を全部消す)。⏎◆いやしの実・魔法の実は10秒ごとに6回: いやしの実 最大HPの3%+5・5%+10・8%+20、魔法の実 最大MPの3%+5・5%+10・8%+20。⏎◆回復量アップ(巨大ナスビナーラの髭・ももいろ三姉妹のピアス +30%、スキルパネルの「回復アイテムの回復量+%」、道具マスターの「アイテム効果+25%・+50%・+75%」)は足し算で、合わせて+100%(2倍)まで。仲間が道具の枠から自分に使うときは乗らない。⏎◆手に入れ方は品の強さで世界のランクが決まっている(弱い品はランク1から・強い品はランクの高い世界の宝箱・落とし物・鍛冶で)。鍛冶で作る回復の品は、その品のランクの世界に行ったことがないと作れない。"},{"id":"x010","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"毒消し草","body":"毒を治す。超はHP30前後、極はHP80前後も同時に回復。"},{"id":"x011","unlockStage":4,"majorCategory":"アイテム","minorCategory":"種・作物","title":"種の品質と育て方","body":"どの種・実も畑で育てて増やせる。品質は無印→超→極の3段階(黄金のみ真・極まで4段階)で、上の品質ほど好物とごはんの効き目が大きい。"},{"id":"q001","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"目標と招待状","body":"はじめて入ると、はじまりの神殿で案内役のルル(わたげの星の精)に会い、神殿の闘技場の司会から「星降りの大会」の招待状をもらう。⏎出られるのはマスターランク SSS の魔物使いだけ。招待状の12の星はマスターランク(I〜SSS)で、ランク戦を勝ちぬくたびに1つ灯る。⏎今の目標はクエスト欄のいちばん上に出る(次のランク戦と、そのランクの魔物が多い世界)。招待状は DQMメニュー「基本」の「招待状」でいつでも見られる。"},{"id":"q002","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"ルルと話す","body":"ランク戦を勝ちぬいてマスターランクが上がると、ルルが出てきて、次のランク戦に向けて仲間を集める世界を教えてくれる。⏎DQMメニュー「基本」の「ルルと話す」でいつでも呼べる。オープニングの途中なら、今の場面をもう一度。「思い出」で語りと招待状をもう一度見られる。⏎オープニングは会話の窓で Shift を長押しすると、とばせる(職業と最初の仲間は選ぶ・招待状と目標はもらえる)。⏎戦いの最中(敵に狙われている・攻撃を受けたばかり)は、ルルや案内の人は話しかけてこない。戦いが終わってから話す。"},{"id":"q003","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"予選と大会","body":"12のランク戦の最後、SSSランク戦が大会の予選。勝ちぬくと、ランク12「タイジュの国」の大樹のてっぺん・星降りの闘技場で大会に出られる。⏎舞台に上がるか司会に話しかけると受付。歴代のマスター4人(疾風のセイラン・鉄壁のガルド・魔導のミレイユ・星降りの覇者オルヴァ)と、10対10の勝ちぬき4番勝負。試合のあいだに仲間は手当てを受ける。負けても何度でもすぐ挑める。"},{"id":"q004","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"優勝と、そのあと","body":"はじめて優勝すると「星降りの覇者」となる。……そして、その夜に物語が動き出す。ルルの声をたよりに、最後まで見届けよう(エンディングの物語)。物語の終わりに、星を取りもどしたおくりものがもらえる。みんなに共通のごほうびは、称号「星の救い手」・スキルポイント+100・騎乗ゲージの最大+50・邪神ニズゼルファのトロフィー(マイホームに飾れる)。さらに星のねがいを3つから1つ選べる: ①この世に1つの「星の救い手の首飾り」(持ち主が付けたときだけ 全能力+8%・会心率+5%・会心ダメージ+20%・10秒ごとに最大HPの2%回復・売れない) ②配合ランクSSSのふつうの魔物のタマゴを一覧から自分で選ぶ(選ばずに閉じたら、DQMメニューの「ルルと話す」から1回だけ選び直せる) ③100万G・防衛戦のメダル100枚・主の証30。おくりものも星のねがいも1人1回だけ。2回目からの優勝は賞金10万G。⏎魔王は各ランクの世界に1体ずつ(ランク11は魔王ウルノーガ、ランク12は魔王の塔の屋上の全てを超越せし者)。魔王を倒すと魔王の証が手に入る。ランク11の魔王ウルノーガを倒すとボス級モンスターの配合が解禁される。"},{"id":"q004b","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"エンディングの物語","body":"物語の途中は、目標の欄(クエスト)と方角の帯が次に行く所を教えてくれる。DQMメニューの「ルルと話す」でも、今の目標がわかる。⏎はじめて見る場面の会話はとばせない(2回目からは ESC でとばせる)。⏎物語を終えたあとも、はじまりの神殿などで少しずつ続きがある。⏎◆マスターとの手合わせ: 物語を終えると、神殿の闘技場(司会の台のそば)に歴代のマスターが日替わりで1人来る。話しかけて「手合わせする」を選ぶと、そのマスターの仲間と10対10の1試合(強さは星降りの大会の決勝くらい・参加費なし・何度でも)。勝つと、1日の1回目だけ ごほうびのゴールド(パソコンの日付が変わり、ゲームの中で1日〈20分〉遊ぶと次の日)(その日2回目からは、出た仲間のなつき度だけ)。エンディングの画面は、全てを超越せし者の討伐の証を右クリックすると、もう一度見られる。"},{"id":"q004c","unlockStage":4,"majorCategory":"クエスト","minorCategory":"星降りの大会","title":"邪神の座の戦い","body":"物語の最後の戦いは「邪神の座」という小さな世界で、光る金の床から生えた邪神ニズゼルファ(上半身と左手・右手)と戦う。邪神は動かない。床から落ちても床の上へ戻される。⏎◆左手・右手は本体とは別の HP を持つ。腕を倒すと沈んで、その腕の技が止まる(45秒で HP 半分で生えてくる)。腕に与えたダメージの4分の1は本体にも入る。勝ち負けは本体の HP だけ。⏎◆はじめは闇の衣でダメージが4分の1になる。床の光る台(4つのうち1つが光る)の上で右クリックすると、はがれる。⏎◆技の前には床に赤い円や扇が出る。円の外へ逃げよう。右手のなぎはらいは、とびあがればかわせる。ひとみの光は、間に壁があれば当たらない。⏎◆邪神の子が祈っている間に、子を全部倒すとダークミナデインを止められる。⏎◆第1形態を倒すと仮面がはがれて（真）になる。（真）が頭の上に炎をためはじめたら(終末の炎・20秒)、その間にどちらかの腕の HP を最大の5%削れば止まり(腕を倒しても止まる)、邪神がしばらく崩れおちる(受けるダメージが増える)。時を奪うも、ためている間に腕の HP を5%削れば止まる。⏎◆クリア後の再戦も同じ場所で戦う(勝つたびに10%ずつ強くなる・2倍まで)。"},{"id":"q005","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"おねがいの受け方","body":"町の人のおよそ5人に1人が「おねがい」を持っている。話しかけると事情と一緒に頼まれごとを聞ける。"},{"id":"q006","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"おねがいの種類","body":"親分たいじ・群れの退治・取り戻す・探しもの・手紙と頼みごと・仲間を見せる・花の納品・建材の納品 の8種類。内容はその人ごとに決まっている。"},{"id":"fl06","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"花と建材の納品","body":"町の人のおねがいに「花の納品」(その世界で咲く花を4〜8本)と「建材の納品」(その世界でとれる自然の地形ブロックを16〜32個)がある。集めて頼んだ人に話しかけると渡せる。⏎ごほうびはゴールドと経験値(ほかのおねがいの2/3)・素材・鉱石・設計図(30%)と、花の納品はペットのごはん(超)と福引券のかけら2、建材の納品は家具1つと鉱石。渡した品が地形ブロック図鑑にまだ無ければ、図鑑にも記す(使わずに)。"},{"id":"q007","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"報告と報酬","body":"達成したら「依頼した本人」に報告する(場所はクエスト欄に座標が出る。言伝は届け先に話しかけた時点で終わる)。報酬は その世界の魔物15体ぶんのゴールドと経験値・素材2(半分はレア)・鉱石2回・設計図30%と、型ごとの品: 親分たいじ=主の証1 / 群れの退治=福引券1(4回に1回 主の証1も) / 取り戻す=その世界のランクの装備1(4回に1回 名品) / 探しもの=ペットのごはん(超)1(4回に1回 ランク+1の装備も) / 手紙と頼みごと=鉱石もう1回・福引券1 / 仲間を見せる=ペットのごはん(超)2・スキルポイント+2。同じ人のおねがいは一度きり。"},{"id":"q008","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"クエスト欄","body":"受注中のおねがいは画面のクエスト欄に直近5件まで表示される。6件目以降も記録されていて、完了すると繰り上がる。"},{"id":"q_daily","unlockStage":4,"majorCategory":"クエスト","minorCategory":"依頼掲示板","title":"毎日の依頼","body":"旅の扉のほこらに「依頼掲示板」が1つずつある。右クリックで、その日の依頼3件(討伐・納品・契約)が見られ、ゲームの1日(遊んでいる時間で20分)ごとに入れ替わる(人ごと・寝ても進まない)。⏎依頼は掲示板のある世界のランクで出る: 討伐の相手はそのあたりの魔物、納品の品はそのランクの魔物が落とす素材。ちがうランクの世界の掲示板を見ると、まだ何も進めていなければ、その世界のランクの依頼に入れ替わる。⏎報酬: ゴールドは その世界の魔物 討伐=3体ぶん×倒す数・納品=8体ぶん・契約=10体ぶん(低いランクでも3件で2,034G以上)、品は 討伐=素材1・納品=鉱石・契約=ペットのごはん1。3件そろうと福引券のかけら3と、魔物10体ぶんの経験値。"},{"id":"q009","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"ちいさなメダル","body":"小さなメダルは世界に全部で300枚。ランク1〜12の世界に25枚ずつ、建物の中や城下町(5枚ずつ)などの決まった所に「メダルのありか」として隠されている(地面すれすれの床の光。キラキラと同じ白金の光で、輪と星が少し大きく強い)。⏎右クリックで取れる(1人1回ずつ・マルチでは1人ずつ300枚見つけられる)。取ると「小さなメダルを見つけた！(○/300)」。見つけた所は、うすい灰色の輪と小さな星だけの「光の跡」になる。⏎ほかの手に入れ方は無い(宝箱・魔物・依頼・すごろく・鉱石からは出ない)。見つけた数はDQMメニューの図鑑の『小さなメダル』で世界ごとに見られる。⏎見つけた数は減らず、はじまりの神殿の北西の島「メダル王の城」のメダル王のスタンプラリーが進む。"},{"id":"h187","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"メダル王","body":"メダル王は、はじまりの神殿の北西の旅の扉から行く「メダル王の城」の2階の玉座の間にいる。スタンプラリーだけ。⏎メダルは渡さない。見つけた小さなメダルの数(減らない)が、5枚から300枚までの決まった枚数(5の倍数)に届くと、44品のごほうびを1つずつ「受け取る」でもらえる(1人1回・ランクやマスターランクの条件は無い)。だいじなもの26品(光のたいまつ・メダル王の王冠・キメラのはね飾り・スライムのかんむり・魔物の言葉の辞書・盗賊の鼻かざり・王家のコイン袋・おどりこの靴・水竜のうろこ・風のマント・なつきの鈴・魔物のよびこ・鍛冶神の金槌・さとりの書・ゴールドカード・魔物の首飾り・配合の秘伝書・いやしの角笛・反撃の盾かざり・祈りの指輪・不思議な帽子・号令のラッパ・世界樹のしずく・勇者のしるし・やまびこのぼうし・星降りの杖)と、隼の剣・メタル系のタマゴ・メタルキングの装備など。⏎だいじなものは持ち物か袋の中にあると効く。品には持ち主と番号が記され、効くのは自分の品の今の番号のものだけ(ほかの人の品や、受け取り直す前の古い品は効かない)。なくしたら同じ画面でゴールドを払って「受け取り直す」(値段は「受け取れる見つけた数×500G」・受け取り直すと前の品は力を失う)。世界樹のしずくは、使ったときだけ1日たってからただで返してもらえる。⏎前の「景品の交換」の品(フォーメーション4・5・施設の生成アイテム14種・アンルシアのオブジェとフィギュア・ハンサムスカーフ・暴走のカード)はカジノの景品になった。⏎前の「証の交換」はやめた(一度ダーマに渡した証は、防衛戦のメダルの交換所の「職業の証」で手に入る)。⏎ごほうびにマウスを乗せると、名前と効き目が見える。まだ届いていないごほうびは次の3つまで中身が見え、それより先は「？？？」。"},{"id":"q010","unlockStage":4,"majorCategory":"クエスト","minorCategory":"お店の依頼","title":"鍛冶依頼","body":"武器屋にしゃがみ右クリックで受注。ゲームの1日(遊んでいる時間で20分・寝ても進まない)ごとに3件、作ったことのあるレシピから出題される。品物を手に持ってもう一度しゃがみ右クリックで納品。報酬は鍛冶用の値(お店の売値とは別)の2倍×個数。まれに鍛冶の秘伝書ももらえる。"},{"id":"q011","unlockStage":4,"majorCategory":"クエスト","minorCategory":"お店の依頼","title":"出荷依頼","body":"道具屋にしゃがみ右クリックで受注。ゲームの1日(遊んでいる時間で20分・寝ても進まない)ごとに3件、ペットが収穫したことのある作物から出題され、品物を手に持ってもう一度しゃがみ右クリックで納品するとゴールドに。まれに農業の秘伝書ももらえる。"},{"id":"f001","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"必要なもの","body":"釣り竿とルアーがいる。どちらも鍛冶で作れる(伝説の竿とルアーは魚図鑑100%のごほうび)。⏎ルアーは持ち物のDQMタブのルアー枠に入れる。64個まで入る。⏎竿を持って、8マス以内の水に向けて右クリックすると釣りが始まる。"},{"id":"f002","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"投げてから当たりまで","body":"おもりが沈んでいくあいだ待つ(底に着くと自動で投げ直す)。⏎水中に光る「当たり」が出たら左クリックでアワセる。遅すぎると逃げられる。⏎ニセの当たり(フェイント)も混じる。ニセでクリックしても逃げないが、魚が警戒して寄り直す。⏎深い所では宝箱がかかることもある。"},{"id":"f003","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"ルアーの役割","body":"ルアーごとに攻撃力と、かかりやすい相手(小魚/大物など)が違う。⏎狙いたい相手に合ったルアーを使う。⏎1回釣るたび(逃げられても)に1/10で壊れる(伝説のルアーは壊れない)。壊れたら次の1個が自動でセットされる。"},{"id":"f004","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"目押しバー","body":"かかったら左クリックでバーの当たり枠に合わせる。⏎真ん中の「芯」で決めると大きく削れる。⏎3回失敗すると逃げられる。上位の竿ほどバーが遅くなって狙いやすい。"},{"id":"f005","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"糸の張り","body":"体力バーの下が糸の張り。振り切ると糸が切れて逃げられる。⏎8割から赤くなる。逆に3秒たるませ続けても外れる。⏎何もしなければ少しずつ緩む。「削る」と「休める」の判断が要る。"},{"id":"f006","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"リールを巻く","body":"スペース長押しで巻く。体力を削って魚を寄せられる。⏎そのかわり糸の張りが増え続けるので、巻きっぱなしは切れる。"},{"id":"f007","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"連打","body":"魚が暴れたときに稀に発生する。⏎制限時間内に左クリックを規定回数押し切る。残り秒数が画面に出る。⏎押し切れないと逃げられる。押すたびに体力が1ずつ削れる。"},{"id":"f008","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚のクセ","title":"逃げる・暴れる・潜る","body":"住んでいる場所と大きさで動きが変わる。⏎逃げる(小魚)=たまに走り出してバーが2倍速。⏎暴れる(大物)=当たり枠が速く動き、そのあいだ芯が消える。⏎潜る(深海)=放っておくと底まで潜られて糸が切れる。目押しを当てると引き戻せる。"},{"id":"f009","unlockStage":4,"majorCategory":"釣り","minorCategory":"ヌシ","title":"ヌシとは","body":"バイオーム帯ごとに1種、計8種いる大物。⏎大物・モンスター狙いのルアーで、ランク7以上の世界でまれ(1/40)に出る。⏎体力が元の魚の3倍あり、削るたびに動きが変わる。"},{"id":"f010","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚交換所","title":"魚をポイントに換える","body":"釣った魚を魚ポイントに換えて、素材や道具と交換できる施設。ポイントは魚を渡したときに入る(釣ったときには入らない)。⏎品物は、その品が手に入るランクの世界へ行ったことがあると交換できる(足りない品は暗く出る)。⏎持ち物の魚・袋の魚をまとめてポイントに換えるボタンがある。まだのお題に使える魚は残す。"},{"id":"f012","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚交換所","title":"釣りのお題","body":"魚交換所の「釣りのお題」の面で、毎日3つのお題「○○を○cm以上」が出る。お題の魚を持って「渡す」を押すと、その魚が釣れはじめるランクのレア素材2つと、渡した魚の魚ポイントの3倍がもらえる。⏎3つとも渡すと「釣り名人のしるし」が1つ。しるし10個で水の魔物のタマゴ(マスターランクまで)。3つ渡し終えると、ゲームの中の次の日(遊んでいる時間で20分ごと・寝ても進まない)に新しいお題が出る。終わっていないお題は日をまたいでも残り、「お題を変える」で1日1回だけ新しくできる。⏎ランク7以上の世界へ行ったことがあると、週1回の大物のお題(ヌシを1匹)も出る。ごほうびはしるし3つと魚ポイント3倍、はじめての1回は海の証。"},{"id":"h214","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"福引(タマゴくじ)","body":"福引屋に福引券を持って話しかけると回せる(しゃがむと10連・しゃがんで走ると全部)。券は魔物がまれに落とす(1/500)。⏎出た玉の色でタマゴの配合ランクが決まる: 金 S(0.3%)・銀 S〜A(1.2%)・赤 B〜C(4%)・青 D〜E(10%)・緑 F〜G(25%)・白 H〜I(40%)。紫(5%)はまだ記していない装備の設計図1枚(行った世界のランク+1まで)。黒(14.5%)は福引券のかけらで、10個で福引券1枚。⏎タマゴはマスターランク+2のランクまで(いちばん上は S)。それより上の色の玉は、出せるいちばん上のランクのタマゴになる。金と銀の玉には、フォーメーション6・7やゴールドチケット・メタルチケットのおまけも付く。ふつうの魔物だけで、メタル・転生・魔王・超レアのタマゴは出ない。⏎S 以上のタマゴは、マスターランクがそのランクに届くまでかえらない(とっておけば、届いたときにかえせる)。"},{"id":"h_fukubiki_trip","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"出張福引屋","body":"ランクの世界の野外(町・城・ダンジョン・建物の外)を歩いていると、ときどき近くに「出張福引屋」が来る(1人あたり遊んでいる時間で60〜90分に1回ほど・同じ世界に1人まで)。来ると「どこからか 福引の 鐘の音が きこえる…」と知らせが出て、ミニマップに印が付く。⏎話しかけると、ふつうの福引屋と同じく福引券で回せる。だれが回しても合わせて10回で「本日の出張は おしまい！」と帰る。10回に届かなくても、来てから20分たつか、呼ばれた人が200マス以上離れると帰る。"},{"id":"f011","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚図鑑","title":"記録","body":"釣った魚は魚図鑑に記録される。大きさの記録も残る。⏎ヌシは通常の魚のあとに並ぶ。"},{"id":"s001","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"特殊効果とは","body":"一部の武器・防具・アクセサリには、攻撃力とは別の効果が付いている。⏎効果は鍛冶画面の「効果」欄と、アイテムの説明に出る。"},{"id":"s002","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"効果の種類","body":"種族特効(ゾンビ・ドラゴン・悪魔・魔獣・メタル・物質などに2倍)・ボス特効⏎属性攻撃(炎・氷・風・雷。相手の弱点と合えば2倍)⏎状態異常(毒・眠り・マヒ・マヌーサ・ヘナトス・鈍足)・即死・2回攻撃・追撃・会心率アップ・守備を一部無視・HP吸収⏎HP/MPの自動回復・耐性・解毒⏎透明・暗視・経験値アップ・速度アップ⏎呪われた品には、混乱・守備半分などの悪い効果もある"},{"id":"s003","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"呪文が撃てる武具","body":"右クリックでメラ・ギラ・ヒャダルコ・バギクロス・ライデインを撃てるものがある(竪琴はしゃがみ右クリック)。⏎撃てるのは約1秒に1回(メラ・ライデインは0.9秒、ギラ・ヒャダルコは1秒、バギクロスは1.1秒。耐久は減らない)。"},{"id":"s004","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"セット効果","body":"同じ種類の防具(頭・胴・腕・足)をそろえるとセット効果が出る(例: ロト・天空・賢者・武闘・プラチナなど37組)。⏎4点のセットは2点以上で半分・4点で全部。同じ名前の盾があるセット(皮・鋼・戦士・魔法・プラチナ・メタルキング・ロト・錆びたロト・天空)は盾も1点に数え、盾まで5点そろうと1.5倍。⏎2点のセット(旅人・絹・あぶない水着・しあわせ・スライム)は2点で効く。効果は防具の説明の「セット「〇〇」」に出る。⏎サークレット・ねこみみバンドの「(防具4点で発動)」は、どのDQMの防具でも4つ身につけると効く。"},{"id":"s005","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"特殊効果の武器(各種類5本)","body":"20種類の武器に、特殊効果の付いた武器が5本ずつある(100本)。強さはそのランクのお店のいちばん強い武器より少し弱いかわりに、効果が1〜2つ付く。⏎◆ランク2・4の武器: 設計図を手に入れて鍛冶で作る。⏎◆ランク6の武器: ランク6以上の中ボスをはじめて倒したときに1本。⏎◆ランク9の武器: ランク9以上のダンジョンの名品の宝箱を開けたときに1本。⏎◆ランク11の武器: 設計図を手に入れ、魔王の素材(邪竜の逆鱗)を使って鍛冶で作る。⏎もらえる武器は、まだ持ったことのないものから先に選ばれる。お店では売っていない。⏎杖には右クリックでラリホー・マヒャド・ベホマラーを唱えられるものもある。"},{"id":"s006","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"本家の防具と大戦記の防具","body":"本家のドラゴンクエストにある防具を64品足した(頭16・体23・腕9・足9・盾7)。⏎◆防具屋のランクの品: ぬののふく・くさりかたびら・てつのまえかけ など(設計図があれば鍛冶でも作れる)。⏎◆設計図で鍛冶: てつのよろい・まほうのよろい・グレートヘルム・せいきしのよろい など。ひかりのよろい・ゆうしゃのたて などは魔王の素材を使う。⏎◆ダンジョンの金の宝箱(ときどき): ミンクのコート・あくまのよろい・ステテコパンツ など。⏎◆ダンジョンの名品の宝箱: はぐれメタルの防具・ひかりのドレス・ミラーシールド など(その宝箱のランク以下の品から)。⏎◆中ボスをはじめて倒したとき: だいちのよろい・おうじゃのマント・オルテガのかぶと・だいちのたて(その中ボスのランク以下の品から)。⏎◆あくまのよろい・まじんのよろいは呪われている(守備は高いが、いつも混乱する／受けるダメージ1.5倍)。⏎◆新しいセット: 鉄・青銅・聖騎士・天使・はぐれメタル・光・大戦記。勇者とミスリルのセットには盾が加わった。⏎◆大戦記の兜・鎧・小手・靴: 赤と金の伝説の防具。ランク12の設計図で鍛冶。4つそろうと攻撃力+8%・会心率+4%・受ける物理ダメージ-10%。⏎◆魔法系と軽装の防具(43品): 魔法の衣は守備が低いかわりに魔法守備が高く、MP回復や呪文の軽減が付く。軽い防具は身軽で、移動速度アップなどが付く。⏎◆魔法系のセット: まどうし(盾つき)・やすらぎ・めがみ(女神の盾も入る)。呪文の威力・回復量・詠唱時間・MPがよくなる。⏎◆軽装のセット: とうぞく・しのび・しっぷう。みかわし・会心率・移動速度が上がる。⏎◆防具屋のランクの品・設計図・金の宝箱・名品の宝箱で手に入る。"},{"id":"h180","unlockStage":4,"majorCategory":"アイテム","minorCategory":"銃","title":"銃と銃ユニット","body":"銃は魔導銃士の武器。持ち物の「銃ユニット枠」に入れたユニットで型が決まる(空ならハンドガン。ユニットを手に持って右クリックで入れかえ)。左クリックで撃つ。⏎ハンドガン=素直な単発 / ライフル=左クリックで構えている間は10倍スコープの精密射撃 / ショットガン=散弾10発 / マシンガン=押している間連射 / マグナム=一撃が重く次弾まで長い。"},{"id":"h181","unlockStage":4,"majorCategory":"アイテム","minorCategory":"銃","title":"リロードと改造","body":"弾切れで自動リロード、右クリックで手動リロード。⏎鍛冶場(金床)の「銃ユニット改造」で、銃ユニット枠のユニットの威力・装弾数・溜め時間・リロード・安定性を+10まで鍛えられる(素材は段ごとに鉄鉱石〜ヘビーメタルを20〜65個)。安定性は1段ごとに照準中の手振れと発砲反動を5%軽減し、+10で半減する。"},{"id":"h182","unlockStage":4,"majorCategory":"アイテム","minorCategory":"銃","title":"ヘッドショット","body":"銃弾と矢がモンスターの頭を通ると、ダメージが2倍になる。⏎頭の位置はモンスターごとに決まっている。狙いにくい相手はライフルのスコープで。"},{"id":"h120","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"宝箱でも同じ収納","body":"大きな袋と同じ540枠の収納が、置ける宝箱としても作れる(鍛冶)。⏎超大きい宝箱(赤・1枠64)→特大の宝箱(紫・1枠999)→無限の宝箱(金・1枠9999)の順に強くなる。大きい宝箱9個から順に作っていく。⏎その先に無限の宝箱II〜VI(前の箱4個から・1080〜17280枠)もある。中身が残っている宝箱は壊せない。"},{"id":"h121","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"宝箱と袋のやりとり","body":"宝箱の画面の右下に袋を置く枠がある。⏎ボタンで中身をまとめて出し入れできる。⏎「全部」以外のタブを開いていると、そのタブのアイテムだけが対象になる。検索中は、検索に合う品だけが移る。⏎DQMの宝箱・大きい宝箱・討伐の宝箱とチェストの画面も、『見た目』で王家の紋章と今の見た目を切りかえられる(メニューが「新」のとき)。"},{"id":"p001","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"働かせて育てる","body":"部屋の手伝いや建築の机で働いているあいだ、ペットに経験値が入る(2秒に1)。⏎部屋ごとに1分あたりの上限があるので、頭数を増やしても伸びる速さは変わらない。"},{"id":"p002","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"手伝いの子が気絶していたら","body":"部屋の手伝いの子は倒されない。気絶している子は手伝いに付けられない(先にベルから出して、せかいじゅの葉かザオ系で起こす)。⏎前の防衛用ポートは 0.35.61 でやめた。"},{"id":"h122","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"バイオームのランク","body":"画面のバイオーム名の横に「(ランクN)」と出る。⏎ランクはいる世界で決まる(ランクNの世界とその別の世界はランクN)。はじまりの神殿・決戦の異空間・メタル迷宮では出ない。⏎ランクが高い世界ほど、強いモンスターと良い鉱石・宝が出る。"},{"id":"h197","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"天候","body":"昼夜のあるランクの世界では、天気が変わる。⏎朝の霧(遠くが見えにくい)・花吹雪(草原や森の昼)・オーロラ(寒い土地の夜空)。雨のあいだ、砂漠の土地は砂嵐、雪の土地は吹雪になる(吹雪の空の下では歩くのが少し遅い)。⏎赤い月の夜(8晩に1回ほど): 魔物が多く・強く(1.2倍)なり、落とし物が+50%。寝て夜を早めても、赤い月の夜とオーロラの抽選は前の夜から遊んでいる時間で約17分たつまで行わない(朝の霧・花吹雪・流れ星も同じ)。"},{"id":"h_fog_level","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"天候の見通し","body":"霧・砂嵐・吹雪で遠くがかすむ見た目と舞う粒は、DQM設定「見た目・演出」の『天候の見通し』で ふつう／うすい／なし から選べる。⏎変わるのは自分の画面の見え方だけ。天候そのものと、天候の魔物はそのまま出る。"},{"id":"h_spell_fx","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"呪文の光の量","body":"DQM設定「見た目・演出」の「呪文の光の量」で、自分・仲間のペット・勇者が唱えた呪文と特技の光の粒を ふつう／半分／少なめ(4分の1)にできる(一人称で呪文を続けて唱えると前が見えにくいとき)。敵の呪文と予告の円は減らさない。はじめは ふつう。"},{"id":"h_weather_rare","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"天候の魔物","body":"霧・砂嵐・吹雪・雪・雷雨・雨・赤い月の夜・オーロラ・花吹雪・雨上がりの虹・流れ星のときだけ、配合ランク S 以上のめずらしい魔物が現れることがある(配合ランク S の魔物はランク4の世界から・SS はランク7から・SSS はランク10から・それより下の配合ランクの魔物はどのランクの世界でも・強さはその土地で決まる・ふつうより手ごわい)。⏎天候が始まって30秒ほどたつと、天候1回ごとに3回に1回ほど、近くに「霧の中に 何かの気配がする…」と知らせが出る(その天候の中にいるときだけ)。雨は少し弱まっただけでは終わらず、30秒やんだら終わる。その方角を探そう。天候が終わると去ってしまう。⏎倒すとその世界のランクのレア素材が必ず1つ、まれにその魔物の装備も落とす(その世界のランクより2つ以上強い装備は、その世界のランクの品になる)。スカウトもできる(マスターランクの決まりどおり)。図鑑の「天候」の行で、どの天候で会えるか分かる。"},{"id":"h198","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"魔物の落とし物","body":"ふつうの魔物は、倒した世界のランクと魔物の系統で決まる素材を落とす(通常の素材は1/5・レアな素材は1/30)。⏎魔物ごとに決まった装備も、1/1000で落とす(その世界のランクより2つ以上強い装備は、その世界のランクの同じ店の品になる。盗んだときも同じ)。⏎落とし物が出るのは、倒した人(ペットなら飼い主)がいて、放置中でないとき。⏎防衛戦の敵は、何も落とさない(経験値とゴールドだけ)。⏎素材の手に入れ方は、DQMメニューの一覧表の『素材取得一覧表』で見られる。"},{"id":"h199","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"DQM鉱石","body":"DQM鉱石はランクの世界でだけ掘れる(オーバーワールドには無い)。⏎はじめて出る世界: ランク1 鉄・命・溶岩・磨き砂・星・鏡 / 2 氷・爆弾 / 3 ルビー・プラチナ / 4 月・ミスリル / 5 時・メタル / 6 太陽 / 7 光。その世界の装備を作るのに要る鉱石は、その世界で掘れる。⏎鉱石ごとに掘れる高さが違う。DQMメニューの一覧表の『鉱石取得一覧表』で見られる。"},{"id":"h200","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"放置対策","body":"放置狩り・トラップタワー狩りを防ぐしくみがいつも働いている。⏎移動キーで自分で横に5マス以上動かないと「移動した」と数えない(流れている水・溶岩の中や乗り物で動いたぶん・その場の足踏みは数えない。流れていない水の中で泳いだぶんは数える)。押している移動キーの向きとちがう向きへ運ばれたぶん(ピストンの往復機など)も数えず、最近「移動した」3か所の近くへ戻っただけでも移動に数えない。⏎移動のほかに、次の行いも「動いた」に数える: 向きを変えながら自分で攻撃・呪文・特技・必殺技を使う(同じ向きのままの連打は数えない・ペットだけの攻撃も数えない)、鍛冶・農園の管理盤・お店の売り買い・スキルパネル・錬金・配合などの操作(画面を開いただけは数えない)、最近の3か所から3マス以上離れた所でブロックを壊す・置く(同じあたりのくり返しは数えない)。防衛戦の戦場の中で戦いの最中は、向きを変えなくても攻撃や呪文を使えば数える(1分動かないと終わる決まりも同じ)。⏎30秒動かないと、まわりに魔物が湧かない。3分動かないと、倒しても経験値・ゴールド・落とし物・主の証が出ず、スカウトアタックもできない。ペットも攻撃しなくなる。⏎ログアウトして入り直しても、動いていない時間は続きから数える(ログアウトしていた間も数える)。飼い主がログアウトしているペットも攻撃しない。⏎決戦の異空間の魔王の間・ランク12の魔王の塔・防衛戦の戦場の中では、動かずに戦っても経験値などは減らず、ペットも戦う(魔物が湧かないのは同じ)。⏎落下・溶岩・窒息・プレイヤーのでない爆発・雷・ウィザーなどで最大HPの半分以上を削られた魔物は、経験値・ゴールド・落とし物を出さない。⏎魔物が重なって詰まると消える。DQMの魔物の卵はスポナーに使えない。"},{"id":"h137","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットとは","body":"ペットの動きを自分でルールにして組む仕組み。⏎1枚のルールは『対象＋条件1＋条件2＋行動』の4つでできている。⏎上から順に見て、最初に当てはまった1枚だけを実行する。並べ替えがそのまま戦い方になる。⏎行動の『指定した呪文』『指定した特技』は、組み込むときにそのペットが覚えている呪文・スキルで覚えた特技(人間の仲間は職業の技)から1つ選ぶ。この2枚は店では売っておらず宝箱から出る(一度手に入れれば道具屋に10000Gで並ぶ)。"},{"id":"h138","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"使いはじめ方","body":"Zメニューの『ガンビット編集』を開く。近く24マスに自分のペットがいるときだけ組める。⏎画面右上の『さくせんをガンビットにする』を押すと、そのペットがルールで動くようになる。⏎もう一度押すと元のさくせんへ戻る。押した時点で待機だったペットは追従に起こす。"},{"id":"h139","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"組み方の手順","body":"右の4列(対象/条件1/条件2/行動)から1つ選び、左のルール欄をクリックして置く。⏎置いてあるガンビットは左クリックで持ち上げて別の場所へ移せる。右クリックで外して手元に戻る。⏎各行の右端にある▲▼で、そのルールの優先順位を入れ替えられる。"},{"id":"h140","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ルールの枚数","body":"使える枚数はペットのレベルで増える。Lv1で3枚、Lv99以上で12枚。⏎枠を超えたぶんは保存されない。配合や転生で生まれた子は枠がLv1ぶんに戻るので、親のルールは引き継がず、組んであったガンビットは飼い主の手元へ返る。"},{"id":"h141","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットは装備","body":"ガンビットはアイテム。1つのスロットに置くと1個消費し、外すと戻ってくる。⏎同じ種類を数だけ持っていれば、何匹にでも同じルールを組める。⏎持ち物・大きな袋・10マス以内のチェストの中身も数に入る。"},{"id":"h142","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"対象の選び方","body":"『自分』はペット自身、『主』は飼い主のこと。⏎味方とペットは同じ飼い主の他のペット、パーティは同じパーティの人。⏎敵は種族・メタル系・魔王系・きらきら個体などで絞り込める。"},{"id":"h143","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"条件の噛み合わせ","body":"条件1には『条件2が要るもの』と『要らないもの』がある。⏎HP・MPには◯%以下、距離には◯マス以内、数には◯体以上、というように種類の合うものだけ組める。⏎噛み合っていない行には赤い×が出る。×にマウスを乗せると理由が読める。"},{"id":"h144","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"受け皿を置く","body":"どのルールにも当てはまらないと、ペットはその場から動かない。⏎一番下に『主／常に／追従』のような受け皿を1枚置いておくと、平時はついて歩くようになる。⏎例: HP50%以下なら追従 → 敵がいれば戦う → それ以外は主について歩く。"},{"id":"h145","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"待機で止まる","body":"ペットを『待機』にしている間、ガンビットは丸ごと止まる。休ませたいときは待機にすればよい。⏎攻撃・追従・迎撃のときはルールで動く。⏎ガンビット中は『対象の強さ』の絞り込みと、性格による逃げ腰を無視してルールを優先する。"},{"id":"h146","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"型とマイセット","body":"編集画面の下にある『型・マイセット』から、組んだ内容を名前を付けて30個まで保存できる。⏎保存した型は他のペットにも流し込める。『コピー』『貼り付け』で1匹ぶんだけ写すこともできる。⏎こちらで用意した型(アタッカー・ヒーラー・ほじょ・かべなど7種)も同じ場所から呼び出せる。"},{"id":"h146b","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"かばう","body":"行動『かばう』は、守る相手をねらう一番近い敵との間へ入り、6マス以内なら敵から受けるダメージを全部ペットが代わりに受ける。ペットが受けるのは、守る相手の守備や軽減で減らす前のダメージ(ペット自身の守備で減らす)。⏎落下・毒など、敵から来ないダメージはかばわない。放置中の人のペットはかばわない。"},{"id":"h146c","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ダンジョンの中","body":"魔王の城・中ボスの拠点・目玉の建物・施設のダンジョン・ランダムダンジョンの中では、ガンビットの宝箱とブロックの行動(開ける・壊す・掘る・階段掘り)を使わない。⏎ダンジョンの宝箱(名品の宝箱も)は自分で開けよう。"},{"id":"h147","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"働かせる","body":"対象に『木材・石材・土・砂・砂利・草ブロック・鉱石・育った作物』を選び、行動を『壊す』にすると採ってくる。宝箱は『開けて片付ける』。階段掘り・横穴掘りもある(向きは東西南北の対象で決める)。⏎『ドロップアイテム』＋『回収して渡す』にすると、落ちている物を拾って飼い主へ渡す。⏎渡し先は自動回収ONの大きな袋→持ち物→足元の順。伐採役と回収役を並べると流れ作業になる。"},{"id":"h148","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"働かせるときの決まり","body":"掘る対象は、行けると分かった場所だけを狙う。埋まったブロックや届かない場所は選ばない。⏎土・砂・砂利・石材・作物は飼い主の高さ±1マスだけを見る。木材は下8マス・上24マス、鉱石と宝箱は上下8マスまで見る。⏎ブロックを置けない場所(魔王の間など)や守られた場所では壊さない。"},{"id":"h149","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットの集め方","body":"宝箱から出る。色が良いほど出やすい(赤30%/黒40%/青50%/緑60%/紫70%/金80%)。⏎道具屋では『敵(全て)』『常に』『たたかう』『待機する』『北』『南』『東』『西』を1000G、『味方』『主』『自分』『50%以下』『50%以上』を5000G、『追従』『迎撃』を10000Gで売っている。一度手に入れたガンビットも10000Gで並ぶ。⏎まずは店で最初の1枚を組み、足りないものを宝箱で集めるとよい。"},{"id":"h150","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"キーの一覧","body":"Z=DQMメニュー(職業・魔法・ペット・設定・図鑑の入口)。⏎J=まわりのペットへの一斉指令(待機→攻撃→迎撃→追従)／Shift+J=さくせん変更。G=モンスターロードの指揮の合図。⏎N=袋スロット1の袋を開く。左Alt=フリーカメラ(ライド中と三人称で使える)。⏎ペットのクリック判定・袋の自動回収・ステップ・ホットバーの段送り・特技の専用キー・ライドのキーは、はじめは割り当てなし。使うならキー設定で決める。⏎1匹ずつのさくせん・つかう呪文・狙う相手の強さは、DQMメニューの『ペット一括命令・装備編集』で変える。"},{"id":"h151","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"呪文と特技の使い分け","body":"呪文も特技も、DQMメニューの『魔法・特技ホットバー編集』で登録し、Shift+ホイールで選ぶ。⏎呪文: 杖なら左クリック長押しで溜めて離すと唱える。杖以外の武器ならShift+左クリックで溜めて離す。素手では唱えられない。⏎特技: 対応する武器を持ってShift+左クリック。⏎使えないときは、スキルパネルで取っていない・武器の種類が違う・MP(HP)が足りない、のどれか。"},{"id":"h153","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ペットが言うことを聞かない","body":"まず『さくせん』を見る。かいふくにまわれ・みをまもれ・めいれいさせろは自分から敵を探さない。⏎『待機』にしていると、その場から動かず、ガンビットも止まる。連れ歩ける数を超えた子も待機になる。⏎ペット一括命令の『狙う相手の強さ』が弱い相手だけになっていると、格上を無視し続ける。⏎3分動いていない(放置中)と、ペットは敵を狙わない。スカウト中の相手には、判定が出るまで手を出さない。"},{"id":"h154","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ペットが見当たらない","body":"50マス以上離れると、自動収納ONのペット収納ベルへ入る。ベルを開けば戻せる。⏎世界に出せるのは50匹まで。超えたぶんは自動でベルへ入る。⏎倒れたペットも、自動収納ONのベルに空きがあれば自動で入る。入れなかった子はその場に残るので、ザオ系かせかいじゅの葉で起こす。⏎読み込まれていない所で見失ったペットは、DQMメニューの『ペット一括命令・装備編集』の『見失ったペット』からベルへ呼び戻せる。"},{"id":"h_pet_backup","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"いなくなった仲間を戻す","body":"仲間は5分ごとに控えが取られ、遊んでいる時間で1時間ごとと、ゲームを終えるときに保存される(3回分)。仲間がどこにもいなくなったときは、DQMメニューの「仲間」→「ペット」→『いなくなった仲間を戻す』で「控えから戻せる」の子を押すと、最後に一緒だったときの姿でペット収納ベルへ戻る(何回でも・空きのあるベルが要る)。逃がした子・配合に使った親・対人戦で渡した子は戻せない。戻した子の古い写しがどこかに残っていても、出てきたときに消える。"},{"id":"h_bag_backup","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"なくした袋を戻す","body":"大きな袋は5分ごとに控えが取られ、遊んでいる時間で1時間ごとと、ゲームを終えるときに保存される(3回分)。袋をなくしたときは、DQMメニューの「自分」(旧メニューは「基本」)の『なくした袋を戻す』で袋を選び、「はい」を押すと中身ごと持ち物へ戻る(持ち物の空きが1つ要る)。出てくるのは、最後に持っていたのが自分で、中身の入っている袋だけ。チェストにしまった袋も「なくした」に出るが、戻すと元の袋は「控えから戻したので使えない」袋になり、開けない・自動回収しない・売れない・素材にできない。ほかの人に渡した袋・売った袋・空の袋は戻せない。"},{"id":"h155","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"作れるものが増えない","body":"鍛冶のレシピは、はじめから全部見える。灰色のレシピは鍛冶Lvが足りない。⏎鍛冶Lvは、鍛冶場の手伝いの鍛冶の力の合計×12(上限1500)。鍛冶の力の高いペットを手伝いに付けると上がる。行ったことのある いちばん高いランク×100＋150 が上限なので、届かないときは先のランクの世界へ進む。⏎素材が足りないときは、素材の行を押すとその素材の作り方へ飛べる。"},{"id":"h156","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"呪文・特技をおぼえない","body":"呪文も特技も、スキルパネルのマスで取って覚える。レベルが上がると増えるのはSPだけ。⏎取ったマスは職業に関係なくいつでも使える。特技は対応する武器が要る。⏎マスが灰色で取れないときは、解禁の条件が足りない。その職業の最高到達Lv・武器の熟練度(武器Lv)・魔法の熟練度(魔法Lv)が要る技がある。マスを選ぶと「解禁: 戦士 Lv130(今 95)」のように足りないものが出る。熟練度は DQMメニュー「基本」の「武器の熟練度」で見られる。⏎魔法・特技ホットバーに登録していないものは使えない。DQMメニューの『魔法・特技ホットバー編集』で入れておく。"},{"id":"h157","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ダメージが通らない","body":"メタル系には呪文が効かず、ふつうの攻撃も5回に1回しか当たらない(1ダメージ)。⏎効くのは、メタル系の武器(いつも2ダメージ)、メタル特効の特技(2ダメージ)、どくばり(1ダメージ・まれに一撃)、即死の武器、会心の一撃(一撃で倒す)。⏎守備の高い相手には、攻撃力を上げるか、バイキルトなどで補うとよい。"},{"id":"h158","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"持ち物がすぐ一杯になる","body":"大きな袋を持つと、周りに落ちた物を自動で吸い込む。⏎何でも入って困るときは、袋の画面のレ点ボタンで種類を選ぶ。『全部』を外して必要な種類だけ入れられる。『現物登録』で袋の中の品を登録し、登録品だけ・登録品を除く、もできる。⏎袋には『名』ボタンで名前が付けられる。素材用・建材用と分けて持つと探しやすい。"},{"id":"h159","unlockStage":1,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"どんな遊びがあるか","body":"カジノ(スロット・ブラックジャック・ポーカー・トランプ・テトリス・モンスターくずし)、モンスター格闘場(賭けて観戦)。⏎すごろく場(券を使って進む双六。仲間と順番に遊べる)、魚交換所。釣りは水があればどこでもできる。⏎コロシアム(ペットの勝ち抜き)は、はじまりの神殿の闘技場の島で司会に話しかけて挑む。⏎施設は施設アイテムを建築の机で建てる。ランクの高い世界ほど見た目が豪華になる。カジノは施設アイテムの段(Rank1〜3)で中身が変わる。"},{"id":"h160","unlockStage":2,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"すごろく場","body":"すごろく券を1枚使って参加する。マスの効果でアイテム・ゴールド・戦闘が起きる。⏎パーティを組んでいれば全員に知らせが飛び、同じスタートを踏んだ人と順番に遊べる。⏎会場のランクが高いほど、もらえる品と出る敵が強くなる。ESCでいつでも切り上げられる(券は戻らない)。⏎券はカジノの景品か、紫・金の宝箱から。"},{"id":"h161","unlockStage":2,"majorCategory":"アイテム","minorCategory":"道具","title":"肉と捕獲","body":"肉を投げて食べさせると、その魔物はスカウトの成功率が上がる(最後に食べた肉だけ)。⏎まもののエサ1.25倍、くんせいにく1.5倍、ほねつきにく2倍、しもふりにく3倍。食べている間(約30秒)は上乗せ分が半分(しもふりにくなら2倍)で、食べ終わると満額。魔物は1割くらいで食べるのを嫌がる。⏎くんせいにく・ほねつきにく・しもふりにくは鍛冶で作れる(まもののエサは宝箱から)。⏎転生系とボス(各ランクの魔王など)、ボスオーラ付きは肉を食べない。メタル系は食べる。"},{"id":"h162","unlockStage":2,"majorCategory":"アイテム","minorCategory":"道具","title":"ペット収納ベル","body":"ペットをしまって持ち運ぶ道具。ペットを見てShift+右クリックでしまう(ペットを見ないで押すと周り20マスをまとめて)。⏎自動収納(はじめはON)にしておくと、離れすぎたペットや、上限を超えたぶんが自動で入る。⏎中のペットは倒れたままでも入る。神父に頼むか、出してからザオ系で起こす。⏎ベルの画面で中の子を選び、明細の「名前」の行を押すと、しまったまま名前を変えられる(空にすると種族名に戻る)。⏎ペット収納ベルは、死んでも持ち物から落とさない。"},{"id":"h163","unlockStage":3,"majorCategory":"アイテム","minorCategory":"道具","title":"ルーラとリレミト","body":"ルーラは登録した場所へ飛ぶ。ルーラの杖とキメラのつばさは、Shift+右クリックで今いる所を登録、右クリックで一覧を開き、ダブルクリックで飛ぶ(つばさは1個減る)。呪文のルーラは、Shiftを押しながら唱えると登録、ふつうに唱えると一覧。⏎一覧はランクごとの見出しでまとまり、見出しを押すとたためる。登録は1000か所まで。ダンジョンの中で登録すると、そのダンジョンの入口が登録される。ボスの祭壇(魔王の間へ行く祭壇)までたどり着くと、その祭壇の前が自動登録に入り、そこへは直接飛べる。魔王の城の入口の前に来ると、その入口も自動登録に入る。⏎バイオームの石板・建物の石板に触れると、その場所が「自動登録」に入る(一覧の『自動登録』ボタンで見る・1000か所の数には入らない・ダンジョンの奥の石板なら入口)。⏎一覧の名前の左の小さな色の点が行き先の種類(下に凡例): 黄土色=町・城(城と城下町・町・村そのもの)、赤茶=ダンジョン(魔王の城・中ボスの拠点・海底ダンジョンも)、緑=バイオーム、青=拠点(旅の扉のほこら・はじまりの神殿と島・マイホーム)、紫=施設・お店(武器屋などのお店・カジノ・ダーマ神殿・闘技場・小さな建物など)、灰=自分で登録(自分で登録した所は、町やダンジョンの中でもいつもこれ)。一覧の上の札(すべて・町・城・ダンジョン・バイオーム・拠点・施設・お店・自分で登録)を押すと、その種類だけを出す(選んだ札は覚えておく)。DQM設定「画面」の「ルーラの一覧」を「旧」にすると、色の点・凡例・しぼる札の無い前の一覧になる。⏎リレミトは地下から地上へ脱出する。DQM設定でパーティの仲間も一緒に飛ぶようにできる(ルーラの一覧の『仲間と飛ぶ：ON/OFF』でも切りかえられる)。近くのペット(10匹まで)はいつも一緒に飛ぶ。⏎【地図のピン】一覧の『マップ確認』の地図を右クリックすると、その場所にピンを立てる(1つの世界に10本まで・10色・空いている色から順に)。ピンを左クリックすると小さな窓が出て、名前(16字まで)・色の変更・消すができる。ピンは目印だけで、ルーラでは飛べない。ピンはミニマップ・ほこらの測量図・画面の上の方角の帯(道のりつき・DQM設定「表示」の「ピンを方角の帯に出す」で消せる)にも同じ色で出る。地図の外のピンは、その方向の地図のはしに小さく出る。⏎魔王の間では、戦っている間は使えない。⏎石板に触れたときの「自動登録」は、名前を変えた登録でも、同じ所(12マス以内)には もう一度 登録しない。"},{"id":"h213","unlockStage":4,"majorCategory":"アイテム","minorCategory":"道具","title":"メタル迷宮","body":"メタルチケットIIを使うと、その人だけの「メタル迷宮」へ行く(近くの人とペットも一緒)。出るのはメタル系だけ。チケットには「メタルチケットII（ランク〇）」のようにランクが付いていて、手に入れた世界のランク(宝箱はその世界・福引は引いた所の世界・ランクの無い世界はランク1)で決まり、あとから変わらない。前から持っていたチケットはランク1。⏎出るメタルの種類・レベル・経験値(そのランクのふつうの魔物の30体ぶんくらい)・メタルのかけらの数は、使ったチケットのランクで決まる。ランク1 ぷちメタル・メタルスライム 〜 ランク12 メタルスター・はぐれメタルキング。7割はそのランク、3割はそれより下のランクのメタル。迷宮の中で別のチケットを使うと、時間がのびて迷宮のランクもそのチケットのランクになる。⏎いられるのは10分(もう一度使うと10分のびる)。時間が来るか、まん中の旅の扉で、使った場所へ戻る。⏎メタルチケットIは、30分のあいだ経験値が3倍になる。"},{"id":"fl07","unlockStage":4,"majorCategory":"アイテム","minorCategory":"道具","title":"香り袋","body":"作業台で、花2〜3種と糸(まだらクモ糸か Minecraft の糸)から香り袋を作れる。右クリックで使うと、しばらく効く(効果の残り時間の欄に出る・死ぬと消える)。同じ香り袋は使い直すと時間がのびる(2倍まで)。違う香り袋は同時に2つまで。決戦の異空間・防衛戦の最中・闘技場の試合中は使えない。⏎月光(月光草・まんげつそう・雪原の白花): 夜目 5分／疾風(竜の牙草・レーベのきいろい花): 移動速度+15% 3分／聖なる(聖なる花・ホイミの花・妖精の花): まわり24マスに魔物が湧かない 5分(ダンジョンや魔王の城などの中は効かない)／実り(幸運の四つ葉草・アリアハンの野の花): 採集の場所の数+1・花を折ると10%でもう1本 5分／癒し(ホイミの花・ハート形の花・上やくそう): 10秒ごとに最大HPの2% 2分／精霊(精霊の花・魔力の花): 仲間のなつき度の増え方+50% 10分／幸運(幸運の四つ葉草・ソレッタのひまわり・サラボナの赤いチューリップ): 落とし物の率+10% 5分／魔界(魔界の黒バラ・悪魔の茨・魔界キノコ): まわりの湧く上限1.5倍 3分。"},{"id":"h_maze_town","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"迷宮の町","body":"ランク1の魔王を倒すと、はじまりの神殿の果てなき迷宮の扉から「迷宮の町」へ行ける。崖に囲まれた谷の宿場町で、魔物は湧かず、町のブロックは壊せない・置けない。⏎北の門の広場に門が4つ。「果てなき迷宮の門」の奥の旅の扉に乗ると迷宮に入る(扉を調べると入る前の支度)。迷宮から出ると、この門の前に戻る。⏎「不思議のダンジョンの門」はまだ準備中。両はしの2つの門は固く閉ざされている。門の前の石板・銀を調べると行き先が分かる。⏎町には宿屋・酒場(うわさの掲示板)・教会・道具屋・鍛冶屋・交換所(迷宮の交換所)・記録の番人(自分の迷宮の記録)などがいる。倉庫・鑑定屋・つぼ屋はこれから店を開く。⏎南の円い広場の旅の扉で、はじまりの神殿へ戻る。"},{"id":"h_endless1","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"果てなき迷宮のきほん","body":"300階の迷宮(2026-10-26 に1500階から作り直した)。本当の体(Lv・職業・スキルパネル・持ち物・装備・ペット・勇者)は預けて、Lv1・型の職業の はじめの武器(攻撃+5)だけを持ち、仲間なしで はじまる。装備は持ちこめない(武器と盾は中で拾う・頭・体・腕・足の防具と弓や銃は出ない)。浅い階でも魔物は手ごわく、2〜3体に囲まれると たおれることもある。⏎スカウトアタックは使えず、倒した魔物が ときどき仲間になる(配合ランクが高いほど なりにくい・ぬしは仲間にならない)。拾った品と中のゴールドで強くなりながら下りる。中のLvの上限は300。⏎下り階段に乗ると次の階。時間の制限は無い。迷宮の中では中断できない(中断の扉は無い・閉じたりログアウトしたりしても、次に入るとその階から続く)。魔物も50階ごとのボスも品を何も落とさない(品は宝箱・床の品・宝物庫・試練・店・キラキラから)。⏎【満腹度】迷宮の中では「満腹度」(はじめ100)が動いている間に少しずつ減る(30分ほどで0・放置中は減らない)。0になると1秒ごとにHPが減り、倒れることもある。床に落ちている パン(+50)・大きなパン(+100・おなかいっぱいで食べると上限+5〈200まで〉)・くさったパン(+30・ときどき毒)を右クリックで食べよう。迷宮の中ではマイクラの満腹は減らず、HUDの満腹のゲージに満腹度が出る。倒れたり迷宮を出たりすると次の回は100から。⏎迷宮の中ではルーラ・キメラのつばさ・リレミトは使えない。⏎階のつくり(2026-10-22): 大きな部屋を通路でつなぐ形。ときどきテーマの階(火山・氷・水没・墓所・図書館・吹き抜け・浮島)がまじり、床や置き物が変わる。浮島の階で落ちると、階のはじめに戻される(最大HPの15%)。⏎迷宮の中では画面が迷宮用になる: 上の帯に 地下何階・Lv・HP・MP・満腹・中のゴールド、左に仲間の札、下に できごとの知らせ(与えた・受けたダメージ、たおした、呪文、拾った品、罠、レベルアップなど)。ステータスの欄・ミニマップ・ペット一覧などは迷宮の中では出ない。3つとも GUI位置調整の「果てなき迷宮」で動かせる。⏎ふつうの階と店の階では、自分が動かないと時間が止まる(魔物・弾・落とし物・仲間も止まる。満腹度・状態異常の残り・回復の指輪・いそぎの階の時計も進まない。眠りで動けないときと魔物の弾が飛んでいる間は進む)。やすみの階・ボスの階と、今日の迷宮・試しの迷宮は今までどおり。"},{"id":"h_endless2","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"ボスの階","body":"50・100・150・200・250階は ボスの階。魔王でないコインボス5体(モモンジャガー・スラリンガル・神獣王WORLD・ドン・モジャール・ヨッチーズ)が、1回の中で1体ずつ でたらめな順に出る(同じボスは2回出ない)。300階は マジェス・ドレアムで、倒すと迷宮を終える。迷宮の中の勝ちは、本編のコインボスやマジェス・ドレアムの勝ちの記録には数えない。⏎ボスを倒すと下り階段と いやしの泉(中のゴールドでHPとMPを満タン)が出る。やすみの階と中断の扉は無い。300階まで だれでも 進める。⏎5階ごとと ボスを倒した階で 祝福を1つ選べる。⏎ふつうの階に ときどき店の部屋がある(右クリックで品を見る・しゃがんで右クリックで買う・ふしぎな品を持って右クリックで鑑定)。お金が足りないときに もう一度しゃがんで右クリックすると、払わずに持ち出せるが、迷宮の番兵が追ってくる(階段まで逃げきれば自分の物・その階の店は閉まる)。⏎始める階: いちばん深く倒したボスの階の半分までの 50階ごとの階から始められる(200階のボスまで倒したら 50階・100階から・その階のボスは倒したあとの形)。迷宮の中で体を記すこと(セーブ)は無い。"},{"id":"h_endless3","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"倒れたとき・ごほうび","body":"倒れるとその回はおしまいで、本当の体に戻る(中の品・仲間・Lvは消える)。目をさますのは はじまりの神殿の着く所(噴水の南)。⏎50階ごとのボスを倒すと、星のかけらが「ごほうびの箱」に入り、倒れても持ち帰れる(1人1回・50階 15個・100階 60個・150階 65個・200階 135個〈ほかに称号と虹のトロフィーなど〉・250階 115個・300階 210個〈ほかに称号と金のトロフィー・迷宮の主の証・身にまとう光・SSSのタマゴ〉)。⏎着いた階の数だけ「迷宮の記憶」がたまり、命の灯(倒れても1回起き上がる)・最初の持ち物・中の能力(+12%まで)・中のスカウト(+15%まで)・最初の相棒(前に仲間にした種族から1匹)が増える。⏎迷宮のポイントは、番人の交換所で星のかけらや本編の品と取りかえられる。⏎罠: 紫の沼は毒・ひび割れの床は落とし穴(次の階へ落ちる)。⏎パーティは4人まで。ソロとパーティで最高到達階の記録は別。"},{"id":"h_endless4","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"階のルールと できごと","body":"3階から、ときどき特別なルールの階がある(暗闇・呪文封じ・魔物が多い・毒気〈少しずつHPが減る・毒よけの祝福で防げる〉・宝が多い)。階に着くと知らせが出て、M キーの迷宮の地図の上にも出る(迷宮の地図は M キーで画面に重ねて出し、出したまま歩いて戦える。もう一度 M で消す。場所・大きさ・すけぐあいは GUI位置調整の「迷宮の地図」で変えられる)。⏎ふつうの階の3つに1つほどに できごとがある: 旅の商人・いやしの泉・宝の山・祝福の祭壇(組の全員が祝福を1つ選べる)・冒険者の手記(階段の場所が分かる)・旅の錬金術師(合成のつぼをくれる・持っていれば1段大きくする)。⏎3階から、ひびの入った壁の向こうに隠し部屋があることがある。右クリックで開くと宝箱。⏎迷宮の明るさは DQM設定「見た目・演出」の「迷宮の明るさ」で 0〜100% に変えられる(0%=暗い・50%=はじめ・100%=灯りが無くても昼に近い・自分の画面だけ・魔物の湧き方は変わらない)。暗闇の階・墓所の階は、設定を上げても50%より明るくならない。"},{"id":"h_endless5","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"今日の迷宮と 祝福の極意","body":"入る前の支度で「今日の迷宮」を選ぶと、その日はだれでも同じ形の迷宮に1階から入る。B11F に着くまでの時間を競い、その日はじめて着くとポイント+30(ランキングにも載る)。着いたあとも、ふつうの回と同じように続けられる。⏎祝福は同じ系統(能力・育ち・守り・属性・戦い)を3種そろえると「極意」に目ざめる: 能力の極意 攻撃・守備・魔力・最大HP+5%／育ちの極意 経験値とゴールド×1.15／守りの極意 受ける一撃の上限−0.5割／属性の極意 どの属性の威力も+10%／戦いの極意 迷宮の魔物へのダメージ+8%。"},{"id":"h_endless6","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"特別な部屋","body":"ふつうの階の3つに1つほどに、特別な部屋が1つある(階に着くと知らせが出る)。⏎宝物庫(5階から): 金の扉の向こうに宝箱4〜5つ。鍵はその階のどこかの宝箱に入っている。⏎魔物の巣(4階から): 入ると扉が閉まり、魔物が3回わく。全部たおすと宝箱3つが開く。⏎祈りの間(3階から): 魔物が入れない部屋。祭壇でHPとMPが満タンになり、祝福を1つ選べる(1回だけ)。⏎試練の間(6階から): 時計の台に触れると60秒の試練。時間のうちに全部たおすと宝箱2つとポイント。⏎鏡の間(7階から): 宝箱が6つ。本物は1つで、ほかは ひとくい箱。罠見の祝福・盗賊の型なら本物の上に光が見える。⏎地下の宝物庫(11階から): 床の穴に入ると下の小部屋へ。宝箱4つ。はしごをのぼると戻れる。⏎金色の魔物の部屋(9階から): 入るとメタル系があらわれる。⏎迷宮の店の部屋(10階に1回ほど): 品の上に乗ると値段が出る(買う・持ち上げてあとで払う)。自分の持ち物を店の床に置くと、店主が店の値段の半分で買い取る(はい なら店の品として並ぶ・いいえ なら拾い直せる)。設計図・鍵・ベル・中身の入ったつぼ・だいじなものなどは買い取らない。"},{"id":"h_endless_vault","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"隠れ部屋","body":"2階から、ふつうの階の5つに1つほど(テーマの階は除く)に、通路でつながっていない「隠れ部屋」がある。まわりは壁で囲まれていて、トンネルの杖で壁を掘る(か大部屋の巻物を読む)と入れる。⏎となりの部屋に入ると「この 壁の むこうに 何かある 気がする……」と知らせが出る(その階で1回)。隠れ部屋は入るまで迷宮の地図に出ない(あかりの巻物でも出ない)。⏎中には宝箱2〜3個(ときどき金の箱)・めずらしい品(指輪か杖)1つ・床の品6〜10個(ふしぎな品が多め)・ゴールド3〜5か所。魔物は湧かない。"},{"id":"h_endless7","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"罠・キラキラ・ふしぎな品","body":"2階から罠がある。見える罠(毒の床〈毒10秒・満腹度−5〉・落とし穴〈最大HPの15%で次の階〉)と、床の色の変わらない見えない罠(眠り〈6秒ほとんど動けない〉・転移・魔物呼び〈3体・3階から4体〉・矢〈最大HPの20%〉・ゴールドを落とす・空腹〈満腹度−20〉・地雷〈3階から・最大HPの40%・まわりの床の品が消える〉)。深い階ほど種類が増える(第2弾・見えない罠): 回転板(2階〜・向きがでたらめに)・一方通行(2階〜・床に矢印が見え、逆から入ると押し戻される)・バネ(2階〜・遠くの床へはね飛ばす)・混乱の罠(2階〜)・影ぬい(3階〜・4秒動けない)・丸太(4階〜・はね飛ばす)・落石(4階〜・最大HPの35%)・鉄球(5階〜・まっすぐ転がってくる・当たると最大HPの25%)・装備外し(6階〜・装備が1つ床に落ちる)・さびる罠(9階〜・身につけた防具か盾の強さ−1・−3まで)・呪いの罠(11階〜・持ち物の武器・防具・盾の1つがマイナスになり、いやな効き目が付く)・大型地雷(13階〜・HPが1になる・まわりの魔物も まきこむ・ブロックは壊れない)。1階に8つまで。しゃがんで素手で床を右クリックすると「しらべる」: まわり5マスの罠が見え、近くに隠し部屋があれば すきま風を感じる。⏎床のキラキラ(1つの階に3〜5)を右クリックすると、道具・ゴールド・ふしぎな品・ときどき武具が見つかる。⏎ふしぎな薬・ふしぎな巻物は、使うか店で鑑定するまで正体が分からない(正体は回ごとに入れかわる・分かった正体はその回のあいだ全部に効く)。⏎合成のつぼ: つぼを右クリックで出し入れの画面を開いて品を入れ、「まとめて取り出す」で割ると最後に入れた武器・防具・盾にまとめて出る(まとめる装備が無ければ中身がそのまま出る・1回まとめて取り出すと、枠が残っていても割れてなくなる・旅の錬金術師に大きくしてもらうほど多く入れられる)。同じ種類の装備は+値(この階の上限まで)と武器・盾の印、ほかの品は「迷宮の印」(刃・守り・ぬし討ち・群れ討ち・癒し・魔力・1つの装備に5つ・同じ印は大まで強くなる)を受けつぐ。⏎保存のつぼ(品をしまう・画面で1つずつ「出す」と「全部出す」・割れない)・いやしのつぼ(画面で「割る」と薬草が1段よく効くものになって出る)もある。つぼも中の品も迷宮の中だけ(外へは持ち出せない)。⏎迷宮の設計図: 床の品(8%)と宝箱(2つに1つ)から、装備と同じくらいの率で見つかる。ランクは階で決まる(20階ごとに1つ上がる・1〜20階はランク1)。迷宮の中で右クリックで読むと、本編の設計図帳に記す(1回で消える)。読まずに迷宮を出ると(中断・倒れた・クリア)消える。"},{"id":"h_endless_gear","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"装備の ±の値と鑑定","body":"迷宮で手に入る装備は、近くを殴る武器(剣・勇者の剣・槍・短剣・棍・爪・拳・ハンマー・斧・ムチ)と盾だけ。強さで12段に分かれ、迷宮の中では本編の攻撃力・守備のかわりに「迷宮の攻撃力」「迷宮の守備」(説明に出る)で戦う。その階の段(20階ごとに1段・221階から12段)の品がいちばん出やすく、上の段ほどまれ(どの階でも12段の品は まれに出る)・下の段も2割ほど混ざる。本編の特殊効果は迷宮では効かない。かわりに不思議のダンジョンと同じ「印」(会・竜・満 など)が付くことがあり(35%で1つ・10%で2つ・品ごとの固有の印も)、合成のつぼで同じ種類をまとめると受けつぐ。⏎拾った武器・盾(宝箱・床の品・宝物庫・試練・迷宮の店・キラキラ)には、-2〜+3 の値が付く(0 がいちばん多い)。はじめの武器と持ちこみの装備には付かない。⏎値ははじめ分からない(説明に「？」)。武器はそれで攻撃を当てると、防具と盾は身につけて傷を受けると分かる。目利きの巻物・迷宮の店の鑑定(30＋階G)でも分かる。分かると名前に「+2」「-1」が付く。⏎+1 ごとに攻撃(防具と盾は守備)が +1、マイナスは その分下がる(0 より下にはならない)。きたえの巻物と合成のつぼは、マイナスの装備からも上がる(上限は今までどおり)。⏎マイナスの装備には いやな効き目が1つある(分かる前から、身につけている間は迷宮の中で効く・-2 はより強い・外せなくなることは無い)。はらぺこ(満腹度の減り+)・にぶ足(移動の速さ−)・なまくら(会心率−)・もろさ(受けるダメージ+)・魔力もれ(消費MP+)・びんぼう(魔物のゴールド−)・ものわすれ(経験値−)・ひよわ(最大HP−)。値が0以上になると効き目は消える。"},{"id":"h_endless_staff","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"迷宮の杖","body":"杖(こげ茶の杖など11の見た目)は、右クリックで振ると目の前へ光が飛び、はじめに当たった魔物に効く(壁で止まる)。使える回数は3〜6回で、空でも振れるが何も起こらない。振っただけでは正体も回数も分からない。分かるのは 店の鑑定・識別の巻物・識別のつぼ・識別の指輪・目利きの巻物だけ(「ふきとばしの杖[3]」)。⏎分からないうちは Shift＋右クリックで名前を付ける画面が開き、候補(杖11)のボタンを押すと その見た目に名前が付く(「こげ茶の杖〈ふきとばし?〉」・同じ見た目の品みんなに付き、その回のあいだ残る・「名前を消す」もある・正体が分かると正体の名前になる)。⏎トンネル(向いている方の壁を掘る・外周と特別な部屋・店のまわりは掘れない)・ふきとばし・ひきよせ・いれかえ・かなしばり(攻撃されるまで動けない・時間では解けず、その階を出たら終わり)・どんそく・ふういん(特技と呪文)・いっときしのぎ(階のどこかへ)・いたみわけ(自分の受けた傷の分を相手に)・混乱(30秒 混乱させる)・睡眠(20秒 眠らせる)。ボス・ぬし・迷宮の主には 飛ばす杖は効かず、かなしばり・どんそく・ふういんは弱く、いたみわけは半分、混乱は4秒、睡眠は効かない。"},{"id":"h_endless_pots","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"正体の分からない つぼ","body":"茶色のつぼなど9つの見た目のつぼは、入る数が3〜6。入れる・使う・割るでは正体も入る数も分からない。分かるのは 店の鑑定・識別の巻物・識別のつぼ・識別の指輪・目利きの巻物だけ。分からないうちは Shift＋右クリックか、出し入れの画面の「名前を付ける」で 候補(つぼ9)から名前を付けられる(杖と同じ)。⏎どのつぼも右クリックで出し入れの画面を開く。左が持ち物、右がつぼの中。行を選んでまん中の「入れる →」「← 出す」か、ダブルクリックで移す。入れられない品は灰色で、右にわけが出る。正体の分からないつぼは、どの正体でも同じ画面(入れる・使う・割る)で、入れる前に「入れた瞬間に効くかもしれない」とたしかめる。⏎識別(入れた品の正体が分かる)・変化(べつの品にかわる)・強化(武器・防具の強さ+1)・祝福(マイナスの呪いを+0に)・背中(持っているとうしろからの攻撃が半分)は、入れた品が中に残り、「割る」と中身が全部出て(持ち物に入らない分は足もとへ)つぼは無くなる。換金(品がゴールドに)。底抜け(「使う」で足もとに穴があき、組ごと次の階へ)。魔物(魔物のほうを向いて「使う」と吸いこむ・ボスには効かない)。割れない(保存のつぼと同じで、1つずつ「出す」と「全部出す」ができ、割れない)。⏎合成・保存・いやしのつぼは はじめから正体が分かる。保存と割れないつぼだけ中身を出せて、ほかは割って出す。割る前に「つぼを割りますか？ 中身が全部出る」とたしかめる。店の未払いの品は どのつぼにも入らない。"},{"id":"h_endless_scrolls","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"巻物のいろいろ","body":"巻物の見た目は19。前からの地図・目利き・ともしび(前の「あかりの巻物」・夜目)・きたえ・呼び声・旅に、13種が加わった。⏎大部屋(内がわの壁が消える)・かなしばり(まわりの魔物が 攻撃されるまで動けない・その階を出たら終わり)・聖域(読まずに床に置くと、まわりに魔物が近づけない)・あかり(階の地図がぜんぶ見える)・識別(品1つの正体)・おはらい(装備の呪いを+0に)・バクスイ(見えている魔物が眠る)・混乱(見えている魔物が混乱)・天の恵み(身につけた武器か防具が+1)・白紙(知っている巻物の名前を選んで、その巻物として使う)・メッキ(盾か防具1つが、さびる罠・呪いの罠に かからなくなる)・ワナけし(階の罠が消える)・真空斬り(見えている魔物に、最大HPの25%の真空の刃)。ボス・ぬしには かなしばりは足どめだけ、バクスイは効かず、混乱は短く、真空斬りは最大HPの8%。"},{"id":"h_endless_rings","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"迷宮の指輪","body":"迷宮では ときどき指輪が見つかる(床の品・宝箱・店)。はじめは「銀の指輪」「骨の指輪」のような見た目の名前だけで、どの見た目がどの正体かは回ごとに変わる。⏎インベントリの DQMのタブの 指輪の枠に付けると効き、付けたときに正体が分かる(迷宮の店の鑑定・識別の巻物・目利きの巻物・識別のつぼでも分かる)。効き目は迷宮の中だけで、同じ指輪を2つ付けても1つ分。⏎【ちからの指輪】与えるダメージ+15%【まもりの指輪】受けるダメージ−15%【会心の指輪】会心率+10%(上限50%の中で)【ハラヘラズの指輪】満腹度の減りが半分【回復の指輪】2秒ごとに最大HPの1%回復(満腹度が0のときは効かない)【眠らずの指輪】眠り・混乱・目くらましにかからない【ワナ師の指輪】罠が見え、踏んでもかからない(一方通行の床も押し戻されない)【識別の指輪】持っている迷宮の品の正体が分かる【透視の指輪】その階の魔物と床の品が光って見える(壁ごしにも)【毒消しの指輪】毒にかからない【呪いよけの指輪】付けている間は呪われた指輪も外せ、呪いの指輪の悪い効き目も消える【錆よけの指輪】身につけた防具と盾が さびる罠で さびない【弾きよけの指輪】攻撃ではじき飛ばされない⏎【呪い】呪いの指輪は、はらぺこ(満腹度の減り2倍)・もろさ(受けるダメージ+20%)・ひよわ(与えるダメージ−20%)のどれか。呪いの指輪と、ときどきある呪われた指輪は、付けると外せない。おはらいの巻物か祝福のつぼで呪いが解けると外せる(呪いの指輪の悪い効き目は、付けている間は残る)。⏎迷宮の中だけの品なので、外へは持ち出せない。"},{"id":"h_endless8","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"試しの迷宮","body":"最高到達がB6Fをこえると、入る前の支度で「試しの迷宮」を選べる。⏎持ちこみの装備・能力盤・祝福がきかない、腕だけの迷宮。B50Fの ボスを たおすと おしまい。⏎いちばん深く着いた階と時間はランキングの別の欄に載る。"},{"id":"h_endless9","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"果てなき迷宮","title":"迷宮のポイントの交換所","body":"迷宮のポイントは、階に着くたび(1階ごとに (1＋階×5÷100)×3)・50階ごとのボスを倒すと(50階 150・100階 250・150階 350・200階 450・250階 550・300階 1,000・はじめて倒すと2倍)たまる(倒れても残る)。300階を通すと 2回目から 約10,000・はじめてなら 約20,000。入る前の支度の画面の④に「10階すすむ・50階すすむ」でもらえる目安、回が終わると「この回の 迷宮のポイント」と次の目安が出る(最高到達をこえた階は2倍)。神殿の星のうらの間の番人の交換所で、本編で役立つ品と替えられる(迷宮の外でだけ・替えた品は持ち物へ・入らなければ足もと)。⏎◆星のかけら: 1個30ポイント。⏎◆素材(系統の素材1個・土地の素材5個)と DQM鉱石(5個ずつ): 迷宮で着いたいちばん深い階の帯のランクまで(20階ごとに1ランク・下のランクの品も替えられる)。⏎◆中ボスの魔石と魔王の素材: 本編でそのランクの魔王を倒したものまで。1日に 魔石は種類ごとに10個・魔王の素材は種類ごとに3個まで(現実の日で数え直す)。⏎◆スキルポイント+5: 迷宮の枠で合わせて500SPまで(死んでも盤を初期化しても残る)。替えるほど値段が上がる(1〜40回目35・41〜80回目50・81〜100回目70ポイント)。⏎旅を終えたあとは、能力盤とポイントを分け合って使う。"},{"id":"ww_01","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"はじめに","title":"ゆがみの大地とは","body":"空に浮かぶ島々に、十二の世界のかけらが流れついてできた世界。まん中に「ゆがみの都」、まわりに輪のように島が並ぶ。⏎◆行き方: 神殿の「星のうらの間」の旅の扉から都へ。都の正門の内がわに神殿へ戻る扉がある。⏎◆島へ: 都の広場の南の4つの旅の扉から、それぞれの島の「迷子の旅の扉のほこら」へ(帰りの扉・神父・DQMベッドがある)。⏎◆都と島のほこらは、着くとルーラ・キメラの自動登録に入る。⏎◆魔物はどの島もクリア後の強さ。"},{"id":"ww_02","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"はじめに","title":"写し身と物語","body":"ゆがみの大地の人は、みな どこかの世界のだれかに似た「写し身」。自分の本当の名前をおぼえていない。⏎◆都の長は時計塔のてっぺんにいる。都の門番・酒場のおかみ・研究所の学者・島の人などが、物語(できごと帳の「ゆがみの大地」)を持っている。⏎◆頭の上の「！」が、始められる話の目じるし。"},{"id":"ww_03","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"裏ボス","title":"裏ボスと玉座","body":"島の奥や都の時計塔の地下には、玉座に座った主がいる。5マスまで近づくと台詞が始まり、読み終えると魔王の間へ移って戦う(はじめての台詞はとばせない・2回目から ESC)。島11の邪神ニズゼルファ（極）だけは「邪神の座」で戦う(エンディングの最後の戦いと同じ形・闇の衣は60秒で戻る・HP が半分を切ると（真）の技もまざる)。⏎◆だれかが倒すと玉座の主は消え、祭壇に触れると何度でも再戦できる。勝つたびに10%ずつ強くなる(2倍まで)。⏎◆主ごとに弱点の行いがある(2回目の戦いから画面の上に出る)。"},{"id":"ww_04","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"裏ボス","title":"裏ボスのごほうび","body":"はじめて倒すと(人ごと): その主の名前の「ゆがみ断ちの武器」1本(ランク12のお店の最強と同じ強さ＋特殊効果)・ゆがみのトロフィー(マイホームに飾れる)・称号・スキルポイント(ゆがみの大地の枠・合わせて200まで)。⏎◆再戦で +10% を5回重ねた強さからは、勝つたびに5%で その主の姿のタマゴが出る(1体1回)。再戦に勝つと、1体ごとに1日1個 星のかけらももらえる。⏎◆時計塔の番人は称号とスキルポイントだけ。⏎◆島7の主だけは、はじめて倒すと その姿のタマゴが必ず出る。挑めるのは、遺跡の奥の あたたかな光の主を 倒した人だけ。"},{"id":"ww_05","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"毎日のできごと","title":"ゆがみの嵐","body":"ゲームの1日に1回、どこかの島に「ゆがみの嵐」が吹く(ゆがみの大地に入ったときに知らせる)。⏎◆嵐の島で魔物を倒すと、ときどき ランク12のレア素材が出る。⏎◆1日は寝ても進まない時計で数える。"},{"id":"ww_06","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"島めぐり","title":"虹の橋の浮き石の道","body":"島と島のあいだに浮かぶ石の道。三つの目じるしの石を順に通って、いちばん奥の石板まで行く(橋守の写し身の物語)。⏎◆落ちると下まで落ちるので気をつける。目じるしは高さも見るので、下を通っても数えない。"},{"id":"ww_rankup1","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"仲間のランク上げ","title":"ランク上げのきほん","body":"星降りの大会に優勝したあとは、どの魔物の仲間でも 配合ランクを1段ずつ上げられる(SSS まで・勇者は上げられない)。⏎DQMメニュー「ペットの詳細」で仲間を選び、「ランクを上げる」を押すと、要る星のかけらの数と条件を確かめる画面が出る。⏎要る星のかけら: I→H 1・H→G 1・G→F 2・F→E 2・E→D 3・D→C 4・C→B 5・B→A 6・A→S 8・S→SS 10・SS→SSS 15(I から SSS まで57個)。⏎S 以上に上げるとき(A→S・S→SS・SS→SSS)だけ、その子が Lv100 になっている必要がある。⏎上げると その子は Lv1 に戻り、新しいランクの伸び方で育ち直す。スキル・特性・装備・なつき度・転生の回数はそのまま(Lv で開く特性は、育て直すとまた開く)。⏎上げた子はランクの横に ★と上げた段の数が付く(例: SSS★11)。配合の親にしたときは、種族のもとのランクで数える。闘技場の「ランク以下だけ」は、上げたランクで数える。"},{"id":"ww_rankup2","unlockStage":4,"majorCategory":"ゆがみの大地","minorCategory":"仲間のランク上げ","title":"星のかけらと昇格の試練","body":"星のかけらは、ゆがみの大地と果てなき迷宮で手に入る。⏎ゆがみの大地: 魔物(強い魔物ほど落としやすい・嵐の島では2倍)・時空の裂け目の強敵・建物の金と紫の宝箱・キラキラ・裏ボス(はじめての勝ちで3個、再戦は1体ごとに1日1個)。⏎果てなき迷宮: 101階からの魔物と宝の部屋の箱・ぬし・大ぬし・迷宮の主。迷宮で見つけたかけらは「ごほうびの箱」に入り、迷宮を出たときに受け取る。⏎S→SS と SS→SSS は、かけらに加えて「昇格の試練」に勝つ必要がある。確かめの画面の「試練に挑む」で、その子1匹だけが魔王の間で戦う(ほかの仲間は連れていけない・プレイヤーは見ているだけで手出しできない)。⏎制限時間は10分。時間内に倒せないと「時間切れ」で負けになる(残り時間は画面の上の札に出る・GUI位置調整の「昇格の試練の残り時間」で動かせる)。相手は、上がれる最低の Lv100 で Lv に合う装備なら4分ほどで倒せる強さ。⏎試練に勝ったときに かけらを使ってランクが上がる。負けても かけらは減らず、子は元気になって戻る。何度でも挑める。"},{"id":"sh_01","unlockStage":4,"majorCategory":"神竜の天界","minorCategory":"はじめに","title":"神竜の天界とは","body":"雲の上に浮かぶ天界。南の「雲の門」から雲の道で4つの島(風・花・泉・古戦場)をめぐり、まん中の「らせんの塔」(高さ200)のてっぺんで神竜が待つ。⏎◆行き方: 神殿の「星のうらの間」の東の「天界の扉」から雲の門へ。雲の門の帰りの扉で星のうらの間へ戻る。⏎◆雲の下へ落ちても、風が雲の門まで はこんでくれる。⏎◆魔物は自然には湧かない。ブロックは壊せず置けない。"},{"id":"sh_02","unlockStage":4,"majorCategory":"神竜の天界","minorCategory":"島の主","title":"4つの島の主と虹の橋","body":"島の奥には、玉座に座った主がいる。5マスまで近づくと台詞が始まり、魔王の間へ移って戦う(2回目から ESC でとばせる)。⏎◆だれかが主を倒すと、その島から塔のふもとへ虹の橋がかかる。4体とも倒すと、塔の入口の結界(4つの宝珠の扉)が消える。⏎◆はじめて倒すと、島の宝珠・称号・ゴールド・天界の雲石。2回目からは天界の雲石。⏎◆島ごとに名品の宝箱が1つある(人ごとに1回)。"},{"id":"sh_03","unlockStage":4,"majorCategory":"神竜の天界","minorCategory":"神竜","title":"神竜と願い","body":"らせんの塔のてっぺんの祭壇で神竜が待つ。近づくと台詞から魔王の間へ。⏎◆はじめて倒すと、どの願いでも1つかなえてもらえる(称号「神竜に願いし者」・スキルポイント+20も)。⏎◆2回目からは、戦いが始まってから8分以内に倒すと、3つの候補から1つ選べる。8分をこえると願いは無い。⏎◆願いの画面を閉じても、神竜の祭壇に触れるともう一度開く。⏎◆願いの例: SSSのタマゴを選ぶ・神竜のうろこ・神竜の首飾り(1回だけ)・スキルポイント+10(合わせて100まで)・騎乗ゲージ+10・ゴールド・主の証・防衛戦のメダル・仲間の性格を選び直す・スキルパネルのやり直し・まだ見ぬ設計図3枚・神竜のかご(1回だけ)。"}],"generatedAt":"2026/10/29 10:20:28(攻略情報: DQMVII 1.05.70)"}</script>
  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var rows = data.rows;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }

    function formatBody(body) {
      return escapeHtml(body).split('⏎').join('<br>');
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var filtered = rows.filter(function (r) {
        return !query || r.title.toLowerCase().indexOf(query) !== -1 || r.body.toLowerCase().indexOf(query) !== -1;
      });

      var majors = [];
      var byMajor = {};
      filtered.forEach(function (r) {
        if (!byMajor[r.majorCategory]) { byMajor[r.majorCategory] = { minors: [], byMinor: {} }; majors.push(r.majorCategory); }
        var g = byMajor[r.majorCategory];
        if (!g.byMinor[r.minorCategory]) { g.byMinor[r.minorCategory] = []; g.minors.push(r.minorCategory); }
        g.byMinor[r.minorCategory].push(r);
      });

      var html = majors.map(function (major) {
        var g = byMajor[major];
        var minorsHtml = g.minors.map(function (minor) {
          var itemsHtml = g.byMinor[minor].map(function (r) {
            return '<details class="entry" id="guide-' + escapeHtml(r.id) + '"><summary>' + escapeHtml(r.title) + '</summary>' +
              '<div class="entry-stats">' + formatBody(r.body) + '</div></details>';
          }).join('');
          return '<h3>' + escapeHtml(minor) + '</h3>' + itemsHtml;
        }).join('');
        return '<div class="guide-section"><h2>' + escapeHtml(major) + '</h2>' + minorsHtml + '</div>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当する項目がありません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    render();

    expandHashDetails();
  })();
  </script>
</body>
</html>
