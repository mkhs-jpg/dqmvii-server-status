  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var structures = data.structures;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    var CATEGORY_LABELS = { facility: '施設', dungeon: 'ダンジョン' };
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }


    var activeCategory = 'all';
    var CATEGORIES = ['all', 'facility', 'dungeon'];

    function renderTabs() {
      document.getElementById('categoryTabs').innerHTML = CATEGORIES.map(function (c) {
        var label = c === 'all' ? '全区分' : CATEGORY_LABELS[c];
        return '<button class="tab-btn' + (c === activeCategory ? ' active' : '') + '" data-cat="' + c + '">' + label + '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#categoryTabs .tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeCategory = btn.dataset.cat;
          renderTabs();
          render();
        });
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var rows = structures.filter(function (s) {
        if (activeCategory !== 'all' && s.category !== activeCategory) return false;
        return !query || s.name.toLowerCase().indexOf(query) !== -1;
      }).map(function (s) {
        return '<tr><td>' + escapeHtml(CATEGORY_LABELS[s.category] || s.category) + '</td><td>' + escapeHtml(s.name) +
          '</td><td>' + s.width + '×' + s.height + '×' + s.depth + '</td><td>' + s.npcCount + '</td></tr>';
      }).join('');
      document.getElementById('content').innerHTML =
        '<table><thead><tr><th>区分</th><th>名前</th><th>サイズ(幅×高さ×奥行)</th><th>NPC数</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="4" class="empty">該当する建築物がありません</td></tr>') + '</tbody></table>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    renderTabs();
    render();
  })();
  </script>
